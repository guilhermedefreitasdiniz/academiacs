sse fechamento mensal que transforma o acompanhamento do dia a dia em uma visão real de evolução da carteira ao longo do tempo.</p>\n<h2 id=\"organização-da-agenda\"><strong>Organização da\nagenda</strong></h2>\n<p>O CS deve reservar tempo para:</p>\n<ul>\n<li><p>reuniões;</p></li>\n<li><p>preparação;</p></li>\n<li><p>follow-up;</p></li>\n<li><p>registro;</p></li>\n<li><p>análise da carteira;</p></li>\n<li><p>estudo do produto;</p></li>\n<li><p>desenvolvimento técnico;</p></li>\n<li><p>alinhamentos internos.</p></li>\n</ul>\n<p>Uma agenda ocupada apenas por reuniões reduz a capacidade de\nanalisar, registrar e agir.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 152\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#C0264F\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#1E8E5A\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Sem rotina</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Com rotina</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">pendência esquecida</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">risco descoberto tarde</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">problema pego cedo</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">conta sob controle</text></svg><div class=\"diagram-caption\">A diferença entre apagar incêndio e conduzir a conta com previsibilidade</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 3\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 1}, {"id": "upsell", "num": 11, "title": "Upsell", "subtitle": "Lock-in, oportunidades e comissionamento", "lessons": [{"id": "l54", "title": "Upsell", "html": "<h1 id=\"upsell\"><strong>UPSELL</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#F0EFF4\" height=\"180\" rx=\"14\" stroke=\"#E4E1EE\" width=\"300\" x=\"30\" y=\"20\"></rect>\n<rect fill=\"#2B2361\" height=\"180\" rx=\"14\" width=\"300\" x=\"370\" y=\"20\"></rect>\n<text fill=\"#2B2361\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" x=\"180\" y=\"52\">Lock-in</text>\n<text fill=\"#F2C230\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" x=\"520\" y=\"52\">Upsell</text>\n<text fill=\"#5B5578\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"75\">sem custo adicional</text>\n<text fill=\"#5B5578\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"92\">não gera receita nova</text>\n<text fill=\"#5B5578\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"109\">não é comissionável</text>\n<text fill=\"#2B2361\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"180\" y=\"135\">fortalece a permanência</text>\n<text fill=\"#2B2361\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"180\" y=\"153\">da plataforma na operação</text>\n<text fill=\"#C9C3E6\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"75\">tem custo adicional</text>\n<text fill=\"#C9C3E6\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"92\">gera receita recorrente</text>\n<text fill=\"#C9C3E6\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"109\">pode gerar comissão</text>\n<text fill=\"#F2C230\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"520\" y=\"135\">aumenta a receita</text>\n<text fill=\"#F2C230\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"520\" y=\"153\">da conta</text>\n<rect fill=\"#fff\" height=\"24\" rx=\"7\" stroke=\"#E4E1EE\" width=\"180\" x=\"90\" y=\"170\"></rect>\n<text fill=\"#2B2361\" font-size=\"10.5\" text-anchor=\"middle\" x=\"180\" y=\"186\">JBP, Planta de Loja, Pipe</text>\n<rect fill=\"#3a3080\" height=\"24\" rx=\"7\" width=\"180\" x=\"430\" y=\"170\"></rect>\n<text fill=\"#fff\" font-size=\"10.5\" text-anchor=\"middle\" x=\"520\" y=\"186\">Rodada, Workflow Premium</text>\n</svg><div class=\"diagram-caption\">Lock-in fortalece a permanência da plataforma. Upsell aumenta a receita da conta.</div></div>\n<p>No Enterprise, expansão significa <strong>upsell</strong>.</p>\n<p>Upsell acontece quando o cliente contrata uma nova funcionalidade,\nmódulo ou solução que gera receita adicional para a Meu Cliente.</p>\n<p>Aumentar acessos, envolver uma nova área ou melhorar a utilização de\nalgo que já está contratado não é upsell. Isso faz parte da adoção e da\nconsolidação.</p>\n<h2 id=\"lock-in-e-upsell-são-diferentes\"><strong>Lock-in e upsell são\ndiferentes</strong></h2>\n<h3 id=\"lock-in\"><strong>Lock-in</strong></h3>\n<p>São funcionalidades incluídas que aumentam o valor percebido e tornam\na plataforma mais presente na operação.</p>\n<ul>\n<li><p>não possuem custo adicional;</p></li>\n<li><p>não geram receita incremental;</p></li>\n<li><p>não são comissionáveis.</p></li>\n</ul>\n<p>O objetivo é fortalecer a permanência e a relevância da\nplataforma.</p>\n<h3 id=\"upsell-1\"><strong>Upsell</strong></h3>\n<p>São funcionalidades ou soluções vendidas separadamente.</p>\n<ul>\n<li><p>possuem custo adicional;</p></li>\n<li><p>geram receita recorrente ou pontual;</p></li>\n<li><p>podem gerar comissão para o time de CS.</p></li>\n</ul>\n<p>O objetivo é aumentar a receita da conta por meio de uma necessidade\nreal do cliente.</p>\n<h2 id=\"funcionalidades-classificadas-como-upsell-no-material-atual\"><strong>Funcionalidades\nclassificadas como upsell no material atual</strong></h2>\n<p>De acordo com o guia enviado:</p>\n<ul>\n<li><p>Rodada de Negócios: ativa;</p></li>\n<li><p>Paula: ativa;</p></li>\n<li><p>Workflow Premium: ativo;</p></li>\n<li><p>Tela de Sell-out: em lançamento;</p></li>\n<li><p>Calendário de Visitas: em stand by, com previsão indicada para o\nterceiro trimestre de 2026.</p></li>\n</ul>\n<p>Já Tela de <strong>JBP</strong>, Planta de Loja e Pipe de Vendas aparecem no material\ncomo funcionalidades de <strong>lock-in</strong>, sem custo adicional e sem comissão.</p>\n<h2 id=\"como-identificar-uma-oportunidade\"><strong>Como identificar uma\noportunidade</strong></h2>\n<p>O CS deve observar:</p>\n<ul>\n<li><p>problema recorrente que não é atendido pelo escopo\natual;</p></li>\n<li><p>necessidade apresentada pelo cliente;</p></li>\n<li><p>processo manual com impacto relevante;</p></li>\n<li><p>interesse em uma funcionalidade adicional;</p></li>\n<li><p>mudança de prioridade;</p></li>\n<li><p>demanda de uma nova área;</p></li>\n<li><p>potencial de geração de receita ou eficiência;</p></li>\n<li><p>aderência entre a necessidade e um produto disponível.</p></li>\n</ul>\n<h2 id=\"perguntas-úteis\"><strong>Perguntas úteis</strong></h2>\n<p>Antes de avançar, vale entender:</p><ul>\n<li><p>Qual problema o cliente quer resolver?</p></li>\n<li><p>Como esse processo funciona hoje?</p></li>\n<li><p>Qual é o impacto atual?</p></li>\n<li><p>Quem será responsável pelo uso?</p></li>\n<li><p>Existe orçamento?</p></li>\n<li><p>Quem decide?</p></li>\n<li><p>A funcionalidade está disponível?</p></li>\n<li><p>Qual é o modelo comercial?</p></li>\n<li><p>Existe capacidade de implantação e adoção?</p></li>\n</ul><p>Sem essas respostas, é fácil confundir uma curiosidade do cliente com uma oportunidade real, o que costuma gerar expectativa sem necessidade.</p>\n<h2 id=\"o-que-o-cs-não-deve-fazer\"><strong>O que o CS não deve\nfazer</strong></h2>\n<p>Para conduzir bem a oportunidade, o CS evita:</p><ul>\n<li><p>oferecer um upsell sem relação com uma necessidade;</p></li>\n<li><p>prometer funcionalidade ainda indisponível;</p></li>\n<li><p>apresentar preço sem conferir o material oficial;</p></li>\n<li><p>negociar condições diferentes sem aprovação;</p></li>\n<li><p>vender e abandonar a adoção;</p></li>\n<li><p>tratar lock-in como upsell;</p></li>\n<li><p>apresentar algo em desenvolvimento como produto\nfinalizado.</p></li>\n</ul><p>Cada um desses erros tende a comprometer não só a venda em si, mas a confiança do cliente na condução de toda a conta.</p>\n<h2 id=\"tela-de-sell-out\"><strong>Tela de Sell-out</strong></h2>\n<p>O guia enviado apresenta dois modelos de contratação: cobrança por\nindústria cadastrada ou valor mensal fixo.</p>\n<p>As faixas indicadas no material são:</p>\n<h3 id=\"varejista-de-grande-porte-acima-de-r-3-bilhões\"><strong>Varejista de\ngrande porte: acima de R$ 3 bilhões</strong></h3>\n<p>As condições indicadas para esse porte são:</p><ul>\n<li><p>R$ 1.000 por indústria ao mês; ou</p></li>\n<li><p>R$ 9.000 mensais em valor fixo.</p></li>\n</ul><p>Essas duas opções costumam ser apresentadas juntas, para que o cliente escolha o modelo mais adequado ao volume de indústrias que participam do programa.</p>\n<h3 id=\"varejista-de-médio-porte-entre-r-1-bilhão-e-r-3-bilhões\"><strong>Varejista\nde médio porte: entre R$ 1 bilhão e R$ 3 bilhões</strong></h3>\n<p>As condições indicadas para esse porte são:</p><ul>\n<li><p>R$ 750 por indústria ao mês; ou</p></li>\n<li><p>R$ 6.000 mensais em valor fixo.</p></li>\n</ul><p>Essas duas opções costumam ser apresentadas juntas, para que o cliente escolha o modelo mais adequado ao volume de indústrias que participam do programa.</p>\n<h3 id=\"varejista-de-pequeno-porte-abaixo-de-r-1-bilhão\"><strong>Varejista\nde pequeno porte: abaixo de R$ 1 bilhão</strong></h3>\n<p>As condições indicadas para esse porte são:</p><ul>\n<li><p>R$ 500 por indústria ao mês; ou</p></li>\n<li><p>R$ 6.000 mensais em valor fixo.</p></li>\n</ul>\n<p>Essas condições precisam ser validadas no material comercial vigente\nantes de serem apresentadas.</p>\n<h2 id=\"calendário-de-visitas\"><strong>Calendário de\nVisitas</strong></h2>\n<p>O material enviado classifica o Calendário de Visitas como upsell,\ncom precificação equivalente a 10% da mensalidade do cliente.</p>\n<p>Seu status está indicado como stand by, com previsão de ativação no\nterceiro trimestre de 2026.</p>\n<p>O CS não deve ofertá-lo como ativo até receber a confirmação\noficial.</p>\n<h2 id=\"comissão-de-upsell-recorrente\"><strong>Comissão de upsell\nrecorrente</strong></h2>\n<p>O guia informa que:</p>\n<ul>\n<li><p>70% da primeira mensalidade do upsell recorrente é destinada ao\ntime;</p></li>\n<li><p>desse valor, 70% fica com quem realizou a venda;</p></li>\n<li><p>os outros 30% são divididos com o restante do time.</p></li>\n</ul>\n<p>As regras devem ser confirmadas antes do fechamento e do cálculo da\ncomissão.</p>\n<h2 id=\"rodada-de-negócios\"><strong>Rodada de Negócios</strong></h2>\n<p>O documento estabelece uma bonificação de acordo com o faturamento\ngerado para a Meu Cliente:</p>\n<ul>\n<li><p>entre R$ 200 mil e R$ 300 mil: bônus de R$ 10 mil para o\ntime;</p></li>\n<li><p>entre R$ 301 mil e R$ 400 mil: bônus de R$ 15 mil;</p></li>\n<li><p>acima de R$ 401 mil: bônus de R$ 20 mil.</p></li>\n</ul>\n<p>O pagamento acontece de acordo com o recebimento da Meu Cliente.</p>\n<h2 id=\"processo-de-upsell\"><strong>Processo de upsell</strong></h2>\n<p>Do primeiro contato até a adoção, o caminho segue estes passos:</p><ol type=\"1\">\n<li><p>Identificar a necessidade;</p></li>\n<li><p>Confirmar aderência da solução;</p></li>\n<li><p>Registrar a oportunidade;</p></li>\n<li><p>Validar produto, disponibilidade e preço;</p></li>\n<li><p>Envolver a liderança ou o responsável comercial;</p></li>\n<li><p>Apresentar a proposta;</p></li>\n<li><p>Registrar a decisão;</p></li>\n<li><p>Acompanhar o fechamento;</p></li>\n<li><p>Garantir a implantação;</p></li>\n<li><p>Acompanhar a adoção do que foi vendido.</p></li>\n</ol>\n<p>Vender sem garantir o uso gera receita no curto prazo e risco no\nmédio prazo.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 640 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"580\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Necessidade</tspan><tspan x=\"60\" dy=\"13\">do cliente</tspan></text><polygon points=\"120,38 130,42 120,46\" fill=\"#C41E68\"/><circle cx=\"190\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"190\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"190\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"190\" dy=\"0\">Funcionalidade</tspan><tspan x=\"190\" dy=\"13\">aderente</tspan></text><polygon points=\"250,38 260,42 250,46\" fill=\"#C41E68\"/><circle cx=\"320\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"320\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"320\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"320\" dy=\"0\">Proposta</tspan></text><polygon points=\"380,38 390,42 380,46\" fill=\"#C41E68\"/><circle cx=\"450\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"450\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"450\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"450\" dy=\"0\">Fechamento</tspan></text><polygon points=\"510,38 520,42 510,46\" fill=\"#C41E68\"/><circle cx=\"580\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"580\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"580\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"580\" dy=\"0\">Adoção</tspan></text></svg><div class=\"diagram-caption\">Um upsell só está completo quando o que foi vendido é realmente usado</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l6-6 4 4 8-8\"/><path d=\"M15 6h6v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 1}, {"id": "modelos", "num": 12, "title": "Modelos de Comunicação", "subtitle": "E-mails, atas e planos de ação prontos para usar", "lessons": [{"id": "mod1", "title": "32.1. Boas-vindas após o kick-off", "html": "<h1>32.1. Boas-vindas após o kick-off</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Seja bem-vindo à Meu Cliente</div>\n  <div class=\"email-body\"><p>Olá, [Nome].</p><p>Aqui é o [Seu nome] e serei o responsável por acompanhar e conduzir o\nprojeto de vocês junto à Meu Cliente.</p><p>Neste primeiro momento, entraremos na etapa de implantação e\nparametrização da plataforma. O [Nome do implantador], que está em\ncópia, será o responsável por conduzir essa etapa junto comigo.</p><p>Estou enviando em anexo a apresentação utilizada na nossa reunião e\nas planilhas que precisarão ser preenchidas durante a implantação.</p><p>É importante acompanharmos os prazos de perto, porque essa etapa será\nfundamental para começarmos a operação com os processos, usuários e\ninformações corretas.</p><p>Qualquer dúvida ou necessidade de apoio, podem falar comigo pelo\nWhatsApp ou responder por aqui.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Pessoa</tspan><tspan x=\"60\" dy=\"13\">nova</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Apresentação</tspan><tspan x=\"230\" dy=\"13\">do CS</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Primeiros</tspan><tspan x=\"400\" dy=\"13\">passos</tspan></text></svg><div class=\"diagram-caption\">O primeiro contato define o tom de toda a parceria</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod2", "title": "32.2. Ata de reunião", "html": "<h1>32.2. Ata de reunião</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Reunião de alinhamento: Meu Cliente &amp;\n[Nome do varejo], [Data]</p><p>Olá, pessoal.</p><p>Obrigado pelo papo de hoje.</p><p>Abaixo estão os principais combinados e prazos da nossa reunião:</p><p><strong>Equipe Meu Cliente</strong></p><ol type=\"1\">\n<li><p>[Atividade], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Atividade], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Atividade], responsável: [Nome], prazo: [Data].</p></li>\n</ol><p><strong>Equipe [Nome do varejo]</strong></p><ol type=\"1\">\n<li><p>[Atividade], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Atividade], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Atividade], responsável: [Nome], prazo: [Data].</p></li>\n</ol><p>[Inclua aqui um parágrafo curto sobre o momento do projeto. Exemplo:\nCom a conclusão dessas atividades, conseguiremos iniciar o uso do\nprocesso de campanhas na data combinada.]</p><p>Nossa próxima reunião está marcada para [Data e horário].</p><p>Qualquer dúvida, estou à disposição.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 90\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Reunião</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Combinados</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Responsável</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Prazo</tspan></text></svg><div class=\"diagram-caption\">Uma ata sem responsável e prazo não é registro, é só lembrança</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod3", "title": "32.3. Apresentação do CS após a transição", "html": "<h1>32.3. Apresentação do CS após a transição</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Acompanhamento Meu Cliente &amp; [Nome do\nvarejo]</p><p>Olá, pessoal.</p><p>Como alinhamos na nossa reunião, a partir de agora ficarei\nresponsável pelo acompanhamento da conta de vocês junto à Meu\nCliente.</p><p>Recebi do time de Implantação o histórico do projeto, os processos\nconfigurados, as integrações e as pendências atuais.</p><p>Neste primeiro momento, vamos concentrar o acompanhamento em:</p><ol type=\"1\">\n<li><p>[Prioridade 1];</p></li>\n<li><p>[Prioridade 2];</p></li>\n<li><p>[Prioridade 3].</p></li>\n</ol><p>Também manteremos nossa reunião mensal para acompanhar o uso da\nplataforma, as pendências e os próximos passos.</p><p>Podem contar comigo para organizar as demandas e conectar vocês às\náreas responsáveis sempre que necessário.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"20\" y=\"55\" width=\"150\" height=\"60\" rx=\"12\" fill=\"#2B2361\"/><text x=\"95\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">Implantação</text><rect x=\"390\" y=\"55\" width=\"150\" height=\"60\" rx=\"12\" fill=\"#C41E68\"/><text x=\"465\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">CS</text><line x1=\"170\" y1=\"85\" x2=\"388\" y2=\"85\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><polygon points=\"380,78 392,85 380,92\" fill=\"#F2C230\"/><rect x=\"200\" y=\"20\" width=\"160\" height=\"82\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"38\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Histórico</text><text x=\"280\" y=\"56\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Processos</text><text x=\"280\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Pendências</text></svg><div class=\"diagram-caption\">O cliente precisa sentir que nada se perdeu na troca de responsável</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod4", "title": "32.4. Confirmação de reunião", "html": "<h1>32.4. Confirmação de reunião</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Confirmação de reunião: Meu Cliente &amp;\n[Nome do varejo]</p><p>Olá, pessoal.</p><p>Passando para confirmar nossa reunião no dia [Data], às\n[Horário].</p><p>Vamos utilizar o encontro para revisar:</p><ol type=\"1\">\n<li><p>[Assunto];</p></li>\n<li><p>[Assunto];</p></li>\n<li><p>[Assunto].</p></li>\n</ol><p>Caso exista algum outro tema que vocês queiram incluir, podem me\nenviar por aqui.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 162\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"134\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Uma boa confirmação traz</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Data e horário</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Pauta resumida</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Espaço para incluir temas</text></svg><div class=\"diagram-caption\">Confirmar não é só lembrar a data, é alinhar o que será discutido</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod5", "title": "32.5. Envio de pauta", "html": "<h1>32.5. Envio de pauta</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Pauta da reunião: Meu Cliente &amp; [Nome do\nvarejo]</p><p>Olá, pessoal.</p><p>Para aproveitarmos bem nossa reunião de [Data], preparei a seguinte\npauta:</p><ol type=\"1\">\n<li><p>Retomada das pendências anteriores;</p></li>\n<li><p>Evolução do uso da plataforma;</p></li>\n<li><p>[Processo ou projeto prioritário];</p></li>\n<li><p>Integrações e temas técnicos;</p></li>\n<li><p>Riscos e bloqueios;</p></li>\n<li><p>Próximos passos.</p></li>\n</ol><p>Caso exista outro assunto importante, me avisem para incluirmos.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Pendências</tspan><tspan x=\"60\" dy=\"13\">anteriores</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Uso da</tspan><tspan x=\"193\" dy=\"13\">plataforma</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Riscos</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Próximos</tspan><tspan x=\"460\" dy=\"13\">passos</tspan></text></svg><div class=\"diagram-caption\">Uma pauta enviada antes evita que a reunião vire só uma atualização solta</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod6", "title": "32.6. Primeiro follow-up", "html": "<h1>32.6. Primeiro follow-up</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Retorno pendente: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, [Nome].</p><p>Passando para retomar o envio de [informação, arquivo ou\nvalidação].</p><p>Precisamos desse retorno até [Data] para conseguirmos [explique o\npróximo passo ou impacto].</p><p>Você consegue nos confirmar o envio dentro desse prazo?</p><p>Obrigado!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Pedido</tspan><tspan x=\"60\" dy=\"13\">feito</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Silêncio</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Follow-up</tspan><tspan x=\"400\" dy=\"13\">objetivo</tspan></text></svg><div class=\"diagram-caption\">O primeiro follow-up ainda é leve, mas já precisa ter um prazo claro</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod7", "title": "32.7. Segundo follow-up", "html": "<h1>32.7. Segundo follow-up</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Segundo retorno: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, [Nome].</p><p>Ainda não recebemos o retorno sobre [assunto].</p><p>Sem essa informação, não conseguiremos avançar com [etapa ou\nprocesso], o que pode impactar [data, operação ou entrega].</p><p>Precisamos receber o material até [Data]. Caso exista algum\nimpedimento, me avise para ajustarmos o plano.</p><p>Obrigado!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">1º</tspan><tspan x=\"60\" dy=\"13\">follow-up</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Sem</tspan><tspan x=\"230\" dy=\"13\">resposta</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">2º follow-up</tspan><tspan x=\"400\" dy=\"13\">com impacto</tspan></text></svg><div class=\"diagram-caption\">No segundo contato, o impacto do silêncio precisa ficar explícito</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod8", "title": "32.8. Envolvimento da liderança por falta de retorno", "html": "<h1>32.8. Envolvimento da liderança por falta de retorno</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Apoio necessário: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, pessoal.</p><p>Estamos aguardando desde [Data] o retorno sobre [assunto].</p><p>Essa pendência está impedindo o avanço de [processo ou etapa] e pode\nimpactar [consequência].</p><p>Precisamos definir até [Data]:</p><ol type=\"1\">\n<li><p>Quem ficará responsável;</p></li>\n<li><p>Quando a atividade será concluída;</p></li>\n<li><p>Se existe algum bloqueio que precisa ser tratado.</p></li>\n</ol><p>Estou incluindo [Nome da liderança] para nos ajudar a organizar essa\ndefinição.</p><p>Fico no aguardo.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Follow-ups</tspan><tspan x=\"60\" dy=\"13\">sem resposta</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Risco ao</tspan><tspan x=\"230\" dy=\"13\">processo</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Liderança</tspan><tspan x=\"400\" dy=\"13\">envolvida</tspan></text></svg><div class=\"diagram-caption\">Envolver a liderança é o passo depois de esgotar o contato direto</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod9", "title": "32.9. Comunicação de atraso", "html": "<h1>32.9. Comunicação de atraso</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Atualização sobre [demanda ou entrega]</div>\n  <div class=\"email-body\"><p>Olá, pessoal.</p><p>Quero atualizar vocês sobre [assunto].</p><p>Durante a análise, identificamos [motivo objetivo]. Por isso, não\nconseguiremos concluir a atividade na data que havia sido prevista.</p><p>Neste momento:</p><ul>\n<li><p>status atual: [Status];</p></li>\n<li><p>responsável: [Nome ou área];</p></li>\n<li><p>próxima atividade: [Atividade];</p></li>\n<li><p>nova previsão validada: [Data];</p></li>\n<li><p>próximo retorno: [Data].</p></li>\n</ul><p>Seguirei acompanhando o tema e aviso vocês caso exista qualquer\nmudança.</p><p>Peço desculpas pelo impacto.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 162\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"134\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Uma boa comunicação de atraso traz</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Motivo objetivo</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Novo prazo validado</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Próximo retorno combinado</text></svg><div class=\"diagram-caption\">É melhor entregar o problema com um plano do que sem nenhuma resposta</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod10", "title": "32.10. Solicitação de dados ou arquivos", "html": "<h1>32.10. Solicitação de dados ou arquivos</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Solicitação de informações: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, [Nome].</p><p>Para avançarmos com [processo ou integração], precisamos receber as\nseguintes informações:</p><ol type=\"1\">\n<li><p>[Informação];</p></li>\n<li><p>[Informação];</p></li>\n<li><p>[Informação].</p></li>\n</ol><p>O prazo necessário para mantermos a próxima etapa em [Data] é [Data\nde envio].</p><p>Caso algum item não esteja disponível, me avise para alinharmos com o\ntime responsável.</p><p>Obrigado!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">O que</tspan><tspan x=\"60\" dy=\"13\">falta</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Por que</tspan><tspan x=\"230\" dy=\"13\">importa</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Prazo</tspan><tspan x=\"400\" dy=\"13\">necessário</tspan></text></svg><div class=\"diagram-caption\">Pedir um dado sem explicar o motivo costuma demorar mais para voltar</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod11", "title": "32.11. Atualização de integração", "html": "<h1>32.11. Atualização de integração</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Status da integração: [Nome da\nintegração]</p><p>Olá, pessoal.</p><p>Segue a atualização da integração de [Nome]:</p><p><strong>Status atual:</strong> [Status].</p><p><strong>Última atividade concluída:</strong> [Atividade].</p><p><strong>Próxima atividade:</strong> [Atividade].</p><p><strong>Responsável:</strong> [Nome ou área].</p><p><strong>Prazo:</strong> [Data].</p><p><strong>Dependência atual:</strong> [Informação, arquivo, teste ou\naprovação].</p><p>O impacto neste momento é [explique de forma simples].</p><p>Nossa próxima atualização será enviada até [Data].</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Status</tspan><tspan x=\"60\" dy=\"13\">atual</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Última</tspan><tspan x=\"193\" dy=\"13\">atividade</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Próxima</tspan><tspan x=\"327\" dy=\"13\">etapa</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Nova</tspan><tspan x=\"460\" dy=\"13\">atualização</tspan></text></svg><div class=\"diagram-caption\">Manter o cliente informado, mesmo quando ainda não há solução final</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod12", "title": "32.12. Comunicação de risco", "html": "<h1>32.12. Comunicação de risco</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Ponto de atenção: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, pessoal.</p><p>Quero registrar um ponto de atenção que precisamos tratar juntos.</p><p>Identificamos [descreva a situação]. Isso pode impactar [adoção,\nprazo, operação ou resultado].</p><p>Para corrigirmos o cenário, proponho o seguinte plano:</p><ol type=\"1\">\n<li><p>[Ação], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Ação], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Ação], responsável: [Nome], prazo: [Data].</p></li>\n</ol><p>Vamos acompanhar a evolução na nossa próxima reunião de [Data].</p><p>Caso precisem ajustar algum responsável ou prazo, me avisem por\naqui.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Situação</tspan><tspan x=\"60\" dy=\"13\">identificada</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Impacto</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Plano de</tspan><tspan x=\"327\" dy=\"13\">ação</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Próxima</tspan><tspan x=\"460\" dy=\"13\">reunião</tspan></text></svg><div class=\"diagram-caption\">Registrar um risco em conjunto com o cliente, não escondido dele</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod13", "title": "32.13. Retorno sobre feedback", "html": "<h1>32.13. Retorno sobre feedback</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Retorno sobre seu feedback: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, [Nome].</p><p>Obrigado por compartilhar o feedback sobre [assunto].</p><p>Analisamos o tema com [área responsável] e o retorno é o\nseguinte:</p><p>[Explique de forma clara o resultado da análise.]</p><p><strong>Próximo passo:</strong> [Ação].</p><p><strong>Responsável:</strong> [Nome ou área].</p><p><strong>Prazo ou próxima atualização:</strong> [Data].</p><p>Mesmo quando a solicitação não puder ser atendida, o retorno deve\nexplicar o motivo e, quando existir, apresentar uma alternativa.</p><p>Obrigado novamente pelo retorno.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Feedback</tspan><tspan x=\"60\" dy=\"13\">recebido</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Análise</tspan><tspan x=\"230\" dy=\"13\">interna</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Retorno</tspan><tspan x=\"400\" dy=\"13\">ao cliente</tspan></text></svg><div class=\"diagram-caption\">Mesmo quando a resposta é não, o cliente merece saber o motivo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod14", "title": "32.14. Encerramento de demanda", "html": "<h1>32.14. Encerramento de demanda</h1>\n<div class=\"email-card\">\n  <div class=\"email-subject\"><span class=\"email-subject-label\">Assunto</span>Conclusão da demanda: [Assunto]</div>\n  <div class=\"email-body\"><p>Olá, [Nome].</p><p>A demanda relacionada a [assunto] foi concluída.</p><p>O que foi realizado:</p><ol type=\"1\">\n<li><p>[Atividade];</p></li>\n<li><p>[Atividade];</p></li>\n<li><p>[Atividade].</p></li>\n</ol><p>Para confirmarmos o encerramento, preciso que vocês validem [teste,\ninformação ou processo].</p><p>Caso esteja tudo certo, consideraremos o tema concluído.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Demanda</tspan><tspan x=\"60\" dy=\"13\">aberta</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">O que foi</tspan><tspan x=\"230\" dy=\"13\">feito</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Validação</tspan><tspan x=\"400\" dy=\"13\">do cliente</tspan></text></svg><div class=\"diagram-caption\">Uma demanda só encerra de verdade quando o cliente confirma</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod15", "title": "32.15. Agendamento de treinamento", "html": "<h1>32.15. Agendamento de treinamento</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Treinamento da plataforma: [Processo ou\npúblico]</p><p>Olá, pessoal.</p><p>Vamos realizar o treinamento de [tema] no dia [Data], às\n[Horário].</p><p>O objetivo será mostrar:</p><ol type=\"1\">\n<li><p>[Assunto];</p></li>\n<li><p>[Assunto];</p></li>\n<li><p>[Assunto].</p></li>\n</ol><p>É importante que participem as pessoas responsáveis por\n[processo].</p><p>Peço que confirmem os participantes até [Data].</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 162\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"134\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Um bom convite de treinamento traz</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Tema e objetivo</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Data e horário</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Pessoas que precisam participar</text></svg><div class=\"diagram-caption\">O treinamento certo começa com o convite certo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod16", "title": "32.16. Pós-treinamento", "html": "<h1>32.16. Pós-treinamento</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Materiais e próximos passos do\ntreinamento</p><p>Olá, pessoal.</p><p>Obrigado pela participação no treinamento de hoje.</p><p>Estou enviando em anexo [material, gravação ou guia].</p><p>Para colocarmos o conteúdo em prática, os próximos passos serão:</p><ol type=\"1\">\n<li><p>[Atividade], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Atividade], responsável: [Nome], prazo: [Data];</p></li>\n<li><p>[Atividade], responsável: [Nome], prazo: [Data].</p></li>\n</ol><p>Na nossa próxima reunião, vamos revisar as primeiras utilizações e as\ndúvidas que surgirem.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Treinamento</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Material</tspan><tspan x=\"193\" dy=\"13\">enviado</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Próximos</tspan><tspan x=\"327\" dy=\"13\">passos</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Revisão na</tspan><tspan x=\"460\" dy=\"13\">próxima reunião</tspan></text></svg><div class=\"diagram-caption\">O treinamento não termina quando a chamada é encerrada</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod17", "title": "32.17. Identificação de oportunidade de upsell", "html": "<h1>32.17. Identificação de oportunidade de upsell</h1>\n<div class=\"email-card\">\n  \n  <div class=\"email-body\"><p><strong>Título:</strong> Próximo passo para [Processo ou\nnecessidade]</p><p>Olá, [Nome].</p><p>Na nossa última conversa, você comentou sobre a necessidade de\n[problema ou processo].</p><p>Temos uma solução adicional que pode apoiar esse cenário: [Nome da\nfuncionalidade].</p><p>Antes de avançarmos com uma proposta, gostaria de entender\nmelhor:</p><ol type=\"1\">\n<li><p>Como vocês realizam esse processo hoje?</p></li>\n<li><p>Quem seria responsável pelo uso?</p></li>\n<li><p>Qual é o principal resultado esperado?</p></li>\n<li><p>Existe algum prazo para colocar essa solução em\noperação?</p></li>\n</ol><p>Com essas informações, conseguimos validar a aderência e envolver o\ntime responsável pela proposta.</p><p>Abraço!</p></div>\n</div>\n<p class=\"email-hint\">Adapte nomes, datas, responsáveis e prazos antes de enviar. Nenhum modelo deve ser copiado exatamente como está.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Necessidade</tspan><tspan x=\"60\" dy=\"13\">mencionada</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Perguntas de</tspan><tspan x=\"230\" dy=\"13\">qualificação</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Time comercial</tspan><tspan x=\"400\" dy=\"13\">envolvido</tspan></text></svg><div class=\"diagram-caption\">Antes de vender, entender: como isso funciona hoje para o cliente</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "mod18", "title": "32.18. Modelo de plano de ação", "html": "<h1>32.18. Modelo de plano de ação</h1>\n<div class=\"email-card\">\n  <div class=\"email-plan-body\"><p>Um plano de ação completo costuma registrar:</p><ul>\n<li><p>problema identificado;</p></li>\n<li><p>causa;</p></li>\n<li><p>impacto;</p></li>\n<li><p>ação;</p></li>\n<li><p>responsável;</p></li>\n<li><p>prazo;</p></li>\n<li><p>indicador;</p></li>\n<li><p>status;</p></li>\n<li><p>evidência de conclusão.</p></li>\n</ul><p>Um plano de ação sem alguma dessas informações tende a ficar só no papel, sem viabilidade real de acompanhamento nas semanas seguintes.</p></div>\n</div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Um plano de ação completo tem</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Problema e causa</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Ação e responsável</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Prazo e indicador</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Evidência de conclusão</text></svg><div class=\"diagram-caption\">Sem essas informações, o plano de ação só existe no papel</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 18}, {"id": "checklists", "num": 13, "title": "Checklists da Jornada", "subtitle": "O mínimo que não pode faltar em cada etapa", "lessons": [{"id": "l56", "title": "Checklists obrigatórios da jornada", "html": "<h1 id=\"checklists-obrigatórios-da-jornada\"><strong>CHECKLISTS\nOBRIGATÓRIOS DA JORNADA</strong></h1>\n<p>Checklists ajudam a reduzir falhas e manter um padrão mínimo.</p>\n<h2 id=\"transição\"><strong>Transição</strong></h2>\n<p>Antes de assumir a conta, confirme que:</p><ul>\n<li><p>escopo recebido;</p></li>\n<li><p>envolvidos mapeados;</p></li>\n<li><p>processos conhecidos;</p></li>\n<li><p>integrações registradas;</p></li>\n<li><p>riscos registrados;</p></li>\n<li><p>pendências definidas;</p></li>\n<li><p>reunião de passagem realizada.</p></li>\n</ul><p>Fechar esse checklist evita a situação mais comum numa transição malfeita: o CS descobrir, semanas depois, que não sabia de algo importante.</p>\n<h2 id=\"go-live\"><strong>Go Live</strong></h2>\n<p>Antes de liberar o <strong>Go Live</strong>, confirme que:</p><ul>\n<li><p>usuários criados;</p></li>\n<li><p>acessos validados;</p></li>\n<li><p>treinamentos realizados;</p></li>\n<li><p>processos configurados;</p></li>\n<li><p>responsáveis definidos;</p></li>\n<li><p>canal de suporte informado;</p></li>\n<li><p>acompanhamento agendado.</p></li>\n</ul><p>Um Go Live sem algum desses pontos resolvidos tende a gerar as primeiras dúvidas do cliente logo na primeira semana de uso.</p>\n<h2 id=\"reunião-mensal\"><strong>Reunião mensal</strong></h2>\n<p>Antes e depois da reunião, confirme que:</p><ul>\n<li><p>ata anterior revisada;</p></li>\n<li><p>dados analisados;</p></li>\n<li><p>ações a partir dos dados definidas;</p></li>\n<li><p>pendências atualizadas;</p></li>\n<li><p>riscos revisados;</p></li>\n<li><p>pauta enviada;</p></li>\n<li><p>participantes confirmados.</p></li>\n</ul><p>Esse checklist simples evita o erro mais comum: chegar despreparado ou sair da reunião sem nenhum registro do que foi combinado.</p>\n<h2 id=\"risco\"><strong>Risco</strong></h2>\n<p>Ao registrar um risco, confirme que:</p><ul>\n<li><p>causa registrada;</p></li>\n<li><p>evidência;</p></li>\n<li><p>impacto;</p></li>\n<li><p>plano;</p></li>\n<li><p>responsável;</p></li>\n<li><p>prazo;</p></li>\n<li><p>envolvimento da liderança definido.</p></li>\n</ul><p>Um risco registrado sem essas informações vira só uma anotação solta, sem nenhuma utilidade para acompanhar a evolução do problema.</p>\n<h2 id=\"mudança-de-pessoa-envolvida\"><strong>Mudança de pessoa\nenvolvida</strong></h2>\n<p>Quando alguém novo entra na conta, confirme que:</p><ul>\n<li><p>novo contato identificado;</p></li>\n<li><p>contexto apresentado;</p></li>\n<li><p>acesso criado;</p></li>\n<li><p>treinamento realizado;</p></li>\n<li><p>histórico transferido;</p></li>\n<li><p>referência executiva atualizada.</p></li>\n</ul><p>Esse cuidado evita que a saída de uma pessoa importante da conta interrompa processos que já estavam funcionando bem.</p>\n<h2 id=\"upsell\"><strong>Upsell</strong></h2>\n<p>Antes de fechar, confirme que:</p><ul>\n<li><p>necessidade identificada;</p></li>\n<li><p>produto aderente;</p></li>\n<li><p>status de disponibilidade validado;</p></li>\n<li><p>precificação conferida;</p></li>\n<li><p>decisor identificado;</p></li>\n<li><p>oportunidade registrada;</p></li>\n<li><p>proposta acompanhada;</p></li>\n<li><p>implantação planejada;</p></li>\n<li><p>adoção acompanhada.</p></li>\n</ul>\n<p>O checklist não substitui análise. Ele garante que os pontos mínimos\nsejam verificados.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 720 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"665\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Transição</text><circle cx=\"177\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"177\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"177\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Go Live</text><circle cx=\"299\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"299\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"299\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Reunião\nmensal</text><circle cx=\"421\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"421\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"421\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Risco</text><circle cx=\"543\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"543\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"543\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Mudança de\npessoa</text><circle cx=\"665\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"665\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">6</text><text x=\"665\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Upsell</text></svg><div class=\"diagram-caption\">Cada etapa da jornada tem seu próprio mínimo obrigatório</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\"/><path d=\"M8 12l3 3 5-6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 1}, {"id": "casos", "num": 14, "title": "Casos Práticos", "subtitle": "Situações reais de atendimento e como conduzir", "lessons": [{"id": "c1", "title": "Caso 1: Cliente não responde", "html": "<h1>Caso 1: Cliente não responde</h1>\n<h2>Situação</h2>\n<p>O ponto focal do cliente parou de responder mensagens e e-mails há alguns dias. Existe uma pendência importante parada por causa disso, e o prazo combinado com o cliente está próximo.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>revisar o histórico e confirmar o que exatamente está pendente;</li><li>identificar o quanto essa pendência importa para o andamento do projeto;</li><li>fazer um follow-up direto, sem depender de mensagens vagas;</li><li>explicar com clareza o impacto de continuar sem resposta;</li><li>envolver outra pessoa da conta quando o ponto focal não for suficiente;</li><li>registrar o risco no Monday quando o silêncio se repetir.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Ainda não recebemos o retorno sobre [assunto]. Sem essa informação, não conseguiremos avançar com [etapa], o que pode impactar [prazo ou entrega]. Precisamos do retorno até [data]. Caso exista algum impedimento, me avise para ajustarmos o plano juntos.</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>mandar várias mensagens repetidas sem aumentar a urgência real do pedido;</li><li>tratar a ausência de resposta como normal e deixar o tema parado;</li><li>acionar a liderança do cliente antes de esgotar o contato direto com o ponto focal.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Silêncio</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Revisar</tspan><tspan x=\"193\" dy=\"13\">histórico</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Follow-up</tspan><tspan x=\"327\" dy=\"13\">objetivo</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Envolver</tspan><tspan x=\"460\" dy=\"13\">outra pessoa</tspan></text></svg><div class=\"diagram-caption\">Do silêncio do cliente até uma resposta, em passos objetivos</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c2", "title": "Caso 2: Integração atrasada", "html": "<h1>Caso 2: Integração atrasada</h1>\n<h2>Situação</h2>\n<p>Uma integração técnica prometida para este mês está atrasada. O cliente já cobrou uma nova data, e o CS ainda não tem a confirmação da área técnica sobre o motivo do atraso.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>identificar exatamente qual é a dependência que está travando a integração;</li><li>confirmar com Tecnologia quem é o responsável pela próxima etapa;</li><li>validar o status real antes de repassar qualquer prazo ao cliente;</li><li>explicar o impacto do atraso de forma objetiva, sem minimizar;</li><li>avaliar se existe um fluxo temporário possível enquanto a integração não conclui;</li><li>manter o cliente atualizado mesmo quando ainda não existe uma sol
