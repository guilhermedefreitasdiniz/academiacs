ução final.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>A integração está na etapa de validação técnica. A próxima atividade é o envio do arquivo pelo cliente até o dia [data]. Depois disso, o time técnico segue com os testes, e nossa próxima atualização vai até [data].</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>estimar um novo prazo sozinho, sem validar com Tecnologia;</li><li>dizer que a integração \"está quase pronta\" sem detalhar a etapa real;</li><li>esconder do cliente uma dependência que é dele.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Atraso</tspan><tspan x=\"60\" dy=\"13\">identificado</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Validar com</tspan><tspan x=\"193\" dy=\"13\">Tecnologia</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Explicar</tspan><tspan x=\"327\" dy=\"13\">impacto</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Fluxo</tspan><tspan x=\"460\" dy=\"13\">temporário</tspan></text></svg><div class=\"diagram-caption\">Um atraso técnico não impede uma comunicação clara com o cliente</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c3", "title": "Caso 3: Cliente pede algo fora do escopo", "html": "<h1>Caso 3: Cliente pede algo fora do escopo</h1>\n<h2>Situação</h2>\n<p>Durante uma reunião, o cliente pede uma funcionalidade ou um processo que não faz parte do que foi contratado. A pessoa está de boa-fé e parece nem saber que aquilo está fora do escopo atual.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>entender bem a necessidade antes de responder qualquer coisa;</li><li>explicar com transparência o que está e o que não está incluído no escopo atual;</li><li>registrar o pedido, mesmo quando ele não será atendido de imediato;</li><li>envolver Comercial ou Produto quando o pedido tiver potencial real;</li><li>apresentar alternativas já disponíveis na plataforma, quando existirem.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Entendo a necessidade. Isso não faz parte do escopo contratado hoje, mas vou registrar o pedido e verificar com o time responsável se existe uma solução possível. Te retorno até [data] com uma posição.</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>prometer prazo ou entrega sem validar com Produto ou Comercial;</li><li>responder apenas \"não fazemos isso\" sem indicar um próximo passo;</li><li>ignorar o pedido e não deixar nenhum registro do tema.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 152\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Dentro do escopo</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Fora do escopo</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">já disponível</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">sem necessidade de validação</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">registrar o pedido</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">envolver Comercial ou Produto</text></svg><div class=\"diagram-caption\">Nem todo pedido fora do escopo é uma recusa definitiva</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c4", "title": "Caso 4: Usuários não utilizam a plataforma", "html": "<h1>Caso 4: Usuários não utilizam a plataforma</h1>\n<h2>Situação</h2>\n<p>O treinamento foi realizado há duas semanas, mas os usuários do cliente ainda não iniciaram nenhum processo real na plataforma. O ponto focal reconhece o atraso, mas não sabe explicar o motivo.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>investigar a causa real antes de simplesmente cobrar mais acesso;</li><li>verificar se falta um responsável definido para o processo;</li><li>escolher um processo real e acompanhar o primeiro uso de perto;</li><li>revisar dúvidas que ainda existam sobre o fluxo configurado;</li><li>acompanhar a recorrência nas semanas seguintes;</li><li>retirar o controle paralelo (planilha, e-mail) somente quando o processo estiver estável na plataforma.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Percebi que o cadastro de campanhas ainda não começou desde o treinamento. Queria entender com vocês se falta alguma dúvida sobre o processo, ou se existe algum outro bloqueio. Podemos fazer o primeiro cadastro juntos essa semana?</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>cobrar acesso repetidamente sem investigar a causa raiz;</li><li>assumir e realizar as tarefas no lugar do cliente para \"destravar\" a conta;</li><li>repetir o mesmo treinamento sem mudar a abordagem.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Baixo</tspan><tspan x=\"60\" dy=\"13\">uso</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Investigar</tspan><tspan x=\"193\" dy=\"13\">causa</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Processo</tspan><tspan x=\"327\" dy=\"13\">real escolhido</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Acompanhar</tspan><tspan x=\"460\" dy=\"13\">até virar rotina</tspan></text></svg><div class=\"diagram-caption\">Cobrar acesso sem entender a causa raramente muda o comportamento</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c5", "title": "Caso 5: A liderança não percebe valor", "html": "<h1>Caso 5: A liderança não percebe valor</h1>\n<h2>Situação</h2>\n<p>O ponto focal está satisfeito com o atendimento, mas a liderança do cliente questiona, em uma reunião de negócio, se a parceria com a Meu Cliente está gerando resultado.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>retomar os objetivos que foram definidos no início da parceria;</li><li>consolidar a evolução real desde então, com dados concretos;</li><li>apresentar os dados já transformados em conclusões, não soltos;</li><li>mostrar riscos que já foram identificados e resolvidos;</li><li>propor próximos passos claros para o período seguinte.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Desde o início do projeto, saímos de [situação inicial] para [situação atual], com [dado concreto]. Identificamos [risco] no caminho e já foi resolvido através de [ação]. Para os próximos meses, o foco é [prioridade].</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>apresentar apenas números soltos, sem contexto nem conclusão;</li><li>evitar a conversa com a liderança por desconforto;</li><li>levar dados para a reunião sem transformá-los em uma decisão ou próximo passo.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Objetivos</tspan><tspan x=\"60\" dy=\"13\">iniciais</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Evolução</tspan><tspan x=\"193\" dy=\"13\">real</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Dados em</tspan><tspan x=\"327\" dy=\"13\">conclusões</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Próximos</tspan><tspan x=\"460\" dy=\"13\">passos</tspan></text></svg><div class=\"diagram-caption\">Números soltos não convencem. Conclusões e próximos passos, sim</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c6", "title": "Caso 6: Cliente quer que o CS opere a plataforma", "html": "<h1>Caso 6: Cliente quer que o CS opere a plataforma</h1>\n<h2>Situação</h2>\n<p>O cliente pede repetidamente que o CS cadastre campanhas e execute tarefas que são responsabilidade dos usuários dele. Isso já vem acontecendo há algumas semanas.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>explicar com clareza qual é o papel do CS e qual é o papel do usuário do cliente;</li><li>apoiar o primeiro uso e ficar por perto durante a curva de aprendizado;</li><li>treinar novamente se for necessário, mas indicando um responsável fixo;</li><li>acompanhar a evolução sem assumir a rotina;</li><li>reforçar por que manter o processo com o cliente reduz o risco da operação dele.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Posso te acompanhar no primeiro cadastro e tirar as dúvidas que aparecerem, mas o cadastro em si precisa ficar com o time de vocês, para que o processo continue rodando quando eu não estiver por perto.</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>assumir a tarefa \"só dessa vez\" repetidamente, toda semana;</li><li>deixar de indicar um usuário responsável pelo processo;</li><li>confundir apoiar o cliente com operar a plataforma no lugar dele.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Apoiar</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Operar no lugar do cliente</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">primeiro uso</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">tirar dúvidas</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">acompanhar de perto</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">cadastro recorrente</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">dependência do CS</text></svg><div class=\"diagram-caption\">A linha entre apoiar o cliente e assumir a rotina dele por completo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c7", "title": "Caso 7: Cliente sinaliza intenção de cancelamento", "html": "<h1>Caso 7: Cliente sinaliza intenção de cancelamento</h1>\n<h2>Situação</h2>\n<p>O ponto focal comunica, em tom reservado, que a empresa está avaliando encerrar o contrato com a Meu Cliente no próximo ciclo.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>ouvir sem interromper e sem reagir na defensiva;</li><li>entender a causa real por trás da intenção de cancelamento;</li><li>registrar o relato com o máximo de detalhe possível;</li><li>envolver a liderança interna da Meu Cliente rapidamente;</li><li>construir um plano de recuperação com ações, responsáveis e prazos;</li><li>acompanhar de perto até a decisão final do cliente.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Obrigado por compartilhar isso comigo com transparência. Quero entender melhor o que motivou essa avaliação, para que a gente possa olhar com cuidado para o que pode ser feito. Posso voltar até [data] com um plano concreto?</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>minimizar a preocupação do cliente ou tratar o assunto como exagero;</li><li>prometer descontos ou mudanças de condição sem aprovação da liderança;</li><li>deixar de envolver a liderança da Meu Cliente a tempo de agir.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Ouvir</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Entender a</tspan><tspan x=\"193\" dy=\"13\">causa</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Envolver</tspan><tspan x=\"327\" dy=\"13\">liderança</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Plano de</tspan><tspan x=\"460\" dy=\"13\">recuperação</tspan></text></svg><div class=\"diagram-caption\">Os primeiros minutos dessa conversa pesam tanto quanto o plano depois</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "c8", "title": "Caso 8: Oportunidade de upsell", "html": "<h1>Caso 8: Oportunidade de upsell</h1>\n<h2>Situação</h2>\n<p>Durante uma reunião mensal, o cliente comenta que ainda controla parte do processo de visitas às lojas por planilha, e que isso consome bastante tempo do time.</p>\n<h2>O que o CS deve fazer</h2>\n<ul><li>entender o problema real por trás do comentário;</li><li>validar se existe uma solução da Meu Cliente aderente a essa necessidade;</li><li>confirmar a disponibilidade e a precificação no material oficial;</li><li>identificar quem decide sobre esse tipo de investimento no cliente;</li><li>registrar a oportunidade e envolver o responsável comercial;</li><li>acompanhar a negociação até o fechamento e garantir que o que for vendido seja de fato implantado.</li></ul>\n<h2>Exemplo de abordagem</h2>\n<blockquote>Vocês comentaram sobre o controle de visitas por planilha. Temos uma solução que pode apoiar esse processo. Antes de falarmos de proposta, queria entender melhor como isso funciona hoje e qual seria o resultado esperado para vocês.</blockquote>\n<div class=\"callout callout-danger\"><span class=\"callout-label\">O que evitar</span><ul><li>oferecer o upsell sem entender o problema real do cliente;</li><li>prometer prazo ou preço sem confirmar com o time comercial;</li><li>vender a solução e não acompanhar a implantação depois.</li></ul></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Necessidade</tspan><tspan x=\"60\" dy=\"13\">real</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Solução</tspan><tspan x=\"193\" dy=\"13\">aderente</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Time comercial</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Implantação</tspan><tspan x=\"460\" dy=\"13\">acompanhada</tspan></text></svg><div class=\"diagram-caption\">Uma oportunidade de upsell segue o mesmo cuidado de qualquer demanda séria</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 8}, {"id": "treinamentos", "num": 15, "title": "Treinamentos na Prática", "subtitle": "Pastas por tipo de reunião, com vídeos e materiais reais", "lessons": [], "count": 0}, {"id": "certificacao", "num": 16, "title": "Avaliação e Certificação", "subtitle": "O padrão mínimo para assumir uma carteira", "lessons": [{"id": "l59", "title": "Avaliação e certificação do CS", "html": "<h1 id=\"avaliação-e-certificação-do-cs\"><strong>AVALIAÇÃO E CERTIFICAÇÃO\nDO CS</strong></h1>\n<p>A certificação confirma que o colaborador possui conhecimento e\ncapacidade prática para assumir uma carteira Enterprise.</p>\n<p>Assistir às aulas não é suficiente.</p>\n<h2 id=\"etapas-da-avaliação\"><strong>Etapas da avaliação</strong></h2>\n<h3 id=\"conhecimento-sobre-varejo-e-trade\"><strong>Conhecimento sobre\nvarejo e Trade</strong></h3>\n<p>Essa etapa avalia domínio sobre:</p><ul>\n<li><p>estrutura do varejo;</p></li>\n<li><p>papel das áreas;</p></li>\n<li><p>funcionamento de Trade;</p></li>\n<li><p>processos;</p></li>\n<li><p>conceitos principais.</p></li>\n</ul><p>Essa etapa garante que o CS entende o negócio do cliente antes de falar sobre a ferramenta.</p>\n<h3 id=\"conhecimento-da-meu-cliente\"><strong>Conhecimento da Meu\nCliente</strong></h3>\n<p>Essa etapa avalia domínio sobre:</p><ul>\n<li><p>papel da plataforma;</p></li>\n<li><p>limites;</p></li>\n<li><p>escopo;</p></li>\n<li><p>responsabilidades;</p></li>\n<li><p>utilização no contexto Enterprise.</p></li>\n</ul><p>Aqui, o objetivo é confirmar que o CS conhece os limites da plataforma tão bem quanto conhece suas funcionalidades.</p>\n<h3 id=\"jornada-do-cliente\"><strong>Jornada do cliente</strong></h3>\n<p>Essa etapa avalia domínio sobre:</p><ul>\n<li><p>implantação;</p></li>\n<li><p>transição;</p></li>\n<li><p><strong>Go Live</strong>;</p></li>\n<li><p>adoção;</p></li>\n<li><p>consolidação;</p></li>\n<li><p><strong>upsell</strong>.</p></li>\n</ul><p>Essa parte da avaliação confirma que o CS sabe em que momento da jornada cada cliente está, e o que se espera dele em cada etapa.</p>\n<h3 id=\"gestão-de-carteira\"><strong>Gestão de carteira</strong></h3>\n<p>Essa etapa avalia domínio sobre:</p><ul>\n<li><p>envolvidos;</p></li>\n<li><p>reuniões;</p></li>\n<li><p><strong>Health Score</strong>;</p></li>\n<li><p>riscos;</p></li>\n<li><p><strong>NPS</strong>;</p></li>\n<li><p>indicadores;</p></li>\n<li><p>organização no <strong>Monday</strong>.</p></li>\n</ul><p>Essa etapa mostra se o CS já incorporou a rotina de organização que sustenta uma carteira Enterprise saudável.</p>\n<h3 id=\"avaliação-prática\"><strong>Avaliação prática</strong></h3>\n<p>Essa etapa é feita na prática, com:</p><ul>\n<li><p>simulação de reunião;</p></li>\n<li><p>construção de ata;</p></li>\n<li><p>plano de ação;</p></li>\n<li><p>resposta a uma situação de risco;</p></li>\n<li><p>registro de demanda;</p></li>\n<li><p>análise de caso;</p></li>\n<li><p>comunicação com o cliente;</p></li>\n<li><p>identificação de oportunidade de upsell;</p></li>\n<li><p>transformação de dados em ações.</p></li>\n</ul>\n<h2 id=\"critérios-de-aprovação\"><strong>Critérios de\naprovação</strong></h2>\n<p>O colaborador deve demonstrar:</p>\n<ul>\n<li><p>domínio do conteúdo;</p></li>\n<li><p>comunicação clara;</p></li>\n<li><p>organização;</p></li>\n<li><p>postura;</p></li>\n<li><p>capacidade analítica;</p></li>\n<li><p>gestão de responsabilidades;</p></li>\n<li><p>domínio dos limites;</p></li>\n<li><p>capacidade de condução;</p></li>\n<li><p>registro adequado;</p></li>\n<li><p><strong>senso de dono</strong>;</p></li>\n<li><p>habilidade para transformar informação em ação.</p></li>\n</ul>\n<h2 id=\"resultado\"><strong>Resultado</strong></h2>\n<h3 id=\"aprovado\"><strong>Aprovado</strong></h3>\n<p>Pode assumir clientes com acompanhamento da liderança durante o\nperíodo inicial.</p>\n<h3 id=\"aprovado-com-plano-de-desenvolvimento\"><strong>Aprovado com\nplano de desenvolvimento</strong></h3>\n<p>Possui condições de atuar, mas precisa evoluir em competências\nespecíficas.</p>\n<h3 id=\"não-aprovado\"><strong>Não aprovado</strong></h3>\n<p>Ainda não deve assumir uma carteira sozinho.</p>\n<h2 id=\"recertificação\"><strong>Recertificação</strong></h2>\n<p>A certificação pode ser atualizada quando houver:</p>\n<ul>\n<li><p>mudanças importantes na plataforma;</p></li>\n<li><p>alteração de processo;</p></li>\n<li><p>nova metodologia;</p></li>\n<li><p>evolução do papel do CS;</p></li>\n<li><p>problemas recorrentes de execução;</p></li>\n<li><p>mudança nas regras de upsell;</p></li>\n<li><p>necessidade de atualização do time.</p></li>\n</ul>\n<p>A certificação representa o padrão mínimo esperado para cuidar de um\ncliente Enterprise da Meu Cliente, e vai muito além de uma prova.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 90\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Conteúdo</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Prática</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Avaliação</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Aprovação</tspan></text></svg><div class=\"diagram-caption\">A certificação confirma conhecimento e capacidade prática, não só presença nas aulas</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"9\" r=\"6\"/><path d=\"M9 14.5L7 22l5-3 5 3-2-7.5\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 1}, {"id": "referencias", "num": 17, "title": "Inspiração e Referências", "subtitle": "Empresas, livros e artigos sobre Customer Success no mundo", "lessons": [{"id": "ref1", "title": "Inspiração e Referências", "html": "<h1>Inspiração e Referências</h1>\n<p>Empresas e artigos que ajudam a entender Customer Success como disciplina, e que inspiram a forma como pensamos o CS na Meu Cliente.</p>\n\n<h2>Empresas com culturas de CS admiradas no mundo</h2>\n<ul>\n<li><strong>Salesforce</strong>: uma das criadoras do conceito moderno de Customer Success, com times dedicados a acompanhar adoção e resultado do cliente ao longo de todo o contrato.</li>\n<li><strong>Gainsight</strong>: empresa de software voltada inteiramente para CS, referência em processos como Health Score, playbooks de sucesso e gestão de risco de churn.</li>\n<li><strong>HubSpot</strong>: conhecida por conectar Marketing, Vendas e Sucesso do Cliente em um único ciclo, com forte investimento em conteúdo educativo para o cliente.</li>\n<li><strong>Zendesk</strong>: referência em atendimento e relacionamento, com foco grande em métricas de satisfação e experiência do cliente.</li>\n<li><strong>Slack</strong>: cultura de onboarding guiado e acompanhamento próximo de adoção nas contas Enterprise.</li>\n<li><strong>Amazon</strong>: o princípio de \"customer obsession\" (obsessão pelo cliente) orienta decisões estratégicas da empresa inteira, não só do time de atendimento.</li>\n</ul>\n\n<h2>Artigos e conteúdos para acompanhar</h2>\n<ul>\n<li>Blog da Gainsight, com estudos de caso e boas práticas de Health Score, QBR e gestão de churn.</li>\n<li>Blog de Customer Success da HubSpot, com conteúdo prático sobre onboarding, adoção e retenção.</li>\n<li>Artigos da Harvard Business Review sobre experiência e retenção de clientes, especialmente os que tratam de esforço do cliente e lealdade.</li>\n<li>Publicações da Gainsight Pulse e outras conferências de Customer Success, que reúnem tendências e cases do mercado todo ano.</li>\n</ul>\n\n<div class=\"callout callout-info\"><span class=\"callout-label\">Por que isso importa</span><p style=\"margin:0;\">Nenhuma dessas referências substitui o conhecimento da nossa própria operação. Elas servem para ampliar repertório e trazer boas práticas de fora, sempre adaptadas à realidade da Meu Cliente e do varejo brasileiro.</p></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Empresas</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Livros</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Artigos</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"208\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Nossa</tspan><tspan x=\"90\" dy=\"12\">operação</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">CULTURA</tspan><tspan x=\"240\" dy=\"15\">DE CS</tspan></text></svg><div class=\"diagram-caption\">Referências de fora ajudam a pensar melhor a nossa própria operação</div></div><div class=\"lesson-end\"><div class // Unified storage: uses window.storage when running inside the Claude chat
// (persists shared/personal data through Anthropic's backend), and falls back
// to the browser's localStorage when the file is downloaded and opened on its
// own (persists on that specific browser/device instead).
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const Storage = {
  async get(key, shared){
    if(HAS_CLAUDE_STORAGE){
      return await window.storage.get(key, shared);
    }
    const raw = localStorage.getItem('academia_cs__' + key);
    if(raw === null) throw new Error('not found');
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared){
    if(HAS_CLAUDE_STORAGE){
      return await window.storage.set(key, value, shared);
    }
    localStorage.setItem('academia_cs__' + key, value);
    return { key, value, shared: !!shared };
  },
};

function supaHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
  }, extra||{});
}

// Materials backend: uses Supabase (real, shared, works for the whole team from
// any device) when SUPABASE_READY is true. Otherwise falls back to the previous
// Storage wrapper (window.storage inside Claude, or localStorage when the file
// is opened standalone) so the file still works before Supabase is configured.
const MaterialsBackend = {
  async loadAll(){
    const NAMESPACES = ['training', 'video', 'estudo_video', 'estudo_podcast', 'estudo_podcast_interno', 'livro_capa'];
    if(!SUPABASE_READY){
      const out = {};
      for(const ns of NAMESPACES){
        out[ns] = {};
        try{ const r = await Storage.get(ns + '_materials', true); if(r) out[ns] = JSON.parse(r.value)||{}; }catch(e){}
      }
      return out;
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/materials?select=*&order=added_at.desc`, { headers: supaHeaders() });
    if(!res.ok) throw new Error('Falha ao carregar materiais do Supabase');
    const rows = await res.json();
    const out = {};
    for(const ns of NAMESPACES) out[ns] = {};
    for(const row of rows){
      const ns = NAMESPACES.includes(row.ns) ? row.ns : 'training';
      if(!out[ns][row.folder_id]) out[ns][row.folder_id] = [];
      out[ns][row.folder_id].push({
        id: row.id, title: row.title, link: row.link,
        fileData: row.file_url || null, fileName: row.file_name || null, fileType: row.file_type || null,
        addedAt: row.added_at,
      });
    }
    return out;
  },

  async add(ns, folderId, item){
    if(!SUPABASE_READY){
      if(!state.materials[ns][folderId]) state.materials[ns][folderId] = [];
      state.materials[ns][folderId].push(item);
      await saveMaterials(ns);
      return item;
    }
    const body = {
      ns, folder_id: folderId, title: item.title, link: item.link || null,
      file_url: item.fileData || null, file_name: item.fileName || null, file_type: item.fileType || null,
    };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/materials`, {
      method: 'POST', headers: supaHeaders({'Prefer':'return=representation'}), body: JSON.stringify(body),
    });
    if(!res.ok) throw new Error('Falha ao salvar material no Supabase');
    const rows = await res.json();
    const row = rows[0];
    const saved = { id: row.id, title: row.title, link: row.link, fileData: row.file_url, fileName: row.file_name, fileType: row.file_type, addedAt: row.added_at };
    if(!state.materials[ns][folderId]) state.materials[ns][folderId] = [];
    state.materials[ns][folderId].push(saved);
    return saved;
  },

  async remove(ns, folderId, itemId){
    if(!SUPABASE_READY){
      state.materials[ns][folderId] = (state.materials[ns][folderId]||[]).filter(it=>it.id!==itemId);
      await saveMaterials(ns);
      return;
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/materials?id=eq.${encodeURIComponent(itemId)}`, {
      method: 'DELETE', headers: supaHeaders(),
    });
    if(!res.ok) throw new Error('Falha ao remover material no Supabase');
    state.materials[ns][folderId] = (state.materials[ns][folderId]||[]).filter(it=>it.id!==itemId);
  },

  // Uploads a file to Supabase Storage and returns its public URL.
  async uploadFile(file){
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${Date.now()}_${Math.random().toString(36).slice(2,7)}_${safeName}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/materiais/${path}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': file.type || 'application/octet-stream' },
      body: file,
    });
    if(!res.ok) throw new Error('Falha ao enviar arquivo para o Supabase Storage');
    return `${SUPABASE_URL}/storage/v1/object/public/materiais/${path}`;
  },
};

async function loadState() {
  // 1. Tenta recuperar o usuário que logou via PIN (Sincronizado com o Resolve)
  const userRaw = localStorage.getItem('resolve_user');
  
  if (!userRaw) {
    state.view = 'login';
    state.authed = false;
    renderInto();
    return;
  }

  state.authed = true;
  state.user = JSON.parse(userRaw);

  // 2. Busca o progresso deste usuário no Supabase
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/progresso_academia?usuario_id=eq.${state.user.id}`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    });
    
    const concluidosNoBanco = await res.json();
    
    // Reseta o estado local e preenche com o que veio do banco
    state.completed = {};
    concluidosNoBanco.forEach(item => {
      state.completed[item.licao_id] = true;
    });
  } catch (e) {
    console.error("Erro ao carregar progresso do banco online:", e);
  }

  renderInto();
}

function updateHash(){
  if(state.view === 'login'){
    window.location.hash = '#login';
  } else if(state.view === 'central'){
    const cv = state.central.view;
    if(cv === 'categoria' && state.central.categoryId){
      window.location.hash = `#central/categoria/${state.central.categoryId}`;
    } else if(cv === 'situacao' && state.central.situacaoId){
      window.location.hash = `#central/situacao/${state.central.situacaoId}`;
    } else if(cv === 'fluxo' && state.central.fluxoId){
      window.location.hash = `#central/fluxo/${state.central.fluxoId}`;
    } else {
      window.location.hash = '#central';
    }
  } else if(state.view === 'track' && state.trackId){
    if(state.trackId === 'estudos' && state.estudosTemaId){
      window.location.hash = `#estudos/${state.estudosTemaId}`;
    } else {
      window.location.hash = `#trilha/${state.trackId}/${state.lessonIdx || 0}`;
    }
  } else {
    window.location.hash = '#home';
  }
}

function parseHash(){
  if(!state.authed) return;

  const hash = window.location.hash.replace(/^#/, '').trim();
  if(!hash || hash === 'home'){
    state.view = 'home';
    return;
  }

  const parts = hash.split('/');
  if(parts[0] === 'central'){
    state.view = 'central';
    state.estudosTemaId = null;
    if(parts[1] === 'categoria' && parts[2]){
      state.central.view = 'categoria';
      state.central.categoryId = parts[2];
    } else if(parts[1] === 'situacao' && parts[2]){
      state.central.view = 'situacao';
      state.central.situacaoId = parts[2];
    } else if(parts[1] === 'fluxo' && parts[2]){
      state.central.view = 'fluxo';
      state.central.fluxoId = parts[2];
    } else {
      state.central.view = 'home';
      state.central.categoryId = null;
      state.central.situacaoId = null;
      state.central.fluxoId = null;
    }
  } else if(parts[0] === 'trilha' && parts[1]){
    state.view = 'track';
    state.trackId = parts[1];
    state.lessonIdx = parseInt(parts[2] || '0', 10) || 0;
    state.estudosTemaId = null;
    state.showTrackVideo = false;
    state.trainingFolderId = null;
  } else if(parts[0] === 'estudos' && parts[1]){
    state.view = 'track';
    state.trackId = 'estudos';
    state.estudosTemaId = parts[1];
    state.showTrackVideo = false;
    state.trainingFolderId = null;
  } else {
    state.view = 'home';
  }
}

async function handleLogin(e) {
  if (e && e.preventDefault) e.preventDefault();

  // Junta o valor das 4 caixinhas do PIN (se existirem)
  const pinBoxes = document.querySelectorAll('.pin-box');
  let pin = '';
  if (pinBoxes.length > 0) {
    pin = Array.from(pinBoxes).map(b => b.value).join('').toUpperCase();
  }

  const emailInput = document.getElementById('email-input');
  const pwInput = document.getElementById('pw-input');

  const email = emailInput ? emailInput.value : '';
  const password = pwInput ? pwInput.value : '';

  try {
    // 🎯 CAMINHO RELATIVO: Roda em Local e na Vercel automaticamente
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin, email, password })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('resolve_user', JSON.stringify(data.user));
      window.location.reload();
    } else {
      const errorEl = document.getElementById('login-error') || document.querySelector('.error-msg');
      if (errorEl) errorEl.textContent = data.error || 'Credenciais inválidas.';
    }
  } catch (err) {
    console.error("Erro no login:", err);
  }
}

async function toggleDone(id) {
  if (!state.user) return;
  
  const novoEstado = !state.completed[id];
  const usuarioId = state.user.id;

  // Atualiza UI na hora
  state.completed[id] = novoEstado;
  renderInto();

  try {
    if (novoEstado) {
      await fetch(`${SUPABASE_URL}/rest/v1/progresso_academia`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({ usuario_id: usuarioId, licao_id: id })
      });
    } else {
      await fetch(`${SUPABASE_URL}/rest/v1/progresso_academia?usuario_id=eq.${usuarioId}&licao_id=eq.${id}`, {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        }
      });
    }
  } catch (e) {
    console.error("Erro ao salvar no banco:", e);
    showToast("Erro ao sincronizar online.");
  }
}

function wrapCallouts(html){
  // wrap paragraphs starting with common CS-attention markers into styled callouts
  return html.replace(/<p><strong>(Atenção para o CS:?|Cuidado:?|Erro comum:?|Sinal de alerta:?)<\/strong>([\s\S]*?)<\/p>/g,
    (m, label, rest) => `<div class="callout"><span class="callout-label">${label.replace(':','')}</span>${rest}</div>`);
}

function getEmbedUrl(link){
  if(!link) return null;
  try{
    const url = new URL(link.trim());
    const host = url.hostname.replace(/^www\./,'');
    // YouTube (usando youtube-nocookie.com para evitar o Erro 153 em file://)
    if(host === 'youtu.be'){
      const id = url.pathname.slice(1);
      if(id) return `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
    }
    if(host === 'youtube.com' || host === 'm.youtube.com'){
      if(url.pathname === '/watch'){
        const id = url.searchParams.get('v');
        if(id) return `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
      }
      if(url.pathname.startsWith('/shorts/')){
        const id = url.pathname.split('/')[2];
        if(id) return `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
      }
      if(url.pathname.startsWith('/embed/')){
        const id = url.pathname.split('/')[2];
        return `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
      }
    }
    // Google Drive
    if(host === 'drive.google.com' || host === 'docs.google.com'){
      const m = url.pathname.match(/\/file\/d\/([^/]+)/);
      if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
      const idParam = url.searchParams.get('id');
      if(idParam) return `https://drive.google.com/file/d/${idParam}/preview`;
    }
    // Loom
    if(host === 'loom.com'){
      const m = url.pathname.match(/\/share\/([a-zA-Z0-9]+)/);
      if(m) return `https://www.loom.com/embed/${m[1]}`;
      if(url.pathname.startsWith('/embed/')) return link;
    }
    // Vimeo
    if(host === 'vimeo.com'){
      const m = url.pathname.match(/\/(\d+)/);
      if(m) return `https://player.vimeo.com/video/${m[1]}`;
    }
  }catch(e){}
  return null;
}

// Direct video file link (Dropbox, links ending in a video extension, etc.) — played with a native <video> tag,
// not an iframe, so it never depends on a third-party embed policy.
function getDirectVideoSrc(link){
  if(!link) return null;
  try{
    const url = new URL(link.trim());
    const host = url.hostname.replace(/^www\./,'');
    if(host === 'dropbox.com'){
      url.searchParams.set('raw','1');
      url.searchParams.delete('dl');
      return url.toString();
    }
    if(/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url.pathname)){
      return link;
    }
  }catch(e){}
  return null;
}

async function saveMaterial(ns, id){
  const titleEl = document.getElementById(`mat-title-${ns}-${id}`);
  const linkEl = document.getElementById(`mat-link-${ns}-${id}`);
  const fileEl = document.getElementById(`mat-file-${ns}-${id}`);
  const title = (titleEl.value||'').trim();
  const link = (linkEl.value||'').trim();
  const file = fileEl && fileEl.files && fileEl.files[0];
  const maxBytes = SUPABASE_READY ? 50 * 1024 * 1024 : MAX_FILE_BYTES;

  if(!title){
    state.addError = 'Dê um título para o material.';
    renderInto();
    return;
  }
  if(!link && !file){
    state.addError = 'Adicione um link ou anexe um arquivo.';
    renderInto();
    return;
  }
  if(file && file.size > maxBytes){
    state.addError = SUPABASE_READY
      ? 'Arquivo muito grande. O limite é de 50 MB.'
      : 'Arquivo muito grande para este modo. Configure o Supabase (veja o guia) para anexar arquivos maiores, ou use um link.';
    renderInto();
    return;
  }

  state.addError = '';
  state.savingMaterial = true;
  renderInto();

  try{
    let fileUrl = null, fileName = null, fileType = null;
    if(file){
      if(SUPABASE_READY){
        fileUrl = await MaterialsBackend.uploadFile(file);
      }else{
        fileUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
      fileName = file.name;
      fileType = file.type;
    }
    const item = {
      id: 'm' + Date.now() + Math.random().toString(36).slice(2,7),
      title, link: link || null,
      fileData: fileUrl || null, fileName, fileType,
      addedAt: new Date().toISOString(),
    };
    await MaterialsBackend.add(ns, id, item);
    state.activeAddForm = null;
  }catch(e){
    console.error(e);
    state.addError = 'Não foi possível salvar o material. Verifique a configuração do Supabase e tente novamente.';
  }
  state.savingMaterial = false;
  renderInto();
}

function normText(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function levenshtein(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  let prev = Array(n+1).fill(0).map((_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}
function handleLogout() {
  // Limpa o usuário salvo no navegador
  localStorage.removeItem('resolve_user');

  // Manda de volta para a tela de login
  state.view = 'login';

function tokenMatches(qToken, text){
  if(!qToken) return false;
  if(text.includes(qToken)) return true;
  if(qToken.length>=4){
    const words = text.split(' ');
    for(const w of words){
      if(Math.abs(w.length-qToken.length)<=2 && levenshtein(qToken,w) <= (qToken.length>=7?2:1)) return true;
    }
  }
  return false;
}
const STOPWORDS = new Set(['cliente','clientes','que','de','da','do','das','dos','a','o','e','em','com','para','nao','um','uma','os','as','se','foi','ser','esta','está','quer','vai','no','na','ao','aos','as','por','como','quando','ja','muito','mais']);

function situacaoFields(s){
  return {
    titulo: normText(s.titulo),
    chave: normText([...(s.palavrasChave||[]), ...(s.sinonimos||[])].join(' ')),
    contexto: normText([s.quandoUtilizar||'', s.categoria].join(' ')),
  };
}
function searchSituacoes(query){
  const q = normText(query);
  if(!q) return [];
  let qTokens = q.split(' ').filter(Boolean);
  const meaningful = qTokens.filter(t=>!STOPWORDS.has(t) && t.length>1);
  if(meaningful.length) qTokens = meaningful;
  const results = [];
  for(const s of CENTRAL_DATA.situacoes){
    const f = situacaoFields(s);
    let score = 0;
    for(const t of qTokens){
      if(tokenMatches(t, f.titulo)) score += 3;
      else if(tokenMatches(t, f.chave)) score += 2;
      else if(tokenMatches(t, f.contexto)) score += 1;
    }
    if(score>0) results.push({s, score});
  }
  results.sort((a,b)=>b.score-a.score);
  const maxScore = results.length ? results[0].score : 0;
  const filtered = results.filter(r => r.score >= Math.max(2, maxScore*0.4));
  return filtered.slice(0,18).map(r=>r.s);
}

  return map[level] || map.moderado;
}

async function toggleDone(id) {
  const novoEstado = !state.completed[id];
  const usuarioId = state.user.id;

  state.completed[id] = novoEstado;
  renderInto();

  try {
    if (novoEstado) {
      await fetch(`${SUPABASE_URL}/rest/v1/progresso_academia`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ usuario_id: usuarioId, licao_id: id })
      });
    } else {
      await fetch(`${SUPABASE_URL}/rest/v1/progresso_academia?usuario_id=eq.${usuarioId}&licao_id=eq.${id}`, {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        }
      });
    }
  } catch (e) {
    showToast("Erro ao salvar no banco online.");
  }
}
function renderInto(){
  const app = document.getElementById('app');
  if(state.view === 'login'){
    app.innerHTML = renderLoginView();
  } else {
    let body;
    if(state.view === 'central') body = renderCentral();
    else if(state.view === 'track') body = renderTrack();
    else body = renderHome();
    app.innerHTML = renderTopbar() + body + renderPlayerModal() + renderImageModal() + renderToast();
  }
  app.dataset.rendered = 'true';
}
function render(){ renderInto(); }

}

// 1. Digitação & Avanço Automático
document.addEventListener('input', (e) => {
  if (!e.target.classList.contains('pin-box')) return;
  const boxes = Array.from(document.querySelectorAll('.pin-box'));
  const idx = boxes.indexOf(e.target);
  const val = e.target.value.toUpperCase();
  
  e.target.value = val;

  if (val && idx < boxes.length - 1) {
    boxes[idx + 1].focus();
    boxes[idx + 1].select();
  }
});

// 2. Teclas Especiais (Backspace, Delete, Setas, Enter)
document.addEventListener('keydown', (e) => {
  if (!e.target.classList.contains('pin-box')) return;
  const boxes = Array.from(document.querySelectorAll('.pin-box'));
  const idx = boxes.indexOf(e.target);

  if (e.key === 'Enter') {
    handleLogin(e);
    return;
  }

  if (e.key === 'Backspace') {
    if (!e.target.value && idx > 0) {
      boxes[idx - 1].focus();
      boxes[idx - 1].value = '';
    } else {
      e.target.value = '';
    }
    e.preventDefault();
  } else if (e.key === 'Delete') {
    e.target.value = '';
    e.preventDefault();
  } else if (e.key === 'ArrowLeft' && idx > 0) {
    boxes[idx - 1].focus();
    boxes[idx - 1].select();
    e.preventDefault();
  } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
    boxes[idx + 1].focus();
    boxes[idx + 1].select();
    e.preventDefault();
  }
});

// 3. Suporte a Colar (Paste)
document.addEventListener('paste', (e) => {
  if (!e.target.classList.contains('pin-box')) return;
  e.preventDefault();
  
  const pasted = (e.clipboardData || window.clipboardData)
    .getData('text').trim().toUpperCase();
  const boxes = document.querySelectorAll('.pin-box');

  if (pasted) {
    for (let i = 0; i < boxes.length; i++) {
      if (pasted[i]) boxes[i].value = pasted[i];
    }
    const lastIdx = Math.min(pasted.length - 1, boxes.length - 1);
    if (boxes[lastIdx]) {
      boxes[lastIdx].focus();
      boxes[lastIdx].select();
    }
  }
});

// 4. Seleciona o conteúdo ao focar na caixa
document.addEventListener('focusin', (e) => {
  if (e.target.classList.contains('pin-box')) {
    e.target.select();
  }
});
