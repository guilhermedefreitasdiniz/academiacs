as funcionalidades-chave desde o início, em vez de plataforma subutilizada;</li>\n<li>participação ativa nas agendas e treinamentos, em vez de faltar nas reuniões de acompanhamento;</li>\n<li>atenção aos usuários e perfis da plataforma, em vez de troca frequente de usuário sem novo treinamento.</li>\n</ul>\n<p>Isso não é uma cobrança antecipada. É um alinhamento honesto sobre o que realmente determina o sucesso do projeto, dos dois lados.</p>\n\n<h2>Perguntas e expectativas (40 a 50 minutos)</h2>\n<p>Reserve um tempo real para ouvir o cliente, não só para falar. Uma pergunta que costuma abrir bem essa conversa:</p>\n<p><strong>Frase pronta:</strong> \"A curto prazo, em dois meses, a médio prazo, em seis meses, e a longo prazo, em um ano, qual é a expectativa de vocês? O que consideram que seria o sucesso pleno desse projeto?\"</p>\n<p>Aproveite para responder dúvidas comuns nessa fase: se o preenchimento da planilha de onboarding é obrigatório (é, em até 7 dias, sob pena de atrasar todo o cronograma), quanto tempo leva a implantação (40 dias em média), se o Fotocheck sobrecarrega o gerente de loja (não, leva menos de um minuto por comprovação), e se a integração com o ERP é obrigatória (não para começar, mas é recomendada).</p>\n\n<h2>Encerramento (últimos minutos)</h2>\n<p>Apresente o MC Connect como o canal de autonomia do time: treinamentos, boas práticas, lançamentos e novidades sempre à mão. Finalize com os contatos diretos do time responsável e reforce o espírito de parceria de longo prazo.</p>\n<p><strong>Frase pronta:</strong> \"Vamos juntos, [nome do varejo]. Qualquer dúvida, já sabem onde encontrar a gente.\"</p>\n\n<h2>Depois da reunião</h2>\n<ul>\n<li>enviar a apresentação utilizada e um resumo dos combinados por e-mail;</li>\n<li>registrar a ata com pendências, responsáveis e prazos;</li>\n<li>confirmar o envio da planilha de onboarding em até 7 dias;</li>\n<li>agendar a próxima etapa (estruturação de dados) antes de encerrar o contato.</li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O que ajuda</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O que atrapalha</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">onboarding completo e no prazo</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">time usando desde o início</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">participação nos treinamentos</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">dados incompletos ou atrasados</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">plataforma subutilizada</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">troca de usuário sem retreinamento</text></svg><div class=\"diagram-caption\">Os fatores que mais pesam no sucesso da implantação, dos dois lados</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l35", "title": "4. Participação do CS durante a implantação", "html": "<h1 id=\"participação-do-cs-durante-a-implantação\"><strong>4. PARTICIPAÇÃO DO CS DURANTE A IMPLANTAÇÃO</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 95\" xmlns=\"http://www.w3.org/2000/svg\"><line stroke=\"#E4E1EE\" stroke-width=\"3\" x1=\"55\" x2=\"645\" y1=\"45\" y2=\"45\"></line><circle cx=\"55\" cy=\"45\" fill=\"#C41E68\" r=\"19\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"55\" y=\"50\">1</text><text fill=\"#C41E68\" font-size=\"11.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"55\" y=\"80\">Implantação</text><circle cx=\"173\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"173\" y=\"50\">2</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"173\" y=\"80\">Transição</text><circle cx=\"291\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"291\" y=\"50\">3</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"291\" y=\"80\">Go Live</text><circle cx=\"409\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"409\" y=\"50\">4</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"409\" y=\"80\">Adoção</text><circle cx=\"527\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"527\" y=\"50\">5</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"527\" y=\"80\">Consolidação</text><circle cx=\"645\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"645\" y=\"50\">6</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"645\" y=\"80\">Upsell</text></svg><div class=\"diagram-caption\">Onde a Implantação está na jornada do cliente</div></div>\n<p>A Implantação é liderada pelo time responsável por configurar e\npreparar a operação do cliente.</p>\n<p>O CS ainda não é o principal responsável pela conta, mas deve começar\na conhecê-la.</p>\n<h2 id=\"papel-do-cs-nesta-etapa\"><strong>Papel do CS nesta\netapa</strong></h2>\n<p>Nessa fase, o papel do CS envolve:</p><ul>\n<li><p>conhecer os objetivos contratados;</p></li>\n<li><p>entender o escopo;</p></li>\n<li><p>acompanhar reuniões importantes;</p></li>\n<li><p>conhecer as pessoas envolvidas;</p></li>\n<li><p>compreender os processos configurados;</p></li>\n<li><p>acompanhar integrações relevantes;</p></li>\n<li><p>identificar possíveis riscos futuros;</p></li>\n<li><p>preparar-se para receber a conta.</p></li>\n</ul><p>Nenhum desses pontos substitui o trabalho da Implantação. A ideia é que o CS chegue à transição já com contexto suficiente para não começar do zero.</p>\n<h2 id=\"o-que-o-cs-deve-observar\"><strong>O que o CS deve\nobservar</strong></h2>\n<p>Vale acompanhar sinais como:</p><ul>\n<li><p>nível de participação do cliente;</p></li>\n<li><p>clareza dos responsáveis;</p></li>\n<li><p>qualidade das informações enviadas;</p></li>\n<li><p>envolvimento da liderança;</p></li>\n<li><p>disponibilidade da equipe técnica;</p></li>\n<li><p>participação nos treinamentos;</p></li>\n<li><p>resistência a mudanças;</p></li>\n<li><p>dependência de uma única pessoa;</p></li>\n<li><p>expectativas diferentes do escopo.</p></li>\n</ul><p>Esses sinais, quando aparecem ainda na implantação, costumam se repetir mais tarde na fase de adoção, e vale registrá-los desde já.</p>\n<h2 id=\"o-que-o-cs-não-deve-fazer\"><strong>O que o CS não deve\nfazer</strong></h2>\n<p>Para não criar duas lideranças no mesmo projeto, o CS evita:</p><ul>\n<li><p>assumir a liderança da implantação;</p></li>\n<li><p>alterar o escopo;</p></li>\n<li><p>prometer entregas;</p></li>\n<li><p>interferir na metodologia sem alinhamento;</p></li>\n<li><p>iniciar cobranças paralelas;</p></li>\n<li><p>criar comunicações diferentes das definidas pelo\nimplantador.</p></li>\n</ul>\n<p>O CS deve contribuir sem criar duas lideranças para o mesmo\nprojeto.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Cliente</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"208\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Time de</tspan><tspan x=\"390\" dy=\"12\">Implantação</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">TI</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">CS</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"214\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">IMPLANTAÇÃO</tspan></text></svg><div class=\"diagram-caption\">Quatro frentes que precisam estar alinhadas antes do Go Live</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l36", "title": "5. Transição da implantação para o CS", "html": "<h1 id=\"transição-da-implantação-para-o-cs\"><strong>5. TRANSIÇÃO DA\nIMPLANTAÇÃO PARA O CS</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 95\" xmlns=\"http://www.w3.org/2000/svg\"><line stroke=\"#E4E1EE\" stroke-width=\"3\" x1=\"55\" x2=\"645\" y1=\"45\" y2=\"45\"></line><circle cx=\"55\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"55\" y=\"50\">1</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"55\" y=\"80\">Implantação</text><circle cx=\"173\" cy=\"45\" fill=\"#C41E68\" r=\"19\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"173\" y=\"50\">2</text><text fill=\"#C41E68\" font-size=\"11.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"173\" y=\"80\">Transição</text><circle cx=\"291\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"291\" y=\"50\">3</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"291\" y=\"80\">Go Live</text><circle cx=\"409\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"409\" y=\"50\">4</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"409\" y=\"80\">Adoção</text><circle cx=\"527\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"527\" y=\"50\">5</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"527\" y=\"80\">Consolidação</text><circle cx=\"645\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"645\" y=\"50\">6</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"645\" y=\"80\">Upsell</text></svg><div class=\"diagram-caption\">Onde a Transição está na jornada do cliente</div></div>\n<p>A transição é o momento em que a principal responsabilidade pelo\nrelacionamento passa da Implantação para o CS.</p>\n<p>Essa passagem precisa ser formal, completa e registrada.</p>\n<h2 id=\"informações-obrigatórias\"><strong>Informações\nobrigatórias</strong></h2>\n<p>O CS deve receber:</p>\n<ul>\n<li><p>objetivo do cliente;</p></li>\n<li><p>escopo contratado;</p></li>\n<li><p>processos configurados;</p></li>\n<li><p>usuários criados;</p></li>\n<li><p>treinamentos realizados;</p></li>\n<li><p>integrações previstas;</p></li>\n<li><p>integrações concluídas;</p></li>\n<li><p>integrações pendentes;</p></li>\n<li><p>pessoas envolvidas;</p></li>\n<li><p>referência da liderança;</p></li>\n<li><p>ponto focal;</p></li>\n<li><p>decisões tomadas;</p></li>\n<li><p>limitações conhecidas;</p></li>\n<li><p>pendências;</p></li>\n<li><p>riscos;</p></li>\n<li><p>próximos passos;</p></li>\n<li><p>materiais utilizados;</p></li>\n<li><p>gravações relevantes.</p></li>\n</ul>\n<h2 id=\"reunião-interna-de-transição\"><strong>Reunião interna de\ntransição</strong></h2>\n<p>Antes da apresentação oficial ao cliente, CS e Implantação devem\nrealizar uma reunião interna.</p>\n<p>O CS deve sair dessa reunião sabendo:</p>\n<ul>\n<li><p>o que foi contratado;</p></li>\n<li><p>o que foi entregue;</p></li>\n<li><p>o que ainda está pendente;</p></li>\n<li><p>quem participa;</p></li>\n<li><p>quais são os riscos;</p></li>\n<li><p>qual será o próximo passo.</p></li>\n</ul>\n<p>Não podem ficar respostas como:</p>\n<ul>\n<li><p>“acho que o cliente queria isso”;</p></li>\n<li><p>“essa parte ainda precisa ver”;</p></li>\n<li><p>“não sei quem ficou responsável”;</p></li>\n<li><p>“provavelmente está funcionando”.</p></li>\n</ul>\n<h2 id=\"reunião-de-passagem-com-o-cliente\"><strong>Reunião de passagem\ncom o cliente</strong></h2>\n<p>A reunião deve:</p>\n<ul>\n<li><p>apresentar oficialmente o CS;</p></li>\n<li><p>reforçar os canais de contato;</p></li>\n<li><p>revisar o momento da operação;</p></li>\n<li><p>confirmar pendências;</p></li>\n<li><p>definir a rotina de acompanhamento;</p></li>\n<li><p>alinhar responsabilidades;</p></li>\n<li><p>apresentar os próximos passos.</p></li>\n</ul>\n<h2 id=\"critério-de-conclusão\"><strong>Critério de\nconclusão</strong></h2>\n<p>A transição só está concluída quando:</p>\n<ul>\n<li><p>o CS conhece a conta;</p></li>\n<li><p>o cliente conhece o CS;</p></li>\n<li><p>o histórico está registrado;</p></li>\n<li><p>as pendências possuem responsáveis;</p></li>\n<li><p>a agenda de acompanhamento está definida;</p></li>\n<li><p>os riscos estão identificados.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 184\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"20\" y=\"55\" width=\"150\" height=\"60\" rx=\"12\" fill=\"#2B2361\"/><text x=\"95\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">Implantação</text><rect x=\"390\" y=\"55\" width=\"150\" height=\"60\" rx=\"12\" fill=\"#C41E68\"/><text x=\"465\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">CS</text><line x1=\"170\" y1=\"85\" x2=\"388\" y2=\"85\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><polygon points=\"380,78 392,85 380,92\" fill=\"#F2C230\"/><rect x=\"200\" y=\"20\" width=\"160\" height=\"104\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"38\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Escopo</text><text x=\"280\" y=\"56\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Processos</text><text x=\"280\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Riscos</text><text x=\"280\" y=\"92\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2B2361\">Pendências</text></svg><div class=\"diagram-caption\">A transição só está completa quando esse pacote chega inteiro ao CS</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l37", "title": "6. Go Live e estabilização da operação", "html": "<h1 id=\"go-live-e-estabilização-da-operação\"><strong>6. GO LIVE E\nESTABILIZAÇÃO DA OPERAÇÃO</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 95\" xmlns=\"http://www.w3.org/2000/svg\"><line stroke=\"#E4E1EE\" stroke-width=\"3\" x1=\"55\" x2=\"645\" y1=\"45\" y2=\"45\"></line><circle cx=\"55\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"55\" y=\"50\">1</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"55\" y=\"80\">Implantação</text><circle cx=\"173\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"173\" y=\"50\">2</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"173\" y=\"80\">Transição</text><circle cx=\"291\" cy=\"45\" fill=\"#C41E68\" r=\"19\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"291\" y=\"50\">3</text><text fill=\"#C41E68\" font-size=\"11.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"291\" y=\"80\">Go Live</text><circle cx=\"409\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"409\" y=\"50\">4</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"409\" y=\"80\">Adoção</text><circle cx=\"527\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"527\" y=\"50\">5</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"527\" y=\"80\">Consolidação</text><circle cx=\"645\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"645\" y=\"50\">6</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"645\" y=\"80\">Upsell</text></svg><div class=\"diagram-caption\">Onde o Go Live está na jornada do cliente</div></div>\n<p><strong>Go Live</strong> é o início do uso real da plataforma pelo cliente.</p>\n<p>Não deve ser tratado apenas como uma data no cronograma.</p>\n<p>O cliente precisa estar minimamente preparado para começar.</p>\n<h2 id=\"critérios-mínimos\"><strong>Critérios mínimos</strong></h2>\n<p>Para considerar o cliente pronto, é preciso confirmar que:</p><ul>\n<li><p>usuários principais criados;</p></li>\n<li><p>acessos funcionando;</p></li>\n<li><p>processos principais configurados;</p></li>\n<li><p>responsáveis definidos;</p></li>\n<li><p>treinamentos realizados;</p></li>\n<li><p>integrações essenciais disponíveis ou com um fluxo temporário\ndefinido;</p></li>\n<li><p>pendências críticas conhecidas;</p></li>\n<li><p>canal de suporte informado;</p></li>\n<li><p>agenda de acompanhamento definida.</p></li>\n</ul><p>Quando algum desses pontos ainda está em aberto, vale conversar com o cliente sobre adiar o Go Live em vez de simplesmente seguir com o cronograma.</p>\n<h2 id=\"primeiros-dias\"><strong>Primeiros dias</strong></h2>\n<p>Nos primeiros dias, o CS deve acompanhar:</p>\n<ul>\n<li><p>acessos;</p></li>\n<li><p>dúvidas;</p></li>\n<li><p>erros;</p></li>\n<li><p>dificuldades de navegação;</p></li>\n<li><p>abandono dos processos;</p></li>\n<li><p>participação dos usuários;</p></li>\n<li><p>problemas de permissão;</p></li>\n<li><p>impacto de integrações pendentes;</p></li>\n<li><p>qualidade das informações cadastradas.</p></li>\n</ul>\n<h2 id=\"estabilização\"><strong>Estabilização</strong></h2>\n<p>A operação pode ser considerada estável quando:</p>\n<ul>\n<li><p>os usuários conseguem realizar as atividades;</p></li>\n<li><p>os principais erros foram tratados;</p></li>\n<li><p>o cliente conhece os canais corretos;</p></li>\n<li><p>as rotinas estão funcionando;</p></li>\n<li><p>as pendências restantes não impedem o uso;</p></li>\n<li><p>o cliente começa a utilizar a plataforma sem depender de\nacompanhamento diário.</p></li>\n</ul>\n<h2 id=\"erro-comum\"><strong>Erro comum</strong></h2>\n<p>Considerar que o Go Live encerra o trabalho e que a adoção acontecerá\nsozinha.</p>\n<p>O Go Live é o começo do uso. A adoção ainda precisa ser\nconstruída.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 222\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"194\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Antes de liberar o Go Live</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Usuários criados</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Acessos testados</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Processos configurados</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Treinamento feito</text><circle cx=\"34\" cy=\"177\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 177l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"182\" font-size=\"12\" fill=\"#2B2361\">Canal de suporte informado</text></svg><div class=\"diagram-caption\">Um Go Live sem esses pontos resolvidos nasce fadado a dúvidas</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l38", "title": "7. Adoção da plataforma", "html": "<h1 id=\"adoção-da-plataforma\"><strong>7. ADOÇÃO DA\nPLATAFORMA</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 95\" xmlns=\"http://www.w3.org/2000/svg\"><line stroke=\"#E4E1EE\" stroke-width=\"3\" x1=\"55\" x2=\"645\" y1=\"45\" y2=\"45\"></line><circle cx=\"55\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"55\" y=\"50\">1</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"55\" y=\"80\">Implantação</text><circle cx=\"173\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"173\" y=\"50\">2</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"173\" y=\"80\">Transição</text><circle cx=\"291\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"291\" y=\"50\">3</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"291\" y=\"80\">Go Live</text><circle cx=\"409\" cy=\"45\" fill=\"#C41E68\" r=\"19\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"409\" y=\"50\">4</text><text fill=\"#C41E68\" font-size=\"11.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"409\" y=\"80\">Adoção</text><circle cx=\"527\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"527\" y=\"50\">5</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"527\" y=\"80\">Consolidação</text><circle cx=\"645\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"645\" y=\"50\">6</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"645\" y=\"80\">Upsell</text></svg><div class=\"diagram-caption\">Onde a Adoção está na jornada do cliente</div></div>\n<p>Adoção acontece quando o cliente utiliza a plataforma de forma\nrecorrente para executar processos reais.</p>\n<p>Acesso não é adoção.</p>\n<p>Cadastrar usuários, realizar treinamentos ou fazer uma primeira\nreunião não significa que a solução entrou na rotina.</p>\n<h2 id=\"sinais-de-adoção\"><strong>Sinais de adoção</strong></h2>\n<p>Alguns sinais ajudam a identificar isso:</p><ul>\n<li><p>usuários acessam com frequência;</p></li>\n<li><p>processos são iniciados;</p></li>\n<li><p>tarefas são respondidas;</p></li>\n<li><p>informações são atualizadas;</p></li>\n<li><p>reuniões utilizam os dados da plataforma;</p></li>\n<li><p>áreas participam dos fluxos;</p></li>\n<li><p>controles paralelos diminuem;</p></li>\n<li><p>o cliente consulta o histórico;</p></li>\n<li><p>a liderança acompanha a evolução.</p></li>\n</ul><p>Nenhum desses sinais sozinho garante adoção. É a combinação deles ao longo de algumas semanas que mostra se o uso realmente virou rotina.</p>\n<h2 id=\"barreiras-comuns\"><strong>Barreiras comuns</strong></h2>\n<p>As barreiras mais frequentes costumam ser:</p><ul>\n<li><p>falta de responsável;</p></li>\n<li><p>liderança pouco envolvida;</p></li>\n<li><p>processo mal definido;</p></li>\n<li><p>usuários sem treinamento;</p></li>\n<li><p>dificuldade de uso;</p></li>\n<li><p>integração pendente;</p></li>\n<li><p>excesso de etapas;</p></li>\n<li><p>manutenção de planilhas paralelas;</p></li>\n<li><p>resistência a mudanças;</p></li>\n<li><p>expectativa de que o CS opere a solução.</p></li>\n</ul><p>Identificar qual dessas barreiras está travando o cliente é o primeiro passo antes de montar qualquer plano de adoção.</p>\n<h2 id=\"plano-de-adoção\"><strong>Plano de adoção</strong></h2>\n<p>O plano deve definir:</p>\n<ul>\n<li><p>processo prioritário;</p></li>\n<li><p>usuários envolvidos;</p></li>\n<li><p>comportamento esperado;</p></li>\n<li><p>frequência;</p></li>\n<li><p>indicador;</p></li>\n<li><p>prazo;</p></li>\n<li><p>responsável;</p></li>\n<li><p>ação de acompanhamento.</p></li>\n</ul>\n<h2 id=\"exemplo\"><strong>Exemplo</strong></h2>\n<p>Problema: o cliente realizou o treinamento, mas ainda não iniciou\nnenhum processo.</p>\n<p>Plano:</p>\n<ul>\n<li><p>escolher um processo real;</p></li>\n<li><p>definir o responsável;</p></li>\n<li><p>acompanhar o primeiro cadastro;</p></li>\n<li><p>validar o fluxo;</p></li>\n<li><p>revisar as dúvidas;</p></li>\n<li><p>acompanhar a recorrência;</p></li>\n<li><p>retirar o controle paralelo quando o processo estiver\nestável.</p></li>\n</ul>\n<h2 id=\"papel-do-cs\"><strong>Papel do CS</strong></h2>\n<p>O CS deve cobrar utilização, mas também precisa investigar a causa da\nbaixa adoção.</p>\n<p>Cobrar acesso sem entender o problema raramente muda o\ncomportamento.</p>\n<p>E novamente: <strong>dado sem ação não vale nada</strong>.</p>\n<p>Saber que o cliente acessou pouco só importa quando essa informação\ngera uma conversa, um diagnóstico e um plano.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 95\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:600px;display:block;margin:0 auto;\"><line x1=\"50\" y1=\"40\" x2=\"470\" y2=\"40\" stroke=\"#E4E1EE\" stroke-width=\"4\" stroke-dasharray=\"1 10\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"40\" r=\"8\" fill=\"#2B2361\"/><text x=\"50\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"50\" dy=\"0\">Acesso</tspan></text><circle cx=\"190\" cy=\"40\" r=\"8\" fill=\"#2B2361\"/><text x=\"190\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"190\" dy=\"0\">Utilização</tspan></text><circle cx=\"330\" cy=\"40\" r=\"8\" fill=\"#2B2361\"/><text x=\"330\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"330\" dy=\"0\">Recorrência</tspan></text><circle cx=\"470\" cy=\"40\" r=\"8\" fill=\"#C41E68\"/><text x=\"470\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"470\" dy=\"0\">Processo</tspan><tspan x=\"470\" dy=\"13\">incorporado</tspan></text><line x1=\"480\" y1=\"10\" x2=\"480\" y2=\"40\" stroke=\"#2B2361\" stroke-width=\"2\"/><path d=\"M480 10 l16 5 -16 5z\" fill=\"#F2C230\"/></svg><div class=\"diagram-caption\">Acesso é só o primeiro passo. Adoção é quando o uso vira rotina</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l39", "title": "8. Consolidação dos processos no cliente", "html": "<h1 id=\"consolidação-dos-processos-no-cliente\"><strong>8. CONSOLIDAÇÃO\nDOS PROCESSOS NO CLIENTE</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 95\" xmlns=\"http://www.w3.org/2000/svg\"><line stroke=\"#E4E1EE\" stroke-width=\"3\" x1=\"55\" x2=\"645\" y1=\"45\" y2=\"45\"></line><circle cx=\"55\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"55\" y=\"50\">1</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"55\" y=\"80\">Implantação</text><circle cx=\"173\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"173\" y=\"50\">2</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"173\" y=\"80\">Transição</text><circle cx=\"291\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"291\" y=\"50\">3</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"291\" y=\"80\">Go Live</text><circle cx=\"409\" cy=\"45\" fill=\"#2B2361\" r=\"14\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"409\" y=\"50\">4</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"409\" y=\"80\">Adoção</text><circle cx=\"527\" cy=\"45\" fill=\"#C41E68\" r=\"19\"></circle><text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"527\" y=\"50\">5</text><text fill=\"#C41E68\" font-size=\"11.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"527\" y=\"80\">Consolidação</text><circle cx=\"645\" cy=\"45\" fill=\"#D9D4EC\" r=\"14\"></circle><text fill=\"#8B84A8\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"645\" y=\"50\">6</text><text fill=\"#5B5578\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"645\" y=\"80\">Upsell</text></svg><div class=\"diagram-caption\">Onde a Consolidação está na jornada do cliente</div></div>\n<p>A consolidação acontece quando a plataforma deixa de ser tratada como\num projeto separado e passa a fazer parte da rotina.</p>\n<h2 id=\"sinais-de-consolidação\"><strong>Sinais de\nconsolidação</strong></h2>\n<p>Isso costuma aparecer através de:</p><ul>\n<li><p>processos recorrentes são realizados na plataforma;</p></li>\n<li><p>responsáveis conhecem suas atividades;</p></li>\n<li><p>novos usuários são treinados;</p></li>\n<li><p>o histórico é confiável;</p></li>\n<li><p>a liderança utiliza as informações;</p></li>\n<li><p>reuniões partem dos dados registrados;</p></li>\n<li><p>controles paralelos diminuíram;</p></li>\n<li><p>o cliente mantém o processo sem depender do CS;</p></li>\n<li><p>mudanças de pessoas não interrompem a operação.</p></li>\n</ul><p>Quando vários desses sinais aparecem ao mesmo tempo, é um bom indicativo de que a conta já não depende mais de um acompanhamento diário do CS.</p>\n<h2 id=\"o-papel-da-organização-interna\"><strong>O papel da organização\ninterna</strong></h2>\n<p>Para consolidar o uso, o cliente precisa definir:</p>\n<ul>\n<li><p>quem administra;</p></li>\n<li><p>quem atualiza;</p></li>\n<li><p>quem cobra;</p></li>\n<li><p>quem aprova;</p></li>\n<li><p>quem acompanha os indicadores;</p></li>\n<li><p>quem treina novos usuários;</p></li>\n<li><p>quem comunica mudanças.</p></li>\n</ul>\n<h2 id=\"o-papel-do-cs\"><strong>O papel do CS</strong></h2>\n<p>O CS deve ajudar o cliente a sair do uso experimental e entrar em uma\nrotina previsível.</p>\n<p>Isso envolve:</p>\n<ul>\n<li><p>revisar processos;</p></li>\n<li><p>identificar gargalos;</p></li>\n<li><p>simplificar o que for necessário;</p></li>\n<li><p>acompanhar responsáveis;</p></li>\n<li><p>reforçar a utilização;</p></li>\n<li><p>apresentar resultados;</p></li>\n<li><p>envolver a liderança;</p></li>\n<li><p>registrar decisões.</p></li>\n</ul>\n<h2 id=\"sinal-de-alerta\"><strong>Sinal de alerta</strong></h2>\n<p>Quando apenas uma pessoa conhece e utiliza a plataforma, existe risco\nde interrupção.</p>\n<p>O CS deve avaliar se o conhecimento está distribuído e se a operação\ncontinuará durante férias, desligamentos ou mudanças de função.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Rotina</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Pessoas</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Reuniões</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Processos</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">PLATAFORMA</tspan><tspan x=\"240\" dy=\"15\">CONSOLIDADA</tspan></text></svg><div class=\"diagram-caption\">Consolidada é quando a plataforma some no meio da rotina, sem chamar atenção</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "jsmb0", "title": "9. Jornada do cliente SMB", "html": "<h1>9. Jornada do cliente SMB</h1>\n<p>A rota da jornada SMB segue sempre a mesma sequência:</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 720 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"665\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Implantação</text><circle cx=\"177\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"177\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"177\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Campanha\nou JBP</text><circle cx=\"299\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"299\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"299\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Rodada de\nNegócios</text><circle cx=\"421\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"421\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"421\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Negociação\npós-evento</text><circle cx=\"543\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"543\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"543\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Execução e\nFinanceiro</text><circle cx=\"665\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"665\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">6</text><text x=\"665\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Status e\nQBRs</text></svg><div class=\"diagram-caption\">As seis etapas da jornada do cliente SMB, da implantação aos QBRs</div></div>\n<p>Implantação e onboarding → Construção da campanha ou do JBP → Rodada de negócios, quando houver → Negociação pós-evento ou negociação remota → Execução, Financeiro Trade e CS Indústrias → Status, reports e QBRs.</p>\n<p>As próximas lições detalham cada uma dessas etapas.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 222\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"194\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">A jornada está avançando quando</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Onboarding concluído</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Campanha ou JBP definido</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Negócios fechados e formalizados</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Execução comprovada e recebida</text><circle cx=\"34\" cy=\"177\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 177l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"182\" font-size=\"12\" fill=\"#2B2361\">Status e QBRs acontecendo</text></svg><div class=\"diagram-caption\">Sinais de que o ciclo está avançando de verdade</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "jsmb1", "title": "10. Etapa 1: Implantação e Onboarding", "html": "<h1>10. Etapa 1: Implantação e Onboarding</h1>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"645\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"19\" fill=\"#C41E68\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#C41E68\"><tspan x=\"55\" dy=\"0\">Implantação</tspan></text><circle cx=\"173\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"173\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">2</text><text x=\"173\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"173\" dy=\"0\">Campanha</tspan><tspan x=\"173\" dy=\"13\">ou JBP</tspan></text><circle cx=\"291\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"291\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">3</text><text x=\"291\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"291\" dy=\"0\">Rodada de</tspan><tspan x=\"291\" dy=\"13\">Negócios</tspan></text><circle cx=\"409\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"409\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">4</text><text x=\"409\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"409\" dy=\"0\">Negociação</tspan><tspan x=\"409\" dy=\"13\">pós-evento</tspan></text><circle cx=\"527\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"527\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">5</text><text x=\"527\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"527\" dy=\"0\">Execução e</tspan><tspan x=\"527\" dy=\"13\">Financeiro</tspan></text><circle cx=\"645\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"645\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">6</text><text x=\"645\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"645\" dy=\"0\">Status e</tspan><tspan x=\"645\" dy=\"13\">QBRs</tspan></text></svg><div class=\"diagram-caption\">Onde a Implantação está na jornada do cliente SMB</div></div>\n<p>A jornada começa com o kick-off e com o período de onboarding.</p>\n<h2>Nesta etapa são realizados</h2>\n<ul>\n<li>entendimento inicial do cliente;</li>\n<li>coleta de documentos e informações;</li>\n<li>levantamento das lojas;</li>\n<li>cadastro de usuários;</li>\n<li>organização da base de indústrias;</li>\n<li>construção do Tradebook;</li>\n<li>parametrização da plataforma;</li>\n<li>configuração dos módulos;</li>\n<li>definição dos responsáveis;</li>\n<li>treinamento inicial;</li>\n<li>alinhamento dos processos;</li>\n<li>preparação da operação.</li>\n</ul>\n<p>O onboarding não termina apenas com a liberação dos acessos.</p>\n<p>Ele termina quando a Meu Cliente possui as informações e a estrutura necessárias para começar a construir as oportunidades comerciais do varejo.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 222\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"194\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">O onboarding está completo quando</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Lojas e usuários cadastrados</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Base de indústrias organizada</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Tradebook construído</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Módulos configurados</text><circle cx=\"34\" cy=\"177\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 177l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"182\" font-size=\"12\" fill=\"#2B2361\">Responsáveis definidos</text></svg><div class=\"diagram-caption\">O que confirma que a base está pronta para a próxima etapa</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "jsmb2", "title": "11. Etapa 2: Construção da Campanha ou do JBP", "html": "<h1>11. Etapa 2: Construção da Campanha ou do JBP</h1>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"645\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"55\" dy=\"0\">Implantação</tspan></text><circle cx=\"173\" cy=\"45\" r=\"19\" fill=\"#C41E68\"/><text x=\"173\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"173\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#C41E68\"><tspan x=\"173\" dy=\"0\">Campanha</tspan><tspan x=\"173\" dy=\"13\">ou JBP</tspan></text><circle cx=\"291\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"291\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">3</text><text x=\"291\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"291\" dy=\"0\">Rodada de</tspan><tspan x=\"291\" dy=\"13\">Negócios</tspan></text><circle cx=\"409\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"409\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">4</text><text x=\"409\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"409\" dy=\"0\">Negociação</tspan><tspan x=\"409\" dy=\"13\">pós-evento</tspan></text><circle cx=\"527\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"527\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">5</text><text x=\"527\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"527\" dy=\"0\">Execução e</tspan><tspan x=\"527\" dy=\"13\">Financeiro</tspan></text><circle cx=\"645\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"645\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">6</text><text x=\"645\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"645\" dy=\"0\">Status e</tspan><tspan x=\"645\" dy=\"13\">QBRs</tspan></text></svg><div class=\"diagram-caption\">Onde a construção da campanha ou do JBP está na jornada do cliente SMB</div></div>\n<p>Após o onboarding, o Estratégico entra em campo.</p>\n<p>Com base nas informações coletadas, no potencial do varejo e no calendário comercial, o Estratégico define qual formato é mais adequado:</p>\n<ul>\n<li>uma campanha específica;</li>\n<li>um JBP mais completo.</li>\n</ul>\n<p>Quando existe uma oportunidade pontual ou sazonal, é criada uma campanha adequada para aquele varejo.</p>\n<p>Quando existe potencial para uma negociação mais ampla, é construído um JBP.</p>\n<p>O objetivo é transformar o potencial do varejo em oportunidades comerciais claras para as indústrias.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 152\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Campanha específica</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">JBP completo</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">oportunidade pontual</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">ciclo mais curto</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">potencial mais amplo</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">negociação de longo prazo</text></svg><div class=\"diagram-caption\">O que leva o Estratégico a escolher um formato ou outro</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "jsmb3", "title": "12. Etapa 3: Rodada de Negócios, quando houver", "html": "<h1>12. Etapa 3: Rodada de Negócios, quando houver</h1>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"645\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"55\" dy=\"0\">Implantação</tspan></text><circle cx=\"173\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"173\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"173\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"173\" dy=\"0\">Campanha</tspan><tspan x=\"173\" dy=\"13\">ou JBP</tspan></text><circle cx=\"291\" cy=\"45\" r=\"19\" fill=\"#C41E68\"/><text x=\"291\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"291\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#C41E68\"><tspan x=\"291\" dy=\"0\">Rodada de</tspan><tspan x=\"291\" dy=\"13\">Negócios</tspan></text><circle cx=\"409\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"409\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">4</text><text x=\"409\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"409\" dy=\"0\">Negociação</tspan><tspan x=\"409\" dy=\"13\">pós-evento</tspan></text><circle cx=\"527\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"527\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">5</text><text x=\"527\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"527\" dy=\"0\">Execução e</tspan><tspan x=\"527\" dy=\"13\">Financeiro</tspan></text><circle cx=\"645\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"645\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">6</text><text x=\"645\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"645\" dy=\"0\">Status e</tspan><tspan x=\"645\" dy=\"13\">QBRs</tspan></text></svg><div class=\"diagram-caption\">Onde a Rodada de Negócios está na jornada do cliente SMB</div></div>\n<p>Quando o formato escolhido é o JBP, pode ser realizada uma rodada de negócios.</p>\n<p>A Meu Cliente organiza o evento em nome do varejo, recebe as indústrias e conduz as apresentações e negociações.</p>\n<h2>Durante a rodada</h2>\n<ul>\n<li>o varejo apresenta sua estratégia;</li>\n<li>o JBP é apresentado;</li>\n<li>as indústrias conhecem as oportunidades;</li>\n<li>são discutidos valores e contrapartidas;</li>\n<li>propostas são ajustadas;</li>\n<li>negócios podem ser fechados na própria noite.</li>\n</ul>\n<p>A rodada concentra em poucas horas negociações que poderiam levar semanas ou meses.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Varejo</tspan><tspan x=\"60\" dy=\"13\">apresenta</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Indústrias</tspan><tspan x=\"193\" dy=\"13\">conhecem</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Negociação</tspan><tspan x=\"327\" dy=\"13\">ao vivo</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Fechamentos</tspan><tspan x=\"460\" dy=\"13\">na noite</tspan></text></svg><div class=\"diagram-caption\">O que acontece durante a rodada de negócios</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "jsmb4", "title": "13. Etapa 4: Negociação Pós-evento ou Remota", "html": "<h1>13. Etapa 4: Negociação Pós-evento ou Remota</h1>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"645\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"55\" dy=\"0\">Implantação</tspan></text><circle cx=\"173\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"173\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"173\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"173\" dy=\"0\">Campanha</tspan><tspan x=\"173\" dy=\"13\">ou JBP</tspan></text><circle cx=\"291\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"291\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"291\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"291\" dy=\"0\">Rodada de</tspan><tspan x=\"291\" dy=\"13\">Negócios</tspan></text><circle cx=\"409\" cy=\"45\" r=\"19\" fill=\"#C41E68\"/><text x=\"409\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"409\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#C41E68\"><tspan x=\"409\" dy=\"0\">Negociação</tspan><tspan x=\"409\" dy=\"13\">pós-evento</tspan></text><circle cx=\"527\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"527\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">5</text><text x=\"527\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"527\" dy=\"0\">Execução e</tspan><tspan x=\"527\" dy=\"13\">Financeiro</tspan></text><circle cx=\"645\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"645\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">6</text><text x=\"645\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"645\" dy=\"0\">Status e</tspan><tspan x=\"645\" dy=\"13\">QBRs</tspan></text></svg><div class=\"diagram-caption\">Onde a negociação pós-evento está na jornada do cliente SMB</div></div>\n<p>A noite do evento não encerra a negociação.</p>\n<p>Nos dias seguintes, a Meu Cliente continua trabalhando as oportunidades que não foram fechadas na rodada.</p>\n<h2>Nesta etapa são realizados</h2>\n<ul>\n<li>follow-ups;</li>\n<li>envio de materiais;</li>\n<li>ajustes de propostas;</li>\n<li>negociação de contrapropostas;</li>\n<li>alinhamento com o varejo;</li>\n<li>aprovação de valores e entregas;</li>\n<li>fechamento dos negócios pendentes;</li>\n<li>formalização dos acordos.</li>\n</ul>\n<p>Cada oportunidade deve terminar com um status claro:</p>\n<ul>\n<li>fechada;</li>\n<li>em negociação;</li>\n<li>adiada;</li>\n<li>recusada;</li>\n<li>aguardando validação.</li>\n</ul>\n<p>Quando não existe rodada de negócios, as campanhas sazonais são apresentadas e negociadas remotamente desde o início.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 660 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><text x=\"330\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#2B2361\">Todo negócio termina com um status claro</text><rect x=\"30\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#1E8E5A\"/><text x=\"125\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Fechada</text><text x=\"125\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">ou em negociação</text><rect x=\"235\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#C46A1E\"/><text x=\"330\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Adiada</text><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">ou recusada</text><rect x=\"440\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#B8901A\"/><text x=\"535\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Aguardando</text><text x=\"535\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">validação</text></svg><div class=\"diagram-caption\">Os status possíveis para cada oportunidade em aberto</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "jsmb5", "title": "14. Etapa 5: Execução, Financeiro e CS Indústrias", "html": "<h1>14. Etapa 5: Execução, Financeiro e CS Indústrias</h1>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"645\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"55\" dy=\"0\">Implantação</tspan></text><circle cx=\"173\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"173\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"173\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"173\" dy=\"0\">Campanha</tspan><tspan x=\"173\" dy=\"13\">ou JBP</tspan></text><circle cx=\"291\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"291\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"291\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"291\" dy=\"0\">Rodada de</tspan><tspan x=\"291\" dy=\"13\">Negócios</tspan></text><circle cx=\"409\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"409\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"409\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"409\" dy=\"0\">Negociação</tspan><tspan x=\"409\" dy=\"13\">pós-evento</tspan></text><circle cx=\"527\" cy=\"45\" r=\"19\" fill=\"#C41E68\"/><text x=\"527\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"527\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#C41E68\"><tspan x=\"527\" dy=\"0\">Execução e</tspan><tspan x=\"527\" dy=\"13\">Financeiro</tspan></text><circle cx=\"645\" cy=\"45\" r=\"14\" fill=\"#D9D4EC\"/><text x=\"645\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#8B84A8\">6</text><text x=\"645\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"645\" dy=\"0\">Status e</tspan><tspan x=\"645\" dy=\"13\">QBRs</tspan></text></svg><div class=\"diagram-caption\">Onde essa etapa está na jornada do cliente SMB</div></div>\n<p>Após os fechamentos, três áreas entram diretamente em campo.</p>\n<h2>Execução</h2>\n<p>Garante que o que foi vendido seja realizado e comprovado.</p>\n<h2>Financeiro Trade</h2>\n<p>Acompanha contratos, faturamento, cobrança e recebimento.</p>\n<h2>CS Indústrias</h2>\n<p>Mantém a indústria informada, acompanha as entregas, apresenta resultados e fortalece o relacionamento para os próximos ciclos.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><rect x=\"20\" y=\"40\" width=\"200\" height=\"80\" rx=\"12\" fill=\"#2B2361\"/><text x=\"120\" y=\"72\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#F2C230\">Execução</text><text x=\"120\" y=\"92\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#C9C3E6\">entrega e comprova</text><rect x=\"250\" y=\"40\" width=\"200\" height=\"80\" rx=\"12\" fill=\"#3a3080\"/><text x=\"350\" y=\"72\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#F2C230\">Financeiro Trade</text><text x=\"350\" y=\"92\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#C9C3E6\">fatura e recebe</text><rect x=\"480\" y=\"40\" width=\"200\" height=\"80\" rx=\"12\" fill=\"#C41E68\"/><text x=\"580\" y=\"72\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#fff\">CS Indústrias</text><text x=\"580\" y=\"92\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#FBD9E1\">acompanha e relaciona</text><rect x=\"150\" y=\"150\" width=\"400\" height=\"34\" rx=\"9\" fill=\"#FFF7E0\" stroke=\"#F1DFA0\"/><text x=\"350\" y=\"172\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#B8901A\">As três frentes acontecem em paralelo, depois do fechamento</text></svg><div class=\"diagram-caption\">Essas três frentes acontecem em paralelo, depois do fechamento</div></div>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 162\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"134\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Sinais de que o pós-venda está saudável</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Execução comprovada com evidências</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Faturamento e recebimento em dia</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Indústria informada e satisfeita</text></svg><div class=\"diagram-caption\">O que indica que as três frentes estão funcionando bem</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "jsmb6", "title": "15. Etapa 6: Status, Reports e QBRs", "html": "<h1>15. Etapa 6: Status, Reports e QBRs</h1>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"645\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"55\" dy=\"0\">Implantação</tspan></text><circle cx=\"173\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"173\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"173\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"173\" dy=\"0\">Campanha</tspan><tspan x=\"173\" dy=\"13\">ou JBP</tspan></text><circle cx=\"291\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"291\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"291\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"291\" dy=\"0\">Rodada de</tspan><tspan x=\"291\" dy=\"13\">Negócios</tspan></text><circle cx=\"409\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"409\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"409\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"409\" dy=\"0\">Negociação</tspan><tspan x=\"409\" dy=\"13\">pós-evento</tspan></text><circle cx=\"527\" cy=\"45\" r=\"14\" fill=\"#2B2361\"/><text x=\"527\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"527\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#5B5578\"><tspan x=\"527\" dy=\"0\">Execução e</tspan><tspan x=\"527\" dy=\"13\">Financeiro</tspan></text><circle cx=\"645\" cy=\"45\" r=\"19\" fill=\"#C41E68\"/><text x=\"645\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">6</text><text x=\"645\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#C41E68\"><tspan x=\"645\" dy=\"0\">Status e</tspan><tspan x=\"645\" dy=\"13\">QBRs</tspan></text></svg><div class=\"diagram-caption\">Onde essa etapa está na jornada do cliente SMB</div></div>\n<p>Com a operação em andamento, começam os rituais recorrentes de acompanhamento.</p>\n<h2>Status</h2>\n<p>Mostra o andamento operacional:</p>\n<ul>\n<li>campanhas abertas;</li>\n<li>negociações em andamento;</li>\n<li>negócios fechados;</li>\n<li>campanhas em execução;</li>\n<li>comprovações pendentes;</li>\n<li>valores faturados;</li>\n<li>valores recebidos;</li>\n<li>pendências;</li>\n<li>responsáveis;</li>\n<li>próximos passos.</li>\n</ul>\n<h2>Reports</h2>\n<p>Consolidam os resultados:</p>\n<ul>\n<li>indústrias abordadas;</li>\n<li>indústrias participantes;</li>\n<li>propostas apresentadas;</li>\n<li>negócios fechados;</li>\n<li>valores negociados;</li>\n<li>campanhas executadas;</li>\n<li>comprovações;</li>\n<li>valores faturados;</li>\n<li>valores recebidos;</li>\n<li>evolução em relação à meta.</li>\n</ul>\n<h2>QBRs</h2>\n<p>São os encontros trimestrais para revisar a parceria com o varejo.</p>\n<p>Devem apresentar:</p>\n<ul>\n<li>o que foi planejado;</li>\n<li>o que foi negociado;</li>\n<li>o que foi executado;</li>\n<li>o que foi recebido;</li>\n<li>evolução do potencial;</li>\n<li>resultados do período;</li>\n<li>principais dificuldades;</li>\n<li>riscos;</li>\n<li>oportunidades ainda não exploradas;</li>\n<li>prioridades do próximo trimestre;</li>\n<li>plano de ação.</li>\n</ul>\n<p>O QBR não deve ser tratado apenas como uma apresentação de números. Ele precisa gerar decisões e direcionar o próximo ciclo.</p>\n\n<h2>Resumo visual da rota</h2>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 1000 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:760px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"940\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Implantamos e</tspan><tspan x=\"60\" dy=\"13\">preparamos</tspan></text><polygon points=\"118,38 128,42 118,46\" fill=\"#C41E68\"/><circle cx=\"186\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"186\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"186\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"186\" dy=\"0\">Estratégico</tspan><tspan x=\"186\" dy=\"13\">constrói</tspan></text><polygon points=\"244,38 254,42 244,46\" fill=\"#C41E68\"/><circle cx=\"311\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"311\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"311\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"311\" dy=\"0\">Apresentamos e</tspan><tspan x=\"311\" dy=\"13\">negociamos</tspan></text><polygon points=\"369,38 379,42 369,46\" fill=\"#C41E68\"/><circle cx=\"437\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"437\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"437\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"437\" dy=\"0\">Continuamos</tspan><tspan x=\"437\" dy=\"13\">negociando</tspan></text><polygon points=\"495,38 505,42 495,46\" fill=\"#C41E68\"/><circle cx=\"563\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"563\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"563\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"563\" dy=\"0\">Executamos e</tspan><tspan x=\"563\" dy=\"13\">comprovamos</tspan></text><polygon points=\"621,38 631,42 621,46\" fill=\"#C41E68\"/><circle cx=\"689\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"689\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">6</text><text x=\"689\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"689\" dy=\"0\">Faturamos e</tspan><tspan x=\"689\" dy=\"13\">recebemos</tspan></text><polygon points=\"746,38 756,42 746,46\" fill=\"#C41E68\"/><circle cx=\"814\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"814\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">7</text><text x=\"814\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"814\" dy=\"0\">Acompanhamos a</tspan><tspan x=\"814\" dy=\"13\">indústria</tspan></text><polygon points=\"872,38 882,42 872,46\" fill=\"#C41E68\"/><circle cx=\"940\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"940\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">8</text><text x=\"940\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"940\" dy=\"0\">Status, reports</tspan><tspan x=\"940\" dy=\"13\">e QBRs</tspan></text></svg><div class=\"diagram-caption\">O caminho completo da jornada SMB, do preparo à evolução do próximo ciclo</div></div>\n<p style=\"text-align:center; font-style:italic; color:var(--navy); font-weight:700; margin-top:20px;\">\"Na operação SMB, a Meu Cliente ajuda o varejo a transformar potencial em negócios negociados, executados, comprovados e recebidos.\"</p>\n<div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}], "count": 15}, {"id": "carteira", "num": 7, "title": "Gestão de Carteira", "subtitle": "Envolvidos, reuniões, integrações, usuários e Monday", "lessons": [{"id": "l40", "title": "1. Mapeamento dos envolvidos", "html": "<h1 id=\"mapeamento-dos-envolvidos\"><strong>1. MAPEAMENTO DOS\nENVOLVIDOS</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#2B2361\" height=\"42\" rx=\"10\" width=\"160\" x=\"270\" y=\"14\"></rect>\n<text fill=\"#F2C230\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"40\">A conta</text>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\" x1=\"350\" x2=\"120\" y1=\"56\" y2=\"100\"></line>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\" x1=\"350\" x2=\"280\" y1=\"56\" y2=\"100\"></line>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\" x1=\"350\" x2=\"420\" y1=\"56\" y2=\"100\"></line>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\"
