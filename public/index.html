a-aplicação-do-módulo\"><strong>3. Mostrar a aplicação do\nmódulo</strong></h3>\n<p>Como a plataforma pode apoiar esse processo?</p>\n<h3 id=\"definir-os-usuários\"><strong>4. Definir os\nusuários</strong></h3>\n<p>Quem precisa utilizar?</p>\n<h3 id=\"definir-a-rotina\"><strong>5. Definir a rotina</strong></h3>\n<p>Quando e com qual frequência será utilizado?</p>\n<h3 id=\"definir-o-sucesso\"><strong>6. Definir o sucesso</strong></h3>\n<p>Como saberemos que o módulo foi incorporado à operação?</p>\n<p>O CS não deve fazer uma apresentação genérica de funcionalidades sem\nconectar o produto à rotina do cliente.</p>\n<h2 id=\"como-medir-adoção\"><strong>5.13. Como medir adoção</strong></h2>\n<p>A adoção precisa considerar o objetivo de cada módulo.</p>\n<p>Temos os principais <strong>lock-ins</strong> da plataforma, que sao\nos responsaveis por manter o cliente seguro.</p>\n<p>- Workflow</p>\n<p>- Dashboards<br/>\n- Planta de loja<br/>\n- <strong>Fotocheck</strong></p>\n<p>- Gestao de jbp<br/>\n- Painel da industria</p>\n<p>Cliente seguro, e cliente 100% ativo nos modulos citados.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Problema</tspan><tspan x=\"60\" dy=\"13\">real</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Módulo</tspan><tspan x=\"193\" dy=\"13\">apresentado</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Rotina de</tspan><tspan x=\"327\" dy=\"13\">uso</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Resultado</tspan><tspan x=\"460\" dy=\"13\">percebido</tspan></text></svg><div class=\"diagram-caption\">Um módulo só faz sentido quando resolve um problema que o cliente reconhece</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l3 3-3 3-3-3 3-3z\"/><path d=\"M12 16l3 3-3 3-3-3 3-3z\"/><path d=\"M2 12l3-3 3 3-3 3-3-3z\"/><path d=\"M16 12l3-3 3 3-3 3-3-3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 2}, {"id": "clientes", "num": 4, "title": "Clientes", "subtitle": "Quem é o cliente: SMB e Enterprise, lado a lado", "lessons": [{"id": "clientes-intro", "title": "1. Quem é o cliente: SMB e Enterprise", "html": "<h1>1. Quem é o cliente: SMB e Enterprise</h1>\n<p>A Meu Cliente atende dois perfis de varejista, com modelos de entrega diferentes. Esta trilha reúne os dois, para que o time inteiro entenda como cada um funciona e saiba reconhecer rapidamente qual é o perfil de um cliente específico.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C41E68\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#3a3080\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Cliente SMB</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Cliente Enterprise</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">faturamento entre R$ 5 mi e R$ 40 mi</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">equipe Meu Cliente negocia em nome do varejo</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">JBP e rodadas de negócios conduzidos por nós</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">estrutura própria e mais robusta</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">o cliente negocia, a plataforma organiza</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">implantação, Go Live, adoção e consolidação</text></svg><div class=\"diagram-caption\">O que muda entre o modelo SMB e o modelo Enterprise</div></div>\n<p>No <strong>SMB</strong>, a Meu Cliente entrega uma equipe que atua como extensão da estrutura do varejista, incluindo a negociação em nome do varejo com as indústrias.</p>\n<p>No <strong>Enterprise</strong>, o cliente já possui uma estrutura própria mais robusta. A plataforma organiza o processo, mas quem decide, negocia e executa continua sendo o time do próprio cliente.</p>\n<p>As próximas lições detalham cada um dos dois modelos, começando pelo Enterprise e seguindo para o SMB.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 162\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"134\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Para identificar o perfil do cliente, veja</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Modelo de entrega contratado</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Quem negocia com as indústrias</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Estrutura interna de Trade do varejo</text></svg><div class=\"diagram-caption\">O que observar para saber se um cliente é SMB ou Enterprise</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "intro"}, {"id": "l29", "title": "2. Quem é o cliente Enterprise", "track": "enterprise", "html": "<h1 id=\"quem-é-o-cliente-enterprise-da-meu-cliente\"><strong>2. QUEM É O\nCLIENTE ENTERPRISE DA MEU CLIENTE</strong></h1>\n<p>O cliente Enterprise costuma ser uma rede varejista com uma estrutura\nmaior, diferentes áreas envolvidas e processos internos já\nestabelecidos.</p>\n<p>No Enterprise, a Meu Cliente entrega tecnologia. O varejista possui\nseu próprio time de Trade Marketing e continua responsável por conduzir\nsua operação.</p>\n<p>Nosso papel é apoiar esse time com uma plataforma que organiza\nprocessos, informações, responsáveis, <strong>workflow</strong>s e acompanhamentos.</p>\n<h2 id=\"características-comuns-de-um-cliente-enterprise\"><strong>Características\ncomuns de um cliente Enterprise</strong></h2>\n<p>Alguns traços aparecem com frequência nesse perfil de cliente:</p><ul>\n<li><p>possui um time interno de Trade Marketing;</p></li>\n<li><p>envolve diferentes áreas nos processos;</p></li>\n<li><p>possui regras próprias de segurança e tecnologia;</p></li>\n<li><p>pode depender de integrações;</p></li>\n<li><p>possui diferentes perfis de usuários;</p></li>\n<li><p>exige maior organização do atendimento;</p></li>\n<li><p>pode ter várias lojas, bandeiras ou regiões;</p></li>\n<li><p>possui processos internos de aprovação;</p></li>\n<li><p>pode mudar prioridades ao longo do projeto;</p></li>\n<li><p>espera estabilidade, clareza e segurança na comunicação.</p></li>\n</ul>\n<p>Nem todo cliente Enterprise possui uma operação madura.</p>\n<p>Uma empresa pode ser grande e ainda trabalhar com planilhas,\nmensagens, controles paralelos e processos pouco definidos.</p>\n<p>Por isso, o CS não deve chegar com respostas prontas. Primeiro,\nprecisa entender como aquele cliente trabalha.</p>\n<h2 id=\"o-que-o-cliente-enterprise-espera\"><strong>O que o cliente\nEnterprise espera</strong></h2>\n<p>O cliente espera que a Meu Cliente:</p>\n<ul>\n<li><p>conheça o escopo contratado;</p></li>\n<li><p>entenda sua operação;</p></li>\n<li><p>acompanhe o uso da plataforma;</p></li>\n<li><p>organize as demandas;</p></li>\n<li><p>seja clara sobre responsáveis e prazos;</p></li>\n<li><p>direcione corretamente os assuntos técnicos;</p></li>\n<li><p>mantenha o histórico das decisões;</p></li>\n<li><p>identifique riscos com antecedência;</p></li>\n<li><p>acompanhe a evolução da parceria;</p></li>\n<li><p>não faça promessas sem validação.</p></li>\n</ul>\n<p>O cliente não espera apenas rapidez. Ele espera que o CS saiba o que\nestá acontecendo e conduza os temas com segurança.</p>\n<h2 id=\"o-que-diferencia-o-atendimento-enterprise\"><strong>O que\ndiferencia o atendimento Enterprise</strong></h2>\n<p>O atendimento Enterprise costuma envolver:</p>\n<ul>\n<li><p>mais pessoas;</p></li>\n<li><p>maior impacto em caso de falha;</p></li>\n<li><p>processos mais longos;</p></li>\n<li><p>dependências entre áreas;</p></li>\n<li><p>integrações;</p></li>\n<li><p>relacionamento com diferentes níveis da empresa;</p></li>\n<li><p>necessidade de registrar decisões;</p></li>\n<li><p>acompanhamento contínuo da adoção.</p></li>\n</ul>\n<p>O cliente é o conjunto de pessoas que utiliza, influencia, aprova ou\ntoma decisões sobre a plataforma, não só o ponto focal com quem o CS\nconversa.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Time próprio</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Várias áreas</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Integrações</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Processos</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">CLIENTE</tspan><tspan x=\"240\" dy=\"15\">ENTERPRISE</tspan></text></svg><div class=\"diagram-caption\">Um cliente Enterprise nunca é uma única pessoa do outro lado da linha</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l30", "title": "3. Papel do CS Enterprise", "track": "enterprise", "html": "<h1 id=\"papel-do-cs-enterprise\"><strong>3. PAPEL DO CS\nENTERPRISE</strong></h1>\n<p>O CS Enterprise acompanha o cliente após a implantação e trabalha\npara que a plataforma seja utilizada dentro dos objetivos definidos.</p>\n<p>Seu papel não é operar a plataforma pelo cliente.</p>\n<p>Seu papel é criar condições para que o próprio cliente utilize a\nsolução de forma recorrente, organizada e conectada à sua rotina.</p>\n<h2 id=\"principais-responsabilidades\"><strong>Principais\nresponsabilidades</strong></h2>\n<p>No dia a dia, isso envolve:</p><ul>\n<li><p>compreender os objetivos do cliente;</p></li>\n<li><p>conhecer o escopo contratado;</p></li>\n<li><p>acompanhar a adoção;</p></li>\n<li><p>entender os processos configurados;</p></li>\n<li><p>manter o mapa de envolvidos atualizado;</p></li>\n<li><p>conduzir as reuniões mensais;</p></li>\n<li><p>acompanhar planos de ação;</p></li>\n<li><p>identificar riscos;</p></li>\n<li><p>direcionar demandas;</p></li>\n<li><p>acompanhar integrações;</p></li>\n<li><p>organizar o histórico da conta;</p></li>\n<li><p>conectar o cliente às áreas internas;</p></li>\n<li><p>demonstrar evolução;</p></li>\n<li><p>identificar oportunidades de <strong>upsell</strong>;</p></li>\n<li><p>garantir que o cliente conheça suas responsabilidades.</p></li>\n</ul><p>Nenhuma dessas responsabilidades exige que o CS execute tudo sozinho. Exige, sim, que ele garanta que cada uma delas tenha dono, prazo e acompanhamento.</p>\n<h2 id=\"o-cs-como-referência-da-conta\"><strong>O CS como referência da\nconta</strong></h2>\n<p>Após a implantação, o CS passa a ser a principal referência do\ncliente dentro da Meu Cliente.</p>\n<p>Isso não significa que o CS precisa resolver sozinho temas de\nProduto, Tecnologia, Suporte, Financeiro ou Implantação.</p>\n<p>Significa que ele precisa garantir que:</p>\n<ul>\n<li><p>a demanda foi entendida;</p></li>\n<li><p>existe uma pessoa responsável;</p></li>\n<li><p>o assunto está registrado;</p></li>\n<li><p>o cliente receberá um retorno;</p></li>\n<li><p>os próximos passos estão claros;</p></li>\n<li><p>o tema não será esquecido.</p></li>\n</ul>\n<p>O CS é responsável por manter o assunto em movimento, mas não por\nexecutar tecnicamente tudo o que o cliente solicita.</p>\n<h2 id=\"o-cs-como-organizador-da-relação\"><strong>O CS como organizador\nda relação</strong></h2>\n<p>Em uma conta Enterprise, diferentes pessoas podem apresentar\nnecessidades, problemas e prioridades.</p>\n<p>O CS precisa organizar essas informações para que o atendimento não\nvire uma sequência de pedidos sem contexto.</p>\n<p>Antes de encaminhar qualquer demanda, deve entender:</p>\n<ul>\n<li><p>qual é o problema;</p></li>\n<li><p>quem está sendo afetado;</p></li>\n<li><p>qual processo está envolvido;</p></li>\n<li><p>qual é o impacto;</p></li>\n<li><p>qual é a urgência;</p></li>\n<li><p>se a solicitação faz parte do escopo;</p></li>\n<li><p>se já existe uma solução disponível;</p></li>\n<li><p>quem precisa participar da decisão.</p></li>\n</ul>\n<h2 id=\"resultado-esperado\"><strong>Resultado esperado</strong></h2>\n<p>O trabalho do CS deve ajudar o cliente a:</p>\n<ul>\n<li><p>conhecer a plataforma;</p></li>\n<li><p>incorporar a solução à rotina;</p></li>\n<li><p>definir responsáveis;</p></li>\n<li><p>manter os processos atualizados;</p></li>\n<li><p>perceber evolução;</p></li>\n<li><p>saber a quem recorrer;</p></li>\n<li><p>confiar na Meu Cliente;</p></li>\n<li><p>reduzir controles paralelos;</p></li>\n<li><p>utilizar a tecnologia para organizar sua operação de\nTrade.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><circle cx=\"300\" cy=\"290\" r=\"210\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"300\" y1=\"290\" x2=\"300\" y2=\"80\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"241\" y=\"61\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"300\" y=\"84\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"300\" dy=\"0\">Cliente</tspan></text><line x1=\"300\" y1=\"290\" x2=\"500\" y2=\"225\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"441\" y=\"206\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"500\" y=\"229\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"500\" dy=\"0\">Produto</tspan></text><line x1=\"300\" y1=\"290\" x2=\"423\" y2=\"460\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"364\" y=\"441\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"423\" y=\"464\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"423\" dy=\"0\">Tecnologia</tspan></text><line x1=\"300\" y1=\"290\" x2=\"177\" y2=\"460\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"118\" y=\"441\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"177\" y=\"464\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"177\" dy=\"0\">Suporte</tspan></text><line x1=\"300\" y1=\"290\" x2=\"100\" y2=\"225\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"41\" y=\"206\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"100\" y=\"229\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"100\" dy=\"0\">Liderança</tspan></text><circle cx=\"300\" cy=\"290\" r=\"62\" fill=\"#2B2361\"/><text x=\"300\" y=\"286\" text-anchor=\"middle\" fill=\"#F2C230\" font-size=\"15\" font-weight=\"800\">CS</text><text x=\"300\" y=\"306\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\">conecta a conta</text></svg><div class=\"diagram-caption\">O CS é o ponto que conecta o cliente às áreas internas da Meu Cliente</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l31", "title": "4. Responsabilidades e limites de atuação do CS", "track": "enterprise", "html": "<h1 id=\"responsabilidades-e-limites-de-atuação-do-cs\"><strong>4. RESPONSABILIDADES E LIMITES DE ATUAÇÃO DO CS</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\" viewbox=\"0 0 700 170\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#1E8E5A\" height=\"140\" rx=\"14\" width=\"300\" x=\"30\" y=\"15\"></rect>\n<rect fill=\"#C0264F\" height=\"140\" rx=\"14\" width=\"300\" x=\"370\" y=\"15\"></rect>\n<text fill=\"#fff\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" x=\"180\" y=\"45\">O CS é responsável</text>\n<text fill=\"#fff\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" x=\"520\" y=\"45\">O CS não é responsável</text>\n<text fill=\"#DFF3E8\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"70\">organizar, acompanhar,</text>\n<text fill=\"#DFF3E8\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"86\">registrar, direcionar</text>\n<text fill=\"#DFF3E8\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"112\">garantir dono, prazo</text>\n<text fill=\"#DFF3E8\" font-size=\"11.5\" text-anchor=\"middle\" x=\"180\" y=\"128\">e retorno ao cliente</text>\n<text fill=\"#FBD9E1\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"70\">operar pelo cliente,</text>\n<text fill=\"#FBD9E1\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"86\">aprovar preço, estoque</text>\n<text fill=\"#FBD9E1\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"112\">decidir por áreas que</text>\n<text fill=\"#FBD9E1\" font-size=\"11.5\" text-anchor=\"middle\" x=\"520\" y=\"128\">não são dele</text>\n</svg><div class=\"diagram-caption\">O que é e o que não é responsabilidade do CS</div></div>\n<p>Para exercer bem sua função, o CS precisa saber pelo que é\nresponsável e o que pertence a outras áreas.</p>\n<p>Quando essa divisão não está clara, surgem promessas incorretas,\nretrabalho, sobrecarga e dependência do cliente.</p>\n<h2 id=\"o-cs-é-responsável-por\"><strong>O CS é responsável\npor</strong></h2>\n<p>Isso inclui:</p><ul>\n<li><p>acompanhar o relacionamento;</p></li>\n<li><p>organizar a jornada;</p></li>\n<li><p>compreender os objetivos;</p></li>\n<li><p>acompanhar o uso;</p></li>\n<li><p>conduzir reuniões;</p></li>\n<li><p>documentar decisões;</p></li>\n<li><p>acompanhar planos;</p></li>\n<li><p>identificar riscos;</p></li>\n<li><p>cobrar pendências;</p></li>\n<li><p>direcionar demandas;</p></li>\n<li><p>manter o cliente informado;</p></li>\n<li><p>envolver as pessoas certas;</p></li>\n<li><p>acompanhar a percepção de valor;</p></li>\n<li><p>garantir que as informações da conta estejam\natualizadas.</p></li>\n</ul><p>Essa lista é o que sustenta a confiança do cliente na condução da conta: quando algum desses pontos falha, é normal que o cliente sinta que perdeu a referência.</p>\n<h2 id=\"o-cs-não-é-responsável-por\"><strong>O CS não é responsável\npor</strong></h2>\n<p>Isso inclui:</p><ul>\n<li><p>operar Trade Marketing pelo cliente;</p></li>\n<li><p>realizar todos os cadastros no lugar dos usuários;</p></li>\n<li><p>executar processos internos do varejista;</p></li>\n<li><p>negociar com fornecedores em nome do cliente;</p></li>\n<li><p>aprovar preços;</p></li>\n<li><p>garantir estoque;</p></li>\n<li><p>produzir materiais de Marketing;</p></li>\n<li><p>executar rotinas financeiras;</p></li>\n<li><p>definir prioridades de Produto;</p></li>\n<li><p>determinar prazos técnicos;</p></li>\n<li><p>prometer funcionalidades;</p></li>\n<li><p>aprovar integrações;</p></li>\n<li><p>interpretar contratos;</p></li>\n<li><p>tomar decisões pelo cliente.</p></li>\n</ul><p>Ultrapassar esses limites, mesmo com boa intenção, tende a gerar dependência do cliente em relação ao CS em vez de reduzir o risco da conta.</p>\n<h2 id=\"apoiar-não-significa-assumir\"><strong>Apoiar não significa\nassumir</strong></h2>\n<p>O CS pode ajudar o cliente a organizar um processo, mas não deve se\ntornar o responsável permanente por executá-lo.</p>\n<p>Exemplo:</p>\n<p>O CS pode orientar o cliente no cadastro de uma campanha, acompanhar\no primeiro uso e revisar o processo configurado.</p>\n<p>O CS não deve cadastrar todas as campanhas do cliente todos os\nmeses.</p>\n<p>Quando o CS faz tudo no lugar do usuário, a adoção é apenas aparente.\nA plataforma está sendo movimentada, mas o cliente continua dependente\nda Meu Cliente.</p>\n<h2 id=\"como-agir-diante-de-uma-demanda-fora-do-papel-do-cs\"><strong>Como\nagir diante de uma demanda fora do papel do CS</strong></h2>\n<p>O CS deve:</p>\n<ol type=\"1\">\n<li><p>entender a necessidade;</p></li>\n<li><p>explicar quem precisa participar;</p></li>\n<li><p>direcionar a demanda;</p></li>\n<li><p>registrar o tema;</p></li>\n<li><p>acompanhar o retorno;</p></li>\n<li><p>atualizar o cliente.</p></li>\n</ol>\n<p>Não basta responder “não é comigo”.</p>\n<p>Mesmo quando não é o responsável pela execução, o CS precisa indicar\no caminho correto.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">O CS garante que a demanda tenha</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Dono definido</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Prazo combinado</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Registro</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Retorno ao cliente</text></svg><div class=\"diagram-caption\">Apoiar o cliente é diferente de assumir a execução por ele</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "l32", "title": "5. Competências esperadas do CS Enterprise", "track": "enterprise", "html": "<h1 id=\"competências-esperadas-do-cs-enterprise\"><strong>5. COMPETÊNCIAS ESPERADAS DO CS ENTERPRISE</strong></h1>\n<p>Um bom CS Enterprise não depende apenas de simpatia ou facilidade de\ncomunicação.</p>\n<p>A função exige conhecimento, organização, análise e firmeza para\nconduzir clientes complexos.</p>\n<h2 id=\"domínio-do-produto\"><strong>Domínio do produto</strong></h2>\n<p>O CS precisa conhecer:</p>\n<ul>\n<li><p>o funcionamento da plataforma;</p></li>\n<li><p>os principais processos;</p></li>\n<li><p>as regras de utilização;</p></li>\n<li><p>as limitações;</p></li>\n<li><p>as configurações do cliente;</p></li>\n<li><p>os caminhos para resolver dúvidas;</p></li>\n<li><p>os responsáveis internos por cada assunto.</p></li>\n</ul>\n<p>O CS não precisa ser desenvolvedor, mas precisa compreender o produto\no suficiente para não criar expectativas incorretas.</p>\n<h2 id=\"conhecimento-de-varejo-e-trade\"><strong>Conhecimento de varejo e\nTrade</strong></h2>\n<p>O CS deve conhecer:</p>\n<ul>\n<li><p>a estrutura de um varejo;</p></li>\n<li><p>o papel de Trade;</p></li>\n<li><p>a relação entre as áreas;</p></li>\n<li><p>campanhas;</p></li>\n<li><p><strong>workflow</strong>s;</p></li>\n<li><p>aprovações;</p></li>\n<li><p>calendário;</p></li>\n<li><p>execução;</p></li>\n<li><p>evidências;</p></li>\n<li><p><strong>JBP</strong>;</p></li>\n<li><p>indicadores básicos.</p></li>\n</ul>\n<p>Esse conhecimento ajuda o CS a entender o problema antes de falar\nsobre a ferramenta.</p>\n<h2 id=\"capacidade-analítica\"><strong>Capacidade analítica</strong></h2>\n<p>O CS deve observar dados, comportamentos e sinais da conta.</p>\n<p>Exemplos:</p>\n<ul>\n<li><p>redução de acessos;</p></li>\n<li><p>processos abandonados;</p></li>\n<li><p>reuniões canceladas;</p></li>\n<li><p>tarefas atrasadas;</p></li>\n<li><p>ponto focal pouco participativo;</p></li>\n<li><p>integração sem avanço;</p></li>\n<li><p>uso concentrado em uma única pessoa.</p></li>\n</ul>\n<p>Mas observar não é suficiente.</p>\n<p><strong>Dado sem ação não vale nada.</strong></p>\n<p>Se o CS percebe que os acessos diminuíram, precisa investigar a causa\ne criar um plano. Se identifica tarefas atrasadas, precisa entender o\nbloqueio e definir responsáveis.</p>\n<p>O dado precisa levar a uma decisão, uma cobrança ou uma mudança de\nrota.</p>\n<h2 id=\"organização\"><strong>Organização</strong></h2>\n<p>O CS precisa manter:</p>\n<ul>\n<li><p>histórico atualizado;</p></li>\n<li><p>reuniões registradas;</p></li>\n<li><p>tarefas com responsáveis;</p></li>\n<li><p>riscos documentados;</p></li>\n<li><p>próximos passos claros;</p></li>\n<li><p>prazos acompanhados;</p></li>\n<li><p>informações centralizadas.</p></li>\n</ul>\n<h2 id=\"comunicação\"><strong>Comunicação</strong></h2>\n<p>A comunicação deve ser:</p>\n<ul>\n<li><p>clara;</p></li>\n<li><p>direta;</p></li>\n<li><p>profissional;</p></li>\n<li><p>adequada ao público;</p></li>\n<li><p>baseada em fatos;</p></li>\n<li><p>sem promessas vagas;</p></li>\n<li><p>com responsáveis e prazos.</p></li>\n</ul>\n<h2 id=\"gestão-de-riscos\"><strong>Gestão de riscos</strong></h2>\n<p>O CS deve identificar sinais antes que o problema se transforme em\n<strong>churn</strong>.</p>\n<p>Isso exige:</p>\n<ul>\n<li><p>proximidade com o cliente;</p></li>\n<li><p>capacidade de questionar;</p></li>\n<li><p>acompanhamento dos dados;</p></li>\n<li><p>leitura das pessoas envolvidas;</p></li>\n<li><p>registro;</p></li>\n<li><p>plano de recuperação;</p></li>\n<li><p>envolvimento da liderança no momento correto.</p></li>\n</ul>\n<h2 id=\"senso-de-dono\"><strong>Senso de dono</strong></h2>\n<p>Senso de dono significa assumir a responsabilidade pela continuidade\ndo assunto.</p>\n<p>Não significa resolver tudo sozinho.</p>\n<p>Um CS com <strong>senso de dono</strong>:</p>\n<ul>\n<li><p>não abandona a demanda;</p></li>\n<li><p>não espera o cliente cobrar;</p></li>\n<li><p>procura quem pode resolver;</p></li>\n<li><p>registra o andamento;</p></li>\n<li><p>mantém os envolvidos informados;</p></li>\n<li><p>sinaliza riscos;</p></li>\n<li><p>conclui o tema ou formaliza o próximo passo.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Produto</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Varejo</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Análise</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Comunicação</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">CS</tspan><tspan x=\"240\" dy=\"15\">COMPLETO</tspan></text></svg><div class=\"diagram-caption\">Nenhuma competência sozinha sustenta uma conta Enterprise</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "smb1", "title": "6. Quem é o cliente SMB", "html": "<h1>6. Quem é o cliente SMB</h1>\n<p>O cliente SMB da Meu Cliente é o varejista que contrata uma estrutura completa para desenvolver e movimentar sua operação de Trade Marketing.</p>\n<p>Normalmente, possui faturamento mensal entre R$ 5 milhões e R$ 40 milhões, mas pode estar em faixas maiores. O faturamento ajuda a identificar o perfil, mas não é o único critério.</p>\n<p><strong>O principal critério é o modelo de entrega contratado.</strong></p>\n<p>No SMB, a Meu Cliente não entrega apenas uma plataforma. Entrega uma equipe que atua como extensão da estrutura do varejista.</p>\n<h2>A operação pode envolver</h2>\n<ul>\n<li>implantação;</li>\n<li>plataforma;</li>\n<li>planejamento estratégico;</li>\n<li>construção de campanhas;</li>\n<li>construção de JBP;</li>\n<li>relacionamento com as indústrias;</li>\n<li>negociação em nome do varejo;</li>\n<li>acompanhamento dos fechamentos;</li>\n<li>execução das campanhas;</li>\n<li>comprovação;</li>\n<li>acompanhamento financeiro;</li>\n<li>status;</li>\n<li>reports;</li>\n<li>QBRs.</li>\n</ul>\n<p>O cliente SMB normalmente possui uma estrutura interna de Trade pequena, em formação ou ainda pouco especializada.</p>\n<p>Em alguns casos, existe uma pessoa responsável por Trade. Em outros, as atividades estão divididas entre Comercial, Marketing, Diretoria, Financeiro e Operações.</p>\n<div class=\"callout callout-info\">\n<span class=\"callout-label\">Destaque</span>\n\"No SMB, a Meu Cliente não apenas orienta o varejista sobre como negociar. A Meu Cliente negocia em nome do varejo.\"\n</div>\n<h2>Nossa equipe</h2>\n<ul>\n<li>entende o potencial comercial da rede;</li>\n<li>identifica oportunidades;</li>\n<li>estrutura campanhas;</li>\n<li>constrói o JBP;</li>\n<li>prepara apresentações e propostas;</li>\n<li>entra em contato com as indústrias;</li>\n<li>apresenta as oportunidades em nome do varejo;</li>\n<li>negocia valores e contrapartidas;</li>\n<li>acompanha contrapropostas;</li>\n<li>realiza follow-ups;</li>\n<li>alinha aprovações com o varejista;</li>\n<li>trabalha até o fechamento dos negócios.</li>\n</ul>\n<p>As decisões estratégicas e aprovações finais são alinhadas com o varejista, mas a condução das negociações faz parte da entrega da Meu Cliente.</p>\n<p>Existem dois formatos frequentes de negociação:</p>\n<ol>\n<li>JBP apresentado por meio de rodadas de negócios;</li>\n<li>Campanhas sazonais negociadas remotamente.</li>\n</ol>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">JBP via rodada de negócios</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Campanha sazonal remota</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">evento presencial</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">várias indústrias</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">fechamentos na noite</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">negociação remota</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">uma data específica</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">ciclo mais curto</text></svg><div class=\"diagram-caption\">Os dois formatos mais comuns de negociação no SMB</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "smb2", "title": "7. JBP e Rodadas de Negócios", "html": "<h1>7. JBP e Rodadas de Negócios</h1>\n<p>O JBP organiza as principais oportunidades do varejo para um período mais longo.</p>\n<h2>Pode incluir</h2>\n<ul>\n<li>calendário anual;</li>\n<li>datas sazonais;</li>\n<li>projetos estratégicos;</li>\n<li>campanhas promocionais;</li>\n<li>ativações em loja;</li>\n<li>mídia;</li>\n<li>propriedades comerciais;</li>\n<li>oportunidades por categoria;</li>\n<li>ações de relacionamento;</li>\n<li>entregas e contrapartidas;</li>\n<li>investimentos esperados das indústrias.</li>\n</ul>\n<p>Em muitos clientes SMB, o JBP é apresentado por meio de uma rodada de negócios.</p>\n<p>A Meu Cliente organiza a rodada em nome do varejo, convida e recebe as indústrias, prepara as oportunidades e conduz as negociações.</p>\n<h2>Durante o evento</h2>\n<ul>\n<li>o varejo apresenta sua estratégia;</li>\n<li>as oportunidades são apresentadas às indústrias;</li>\n<li>são discutidos formatos, valores e contrapartidas;</li>\n<li>as propostas podem ser ajustadas;</li>\n<li>vários negócios podem ser fechados na própria noite.</li>\n</ul>\n<p>Esse modelo de rodada de negócios é muito característico e conhecido dentro da operação SMB.</p>\n<h2>Depois da noite do evento</h2>\n<p>A noite do evento não encerra a negociação.</p>\n<p>Algumas indústrias não fecham imediatamente porque precisam validar internamente, solicitar alterações ou apresentar contrapropostas.</p>\n<p>Nos dias seguintes, a equipe da Meu Cliente:</p>\n<ul>\n<li>organiza os interesses demonstrados;</li>\n<li>envia materiais complementares;</li>\n<li>realiza follow-ups;</li>\n<li>ajusta propostas;</li>\n<li>negocia valores e contrapartidas;</li>\n<li>alinha as aprovações com o varejo;</li>\n<li>fecha os negócios que não foram concluídos durante o evento;</li>\n<li>formaliza o que foi acordado.</li>\n</ul>\n<h2>Nem toda campanha depende de uma rodada</h2>\n<p>Durante o ano, a Meu Cliente negocia remotamente campanhas sazonais, como:</p>\n<ul>\n<li>Páscoa;</li>\n<li>Dia das Mães;</li>\n<li>Festa Junina;</li>\n<li>Dia dos Pais;</li>\n<li>aniversário da rede;</li>\n<li>Black Friday;</li>\n<li>Natal;</li>\n<li>campanhas regionais;</li>\n<li>campanhas por categoria;</li>\n<li>lançamentos;</li>\n<li>outras oportunidades comerciais.</li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Rodada do</tspan><tspan x=\"60\" dy=\"13\">evento</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Follow-up</tspan><tspan x=\"230\" dy=\"13\">pós-evento</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Fechamento</tspan><tspan x=\"400\" dy=\"13\">formalizado</tspan></text></svg><div class=\"diagram-caption\">A vida de uma negociação, do evento até o fechamento formal</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}, {"id": "smb3", "title": "8. Estrutura da Operação SMB", "html": "<h1>8. Estrutura da Operação SMB</h1>\n<p>Sete funções sustentam a operação SMB, cada uma responsável por uma etapa do caminho entre o potencial do varejo e o negócio recebido.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 760 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:700px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"45\" x2=\"700\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"45\" r=\"19\" fill=\"#2B2361\"/><text x=\"60\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Implantador</tspan><tspan x=\"60\" dy=\"13\">prepara</tspan></text><circle cx=\"273\" cy=\"45\" r=\"19\" fill=\"#2B2361\"/><text x=\"273\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"273\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"273\" dy=\"0\">Estratégico</tspan><tspan x=\"273\" dy=\"13\">define</tspan></text><circle cx=\"487\" cy=\"45\" r=\"19\" fill=\"#2B2361\"/><text x=\"487\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"487\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"487\" dy=\"0\">Trade</tspan><tspan x=\"487\" dy=\"13\">estrutura</tspan></text><circle cx=\"700\" cy=\"45\" r=\"19\" fill=\"#2B2361\"/><text x=\"700\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"700\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"700\" dy=\"0\">Negocia com</tspan><tspan x=\"700\" dy=\"13\">as indústrias</tspan></text><line x1=\"700\" y1=\"64\" x2=\"585\" y2=\"150\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"490\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" fill=\"#C41E68\"/><text x=\"585\" y=\"176\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#fff\">Execução</text><text x=\"585\" y=\"194\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#FBD9E1\">entrega e comprova</text><line x1=\"700\" y1=\"64\" x2=\"700\" y2=\"150\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"605\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" fill=\"#C41E68\"/><text x=\"700\" y=\"176\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#fff\">Financeiro Trade</text><text x=\"700\" y=\"194\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#FBD9E1\">fatura e recebe</text><line x1=\"700\" y1=\"64\" x2=\"815\" y2=\"150\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"720\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" fill=\"#C41E68\"/><text x=\"815\" y=\"176\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#fff\">CS Indústrias</text><text x=\"815\" y=\"194\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#FBD9E1\">acompanha e relaciona</text><rect x=\"30\" y=\"240\" width=\"700\" height=\"40\" rx=\"10\" fill=\"#F2C230\"/><text x=\"380\" y=\"266\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#2B2361\">CS do Varejo acompanha e conecta toda a operação</text></svg><div class=\"diagram-caption\">Como as sete funções da operação SMB se conectam, do preparo ao recebimento</div></div>\n\n<h2>Implantador</h2>\n<p>Responsável pelo kick-off e pelo período de onboarding.</p>\n<ul>\n<li>coleta de informações e documentos;</li>\n<li>cadastro de lojas e usuários;</li>\n<li>organização da base de indústrias;</li>\n<li>construção do Tradebook;</li>\n<li>parametrização da plataforma;</li>\n<li>configuração dos módulos;</li>\n<li>treinamento inicial;</li>\n<li>definição dos responsáveis;</li>\n<li>preparação do cliente para o início da operação.</li>\n</ul>\n\n<h2>CS do Varejo</h2>\n<p>Responsável pela visão geral da conta e pelo relacionamento com o varejista.</p>\n<ul>\n<li>conduzir reuniões de acompanhamento;</li>\n<li>acompanhar o Health Score;</li>\n<li>monitorar riscos;</li>\n<li>registrar atas e próximos passos;</li>\n<li>conectar todas as áreas envolvidas;</li>\n<li>acompanhar metas, pendências e resultados;</li>\n<li>conduzir status, reports e QBRs;</li>\n<li>garantir que cada ação tenha responsável e prazo.</li>\n</ul>\n\n<h2>Estratégico</h2>\n<p>Responsável por entender o potencial do varejista e definir o melhor formato comercial.</p>\n<ul>\n<li>analisar o cliente;</li>\n<li>entender categorias e oportunidades;</li>\n<li>definir prioridades;</li>\n<li>construir o planejamento;</li>\n<li>definir se será criada uma campanha específica ou um JBP;</li>\n<li>estruturar o JBP;</li>\n<li>apoiar rodadas de negócios;</li>\n<li>direcionar negociações de maior relevância;</li>\n<li>redirecionar a estratégia com base nos resultados.</li>\n</ul>\n\n<h2>Trade</h2>\n<p>Responsável por transformar a estratégia em oportunidades que possam ser apresentadas às indústrias.</p>\n<ul>\n<li>construir o calendário comercial;</li>\n<li>desenhar campanhas;</li>\n<li>criar formatos de ativação;</li>\n<li>estruturar cotas e propriedades;</li>\n<li>definir contrapartidas;</li>\n<li>apoiar a precificação;</li>\n<li>construir apresentações e materiais comerciais;</li>\n<li>garantir que o que será vendido possa ser executado.</li>\n</ul>\n\n<h2>CS Indústrias</h2>\n<p>Responsável pelo relacionamento com as indústrias após o início das negociações e, principalmente, depois dos fechamentos.</p>\n<ul>\n<li>manter contato com as indústrias;</li>\n<li>acompanhar campanhas;</li>\n<li>fornecer visibilidade sobre a execução;</li>\n<li>organizar atualizações;</li>\n<li>garantir clareza sobre as entregas;</li>\n<li>acompanhar comprovações;</li>\n<li>resolver pendências;</li>\n<li>apresentar resultados;</li>\n<li>identificar novas oportunidades;</li>\n<li>fortalecer a recorrência do relacionamento.</li>\n</ul>\n\n<h2>Execução</h2>\n<p>Responsável por garantir que o que foi vendido seja entregue.</p>\n<ul>\n<li>organizar as campanhas;</li>\n<li>alinhar contrapartidas;</li>\n<li>orientar lojas e gerentes;</li>\n<li>acompanhar ativações;</li>\n<li>controlar prazos;</li>\n<li>utilizar o Fotocheck;</li>\n<li>coletar fotos e evidências;</li>\n<li>cobrar correções;</li>\n<li>validar comprovações;</li>\n<li>organizar os materiais que serão entregues às indústrias.</li>\n</ul>\n\n<h2>Financeiro Trade</h2>\n<p>Responsável por acompanhar o caminho entre o fechamento e o recebimento.</p>\n<ul>\n<li>registrar contratos e valores;</li>\n<li>acompanhar parcelas;</li>\n<li>acompanhar faturamento;</li>\n<li>realizar cobranças;</li>\n<li>controlar vencimentos;</li>\n<li>acompanhar recebimentos;</li>\n<li>identificar atrasos;</li>\n<li>realizar conciliações;</li>\n<li>acompanhar meta versus recebido;</li>\n<li>apontar diferenças entre negociado, faturado e recebido.</li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><circle cx=\"300\" cy=\"290\" r=\"210\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"300\" y1=\"290\" x2=\"300\" y2=\"80\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"241\" y=\"61\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"300\" y=\"84\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"300\" dy=\"0\">Implantador</tspan></text><line x1=\"300\" y1=\"290\" x2=\"464\" y2=\"159\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"405\" y=\"140\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"464\" y=\"163\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"464\" dy=\"0\">Estratégico</tspan></text><line x1=\"300\" y1=\"290\" x2=\"505\" y2=\"337\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"446\" y=\"318\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"505\" y=\"341\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"505\" dy=\"0\">Trade</tspan></text><line x1=\"300\" y1=\"290\" x2=\"391\" y2=\"479\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"332\" y=\"460\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"391\" y=\"476\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"391\" dy=\"0\">CS do</tspan><tspan x=\"391\" dy=\"13\">Varejo</tspan></text><line x1=\"300\" y1=\"290\" x2=\"209\" y2=\"479\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"150\" y=\"460\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"209\" y=\"476\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"209\" dy=\"0\">CS</tspan><tspan x=\"209\" dy=\"13\">Indústrias</tspan></text><line x1=\"300\" y1=\"290\" x2=\"95\" y2=\"337\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"318\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"95\" y=\"341\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"95\" dy=\"0\">Execução</tspan></text><line x1=\"300\" y1=\"290\" x2=\"136\" y2=\"159\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"77\" y=\"140\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"136\" y=\"156\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"136\" dy=\"0\">Financeiro</tspan><tspan x=\"136\" dy=\"13\">Trade</tspan></text><circle cx=\"300\" cy=\"290\" r=\"62\" fill=\"#2B2361\"/><text x=\"300\" y=\"286\" text-anchor=\"middle\" fill=\"#F2C230\" font-size=\"15\" font-weight=\"800\">VAREJO</text><text x=\"300\" y=\"306\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\">operação SMB</text></svg><div class=\"diagram-caption\">As sete funções que sustentam a operação SMB, vistas em conjunto</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "smb"}], "count": 8}, {"id": "regras", "num": 5, "title": "Regras de Atendimento", "subtitle": "Padrões obrigatórios de organização", "lessons": [{"id": "l33", "title": "Regras obrigatórias de atendimento e organização", "html": "<h1 id=\"regras-obrigatórias-de-atendimento-e-organização\"><strong>REGRAS\nOBRIGATÓRIAS DE ATENDIMENTO E ORGANIZAÇÃO</strong></h1>\n<p>O atendimento Enterprise precisa seguir alguns padrões mínimos.</p>\n<p>Essas regras protegem o cliente, o CS e a Meu Cliente.</p>\n<h2 id=\"toda-reunião-deve-ter-objetivo\"><strong>Toda reunião deve ter\nobjetivo</strong></h2>\n<p>Antes de entrar em uma reunião, o CS precisa saber:</p>\n<ul>\n<li><p>por que a reunião está acontecendo;</p></li>\n<li><p>qual resultado precisa ser alcançado;</p></li>\n<li><p>quais informações devem ser apresentadas;</p></li>\n<li><p>quais decisões precisam ser tomadas;</p></li>\n<li><p>quem precisa participar.</p></li>\n</ul>\n<h2 id=\"toda-reunião-deve-gerar-registro\"><strong>Toda reunião deve\ngerar registro</strong></h2>\n<p>O registro deve conter:</p>\n<ul>\n<li><p>data;</p></li>\n<li><p>participantes;</p></li>\n<li><p>assuntos discutidos;</p></li>\n<li><p>decisões;</p></li>\n<li><p>pendências;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>prazos;</p></li>\n<li><p>próximos passos.</p></li>\n</ul>\n<p>O registro deve ser enviado ao cliente e salvo no ambiente\noficial.</p>\n<h2 id=\"as-reuniões-devem-ser-gravadas\"><strong>As reuniões devem ser\ngravadas</strong></h2>\n<p>A gravação permite:</p>\n<ul>\n<li><p>revisar acordos;</p></li>\n<li><p>treinar o time;</p></li>\n<li><p>preservar o histórico;</p></li>\n<li><p>reduzir divergências;</p></li>\n<li><p>avaliar a qualidade da condução.</p></li>\n</ul>\n<p>A gravação deve respeitar as regras e autorizações aplicáveis.</p>\n<h2 id=\"toda-pendência-precisa-de-responsável-e-prazo\"><strong>Toda\npendência precisa de responsável e prazo</strong></h2>\n<p>“Vamos verificar” não é um plano de ação.</p>\n<p>O registro correto deve informar:</p>\n<ul>\n<li><p>o que será verificado;</p></li>\n<li><p>quem fará a análise;</p></li>\n<li><p>até quando;</p></li>\n<li><p>quando o cliente receberá um retorno.</p></li>\n</ul>\n<h2 id=\"o-monday-é-o-ambiente-oficial-da-operação\"><strong>O Monday é o\nambiente oficial da operação</strong></h2>\n<p>Informações importantes não podem ficar apenas em mensagens, memória\nou anotações pessoais.</p>\n<p>Devem ser registrados no <strong>Monday</strong>:</p>\n<ul>\n<li><p>reuniões;</p></li>\n<li><p>tarefas;</p></li>\n<li><p>riscos;</p></li>\n<li><p>status da conta;</p></li>\n<li><p>pendências;</p></li>\n<li><p>decisões;</p></li>\n<li><p>acompanhamentos;</p></li>\n<li><p>planos de ação.</p></li>\n</ul>\n<h2 id=\"não-prometer-sem-validação\"><strong>Não prometer sem\nvalidação</strong></h2>\n<p>O CS não deve confirmar:</p>\n<ul>\n<li><p>prazo de desenvolvimento;</p></li>\n<li><p>correção técnica;</p></li>\n<li><p>integração;</p></li>\n<li><p>personalização;</p></li>\n<li><p>alteração de produto;</p></li>\n<li><p>condição comercial;</p></li>\n<li><p>mudança de escopo;</p></li>\n</ul>\n<p>sem validar com a área responsável.</p>\n<h2 id=\"não-esconder-problemas\"><strong>Não esconder\nproblemas</strong></h2>\n<p>Quando houver atraso, erro ou impedimento, o CS deve comunicar com\nclareza.</p>\n<p>É melhor apresentar o problema junto com o próximo passo do que\ndeixar o cliente sem retorno.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Toda reunião importante precisa de</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Objetivo claro</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Registro escrito</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Pendência com dono e prazo</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Retorno ao cliente</text></svg><div class=\"diagram-caption\">Regras simples que evitam que o combinado se perca depois da reunião</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z\"/><path d=\"M9 12l2 2 4-4\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 1}, {"id": "jornada", "num": 6, "title": "Jornada do Cliente", "subtitle": "Enterprise e SMB, do início até a consolidação ou os QBRs", "lessons": [{"id": "jornada-intro", "title": "1. Jornada do cliente: SMB e Enterprise", "html": "<h1>1. Jornada do cliente: SMB e Enterprise</h1>\n<p>O formato da jornada muda conforme o modelo de entrega do cliente. Esta trilha reúne as duas jornadas, para que o time saiba conduzir qualquer uma delas.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C41E68\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Jornada Enterprise</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Jornada SMB</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">implantação e transição para o CS</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">Go Live e adoção da plataforma</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">consolidação na rotina do cliente</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">implantação e construção do JBP</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">rodada de negócios e fechamentos</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">execução, financeiro e QBRs</text></svg><div class=\"diagram-caption\">O formato de cada jornada muda, mas o princípio é o mesmo: preparar, negociar ou implantar, executar e acompanhar</div></div>\n<p>No <strong>Enterprise</strong>, a jornada gira em torno de implantação, transição para o CS, Go Live, adoção e consolidação da plataforma na rotina do cliente.</p>\n<p>No <strong>SMB</strong>, a jornada gira em torno de implantação, construção da campanha ou do JBP, rodada de negócios, execução, financeiro e QBRs.</p>\n<p>As próximas lições detalham cada uma das duas jornadas, começando pela Enterprise e seguindo para a SMB.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 152\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#C41E68\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Enterprise</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">SMB</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">cliente negocia</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">plataforma organiza</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">Meu Cliente negocia</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">equipe conduz o processo</text></svg><div class=\"diagram-caption\">A diferença central entre as duas jornadas: quem conduz a negociação</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "intro"}, {"id": "l34", "title": "2. Visão geral da jornada do cliente Enterprise", "html": "<h1 id=\"visão-geral-da-jornada-do-cliente-enterprise\"><strong>2. VISÃO\nGERAL DA JORNADA DO CLIENTE ENTERPRISE</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\" viewbox=\"0 0 700 140\" xmlns=\"http://www.w3.org/2000/svg\">\n<line stroke=\"#E4E1EE\" stroke-width=\"3\" x1=\"60\" x2=\"640\" y1=\"70\" y2=\"70\"></line><circle cx=\"60\" cy=\"70\" fill=\"#2B2361\" r=\"22\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"60\" y=\"75\">1</text><text fill=\"#2B2361\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"60\" y=\"112\">Implantação</text><circle cx=\"176\" cy=\"70\" fill=\"#2B2361\" r=\"22\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"176\" y=\"75\">2</text><text fill=\"#2B2361\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"176\" y=\"112\">Transição</text><circle cx=\"292\" cy=\"70\" fill=\"#2B2361\" r=\"22\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"292\" y=\"75\">3</text><text fill=\"#2B2361\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"292\" y=\"112\">Go Live</text><circle cx=\"408\" cy=\"70\" fill=\"#2B2361\" r=\"22\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"408\" y=\"75\">4</text><text fill=\"#2B2361\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"408\" y=\"112\">Adoção</text><circle cx=\"524\" cy=\"70\" fill=\"#2B2361\" r=\"22\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"524\" y=\"75\">5</text><text fill=\"#2B2361\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"524\" y=\"112\">Consolidação</text><circle cx=\"640\" cy=\"70\" fill=\"#F2C230\" r=\"22\"></circle><text fill=\"#2B2361\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"640\" y=\"75\">6</text><text fill=\"#2B2361\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"640\" y=\"112\">Upsell</text>\n</svg><div class=\"diagram-caption\">As seis etapas da jornada do cliente Enterprise</div></div>\n<p>A jornada do cliente Enterprise pode ser organizada em seis\netapas:</p>\n<ol type=\"1\">\n<li><p>Implantação;</p></li>\n<li><p>Transição para o CS;</p></li>\n<li><p><strong>Go Live</strong>;</p></li>\n<li><p>Adoção;</p></li>\n<li><p>Consolidação;</p></li>\n<li><p>Upsell.</p></li>\n</ol>\n<p>O contrato da Meu Cliente possui renovação automática. Portanto, não\nexiste uma etapa anual obrigatória de renovação comercial.</p>\n<p>A continuidade da parceria é construída durante toda a jornada, por\nmeio de adoção, relacionamento, estabilidade e valor percebido.</p>\n<h2 id=\"implantação\"><strong>Implantação</strong></h2>\n<p>Objetivo: preparar a plataforma, os usuários e os primeiros\nprocessos.</p>\n<h2 id=\"transição\"><strong>Transição</strong></h2>\n<p>Objetivo: transferir o conhecimento da Implantação para o CS sem\nperda de informações.</p>\n<h2 id=\"go-live\"><strong>Go Live</strong></h2>\n<p>Objetivo: iniciar o uso real da solução.</p>\n<h2 id=\"adoção\"><strong>Adoção</strong></h2>\n<p>Objetivo: transformar os primeiros acessos em utilização\nrecorrente.</p>\n<h2 id=\"consolidação\"><strong>Consolidação</strong></h2>\n<p>Objetivo: fazer com que a plataforma seja incorporada à rotina do\ncliente.</p>\n<h2 id=\"upsell\"><strong>Upsell</strong></h2>\n<p>Objetivo: identificar e desenvolver oportunidades de venda de novas\nfuncionalidades ou soluções que gerem receita adicional para a Meu\nCliente.</p>\n<p>Aumentar o uso de algo que já está contratado é adoção ou\nconsolidação. Não é <strong>upsell</strong>.</p>\n<h2 id=\"critério-geral-de-sucesso\"><strong>Critério geral de\nsucesso</strong></h2>\n<p>A jornada está evoluindo quando a plataforma:</p>\n<ul>\n<li><p>possui responsáveis;</p></li>\n<li><p>é utilizada de forma recorrente;</p></li>\n<li><p>faz parte dos processos reais;</p></li>\n<li><p>mantém informações atualizadas;</p></li>\n<li><p>gera visibilidade;</p></li>\n<li><p>possui envolvimento da liderança;</p></li>\n<li><p>não depende apenas do CS para funcionar;</p></li>\n<li><p>abre oportunidades reais de upsell.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 660 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><text x=\"330\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#2B2361\">Como saber se a jornada evolui</text><rect x=\"30\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#1E8E5A\"/><text x=\"125\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Recorrente</text><text x=\"125\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">uso vira rotina</text><rect x=\"235\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#F2C230\"/><text x=\"330\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Instável</text><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">depende do CS</text><rect x=\"440\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#C0264F\"/><text x=\"535\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Parada</text><text x=\"535\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">sem dono nem uso</text></svg><div class=\"diagram-caption\">O sinal mais simples de que a jornada está, ou não, andando</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2-7 4 14 2-7h6\"/></svg></div><div class=\"lesson-end-line\"></div></div>", "segment": "enterprise"}, {"id": "jorn_kickoff", "title": "3. Roteiro da reunião de kick-off", "html": "<h1>3. Roteiro da reunião de kick-off</h1>\n\n<p>O kick-off é a primeira reunião oficial com o cliente depois da assinatura do contrato. Normalmente reúne o time da Meu Cliente (CS e Implantação) e as principais pessoas do cliente: referência executiva, ponto focal e, quando possível, alguém de TI. Dura em torno de 45 a 60 minutos e usa como apoio a apresentação de Kick-off Enterprise, sempre customizada com o nome do cliente antes do envio.</p>\n\n<p>O objetivo dessa reunião não é vender a plataforma de novo. O contrato já foi fechado. O objetivo é alinhar expectativa, apresentar o time e deixar claro como vai funcionar a implantação daqui para frente.</p>\n\n<h2>Antes da reunião</h2>\n<p>Alguns preparos evitam começar a parceria com o pé errado:</p>\n<ul>\n<li>customizar a capa da apresentação com o nome do varejo;</li>\n<li>confirmar quem, do lado do cliente, vai participar (referência executiva é essencial);</li>\n<li>alinhar internamente quem representa CS e quem representa Implantação;</li>\n<li>revisar o cronograma padrão de 40 dias e já identificar possíveis exceções daquele cliente;</li>\n<li>ter em mãos o e-mail ou WhatsApp de contato que será usado durante a implantação.</li>\n</ul>\n\n<h2>Abertura (primeiros 5 minutos)</h2>\n<p>O tom da abertura marca a reunião inteira. A ideia é transmitir que a Meu Cliente está entrando como parceira de longo prazo, não como fornecedora de um sistema.</p>\n<p><strong>Frase pronta:</strong> \"Seja muito bem-vindo, [nome do varejo]. A partir de agora, a Meu Cliente passa a ser o departamento de trade marketing de vocês. Estamos prontos para caminhar juntos nessa jornada.\"</p>\n\n<h2>Apresentação do time (5 a 10 minutos)</h2>\n<p>Apresente as duas pessoas que vão acompanhar o cliente de perto, deixando claro o papel de cada uma:</p>\n<ul>\n<li>o responsável por <strong>Implantação</strong> cuida da configuração técnica: valida informações, parametriza a plataforma e deixa o ambiente pronto;</li>\n<li>o <strong>CS</strong> acompanha do início ao dia a dia, organiza treinamentos e garante que a plataforma gere valor real na operação.</li>\n</ul>\n<p>Vale reforçar que o cliente nunca fica sozinho, e que por trás dessas duas pessoas existe um time maior dedicado a fazer o trade marketing funcionar de verdade no varejo.</p>\n\n<h2>Objetivo da parceria (10 a 15 minutos)</h2>\n<p>Aqui entra o contexto: a Meu Cliente entra como uma estrutura completa de gestão de trade marketing, substituindo processos manuais, planilhas dispersas e falta de visibilidade por uma operação centralizada, acompanhada e com indicadores claros.</p>\n<p>Vale citar, sem entrar em detalhe técnico ainda, os ganhos que o cliente deve esperar: controle de negociações, centralização da informação, redução de processos manuais, visibilidade de ponta a ponta e execução acompanhada em loja.</p>\n\n<h2>Como funciona a implantação (15 a 25 minutos)</h2>\n<p>Esse é o bloco mais prático da reunião. Apresente as etapas na ordem, sempre reforçando que o time da Meu Cliente conduz o processo junto com o cliente:</p>\n<ol>\n<li>envio das informações iniciais (lojas, usuários, gerentes, cadastro de indústrias);</li>\n<li>estruturação de dados e estrutura (documentações, plantas, fotos, contatos de TI);</li>\n<li>configuração dos módulos (parametrização de acordo com o jeito que o varejo funciona);</li>\n<li>validação da plataforma (reunião para mostrar o ambiente e tudo que foi inserido);</li>\n<li>treinamento e refinamento (testes conjuntos e ajustes finais);</li>\n<li>reunião de Go-Live (aprovação final e início da operação real).</li>\n</ol>\n<p>O prazo médio comunicado ao cliente é de 40 dias. Reforce que esse prazo depende diretamente da agilidade do cliente no envio das informações iniciais, principalmente a planilha de onboarding.</p>\n\n<h2>Cronograma além do Go-Live</h2>\n<p>Para não deixar a sensação de que o acompanhamento termina no Go-Live, apresente as fases seguintes:</p>\n<ul>\n<li><strong>Adoção</strong> (cerca de 60 dias): agenda semanal para evoluir o uso junto com o time do cliente;</li>\n<li><strong>On Going</strong> (contínuo): encontros mensais para garantir resultado contínuo, além de suporte técnico, eventos e re-treinamentos trimestrais.</li>\n</ul>\n\n<h2>Ecossistema da plataforma (25 a 35 minutos)</h2>\n<p>Apresente os pilares em nível conceitual, sem tentar ensinar a plataforma inteira nessa reunião:</p>\n<ul>\n<li><strong>Comprovação (Fotocheck):</strong> execução em loja comprovada por foto, com link e senha, em tempo real para a indústria;</li>\n<li><strong>Gestão de KPIs:</strong> dashboards de execução, financeiro, contratos, inventário e pipe de negociação;</li>\n<li><strong>Fluxo de tarefas (workflow):</strong> etapas organizadas entre varejo e indústria, com responsáveis e prazos visíveis;</li>\n<li><strong>Integração com ERP:</strong> não é obrigatória para começar, mas é o passo que automatiza cadastro de SKUs e cruzamento de dados de venda.</li>\n</ul>\n<p>Se fizer sentido, cite o número de referência: a média de execução dos varejos parceiros da Meu Cliente gira em torno de 91%, e esse é o patamar que a parceria busca alcançar junto.</p>\n\n<h2>Roteiro da demonstração ao vivo</h2>\n<p>Enquanto a seção anterior apresenta os pilares em nível conceitual, esta parte é o guia prático de qual tela abrir e em que ordem, seguindo a mesma sequência usada nas apresentações de referência da plataforma.</p>\n<ol>\n<li><strong>Dashboards</strong>: abra os painéis Executivo, Operacional e Estratégico. Não explique cada gráfico em detalhe, o objetivo aqui é o cliente entender que vai ter uma visão de resultado que hoje provavelmente não tem, organizada por perfil de acesso.</li>\n<li><strong>Cadastros (Indústria/Fornecedor, Loja e Usuário)</strong>: mostre rapidamente essas telas e confirme com o cliente se a base já enviada está completa. É o momento de reforçar que essas informações vieram da planilha de onboarding.</li>\n<li><strong>Gestão de Planos</strong>: abra a lista de planos já negociados e explique que cada linha representa um acordo comercial com uma indústria, com fornecedor, campanha, vigência e responsável.</li>\n<li><strong>Simulação de uma campanha</strong>: monte, ao vivo, uma simulação simples com o cliente, escolhendo indústria, período e tipo de mídia (gôndola, backlight, adesivo de checkout etc.), para o cliente ver o processo de ponta a ponta em vez de só ouvir sobre ele.</li>\n<li><strong>Alocação por loja e calendário</strong>: mostre como a plataforma organiza a alocação de espaços por loja e por data, e como fica visível o que já está ocupado, evitando conflito entre campanhas diferentes.</li>\n<li><strong>Workflow e responsáveis</strong>: explique como cada etapa do processo pode ter um responsável definido dentro da própria ferramenta, substituindo o controle manual por e-mail ou planilha.</li>\n<li><strong>Detalhamento de um plano</strong>: abra um plano já criado e passe rapidamente pelas abas de ativos alocados, fluxo de pagamentos, acordo, histórico, anexos, book fotográfico, painel da indústria e tarefas, para o cliente já saber onde encontrar cada tipo de informação depois.</li>\n<li><strong>Planta de loja e produto foco</strong> (quando fizer sentido para o perfil do cliente): mostre rapidamente como funciona o upload da planta de loja e a seleção de produtos foco por categoria.</li>\n</ol>\n<p>Vale reforçar durante toda a demonstração: a plataforma organiza o processo, mas quem decide preço, negocia com a indústria e executa na loja continua sendo o time do cliente.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 760 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"700\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Dashboards</tspan></text><polygon points=\"119,38 129,42 119,46\" fill=\"#C41E68\"/><circle cx=\"188\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"188\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"188\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"188\" dy=\"0\">Cadastros</tspan></text><polygon points=\"247,38 257,42 247,46\" fill=\"#C41E68\"/><circle cx=\"316\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"316\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"316\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"316\" dy=\"0\">Gestão de</tspan><tspan x=\"316\" dy=\"13\">Planos</tspan></text><polygon points=\"375,38 385,42 375,46\" fill=\"#C41E68\"/><circle cx=\"444\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"444\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"444\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"444\" dy=\"0\">Simulação</tspan></text><polygon points=\"503,38 513,42 503,46\" fill=\"#C41E68\"/><circle cx=\"572\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"572\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"572\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"572\" dy=\"0\">Alocação e</tspan><tspan x=\"572\" dy=\"13\">workflow</tspan></text><polygon points=\"631,38 641,42 631,46\" fill=\"#C41E68\"/><circle cx=\"700\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"700\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">6</text><text x=\"700\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"700\" dy=\"0\">Detalhamento</tspan><tspan x=\"700\" dy=\"13\">do plano</tspan></text></svg><div class=\"diagram-caption\">A sequência de telas usada na demonstração ao vivo, do painel geral ao detalhamento do plano</div></div>\n\n<h2>Fatores críticos de sucesso (35 a 40 minutos)</h2>\n<p>Esse é o momento de ser transparente sobre o que ajuda e o que atrapalha o projeto. Apresente os dois lados lado a lado:</p>\n<ul>\n<li>informações completas e organizadas no onboarding, em vez de dados incompletos ou atrasados;</li>\n<li>time usando
