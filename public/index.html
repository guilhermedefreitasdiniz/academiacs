<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia de CS · Meu Cliente</title>
<style>
  :root{
    --navy:#2B2361;
    --navy-deep:#1D1745;
    --magenta:#C41E68;
    --magenta-soft:#F4DCE7;
    --lavender:#F0EFF4;
    --gold:#F2C230;
    --gold-deep:#E0A70F;
    --white:#FFFFFF;
    --ink:#231B4A;
    --ink-soft:#5B5578;
    --line:#E4E1EE;
    --radius:16px;
    --shadow: 0 12px 30px -12px rgba(43,35,97,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Calibri','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    background:var(--lavender);
    color:var(--ink);
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:var(--navy);}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- utility ---------- */
  .dots-bg{
    background-image: radial-gradient(rgba(255,255,255,0.18) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    border:none; border-radius:12px; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:15px;
    padding:13px 22px; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--gold); color:var(--navy);}
  .btn-gold:hover{background:var(--gold-deep); box-shadow:0 8px 20px -8px rgba(224,167,15,0.6);}
  .btn-ghost{background:transparent; color:var(--white); border:1.5px solid rgba(255,255,255,0.35);}
  .btn-ghost:hover{border-color:#fff; background:rgba(255,255,255,0.08);}
  .btn-outline-navy{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-outline-navy:hover{border-color:var(--magenta); color:var(--magenta);}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.12); color:#fff;
    border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600;
  }

  /* ---------- LOGIN ---------- */
  #view-login{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 15% -10%, #FFFFFF 0%, var(--lavender) 55%, #E6E2F2 100%);
    padding:24px;
    position:relative; overflow:hidden;
  }
  #view-login::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(43,35,97,0.05) 1.4px, transparent 1.4px);
    background-size: 24px 24px;
    pointer-events:none;
  }
  .login-card{
    position:relative; z-index:1;
    background:var(--white); border-radius:20px; box-shadow:0 30px 60px -20px rgba(43,35,97,0.22);
    width:100%; max-width:400px; padding:44px 36px 34px;
    text-align:center;
    border:1px solid var(--line);
  }
  .login-logo{
    width:200px; max-width:80%; height:auto; margin:0 auto 26px; display:block;
  }
  .login-badge{
    width:56px; height:56px; border-radius:14px; margin:0 auto 18px;
    background:linear-gradient(135deg, var(--magenta), var(--navy));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; font-size:22px; letter-spacing:.5px;
  }
  .login-card h1{font-size:21px; margin:0 0 4px; color:var(--navy);}
  .login-card p.sub{margin:0 0 26px; color:var(--ink-soft); font-size:14.5px; line-height:1.5;}
  .login-card input{
    width:100%; padding:13px 14px; border-radius:11px; border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; margin-bottom:10px; outline:none;
    transition:border-color .15s ease;
  }
  .login-card input:focus{border-color:var(--magenta);}
  .login-card .btn{width:100%; justify-content:center; margin-top:6px;}
  .login-error{color:#C0264F; font-size:13px; min-height:18px; margin-top:8px; font-weight:600;}
  .login-foot{margin-top:22px; font-size:12px; color:#9A93B5;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; gap:16px;
    border-bottom:3px solid var(--gold);
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
  .brand .mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg, var(--magenta), #7a3fae);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
  }
  .brand .word{font-weight:800; font-size:16.5px; letter-spacing:.2px;}
  .brand .word span{color:var(--gold);}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .progress-chip{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.10); border-radius:999px; padding:7px 14px 7px 8px;
  }
  .progress-ring{width:26px; height:26px; flex:none;}
  .progress-chip .txt{font-size:12.5px; font-weight:700;}

  /* ---------- HOME ---------- */
  #view-home{flex:1;}
  .hero{
    background:radial-gradient(1100px 600px at 85% -20%, #45389a 0%, var(--navy) 55%, var(--navy-deep) 100%);
    color:#fff; padding:56px 28px 64px; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.10) 1.4px, transparent 1.4px);
    background-size: 24px 24px; pointer-events:none;
  }
  .hero-inner{max-width:1120px; margin:0 auto; position:relative; z-index:1;}
  .hero-eyebrow{color:var(--gold); font-weight:800; letter-spacing:1.5px; font-size:12.5px; text-transform:uppercase; margin-bottom:14px;}
  .hero h1{font-size:40px; line-height:1.15; margin:0 0 18px; max-width:680px; font-weight:800;}
  .hero h1 em{font-style:normal; color:var(--gold);}
  .hero p.lead{font-size:16.5px; line-height:1.65; max-width:640px; color:#E4E0F5; margin:0 0 28px;}
  .hero-ctas{display:flex; gap:14px; flex-wrap:wrap;}

  .culture-wrap{max-width:1120px; margin:-30px auto 0; padding:0 28px; position:relative; z-index:2;}
  .culture-card{
    background:#fff; border-radius:20px; box-shadow:var(--shadow);
    padding:32px 34px;
  }
  .culture-card h2{margin:0 0 6px; font-size:20px; color:var(--navy);}
  .culture-card p.msg{color:var(--ink-soft); font-size:14.5px; line-height:1.7; margin:0 0 22px; max-width:760px;}
  .premise-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px;}
  .premise{
    display:flex; gap:12px; padding:16px; border-radius:14px; background:var(--lavender);
    border:1px solid var(--line);
  }
  .premise .num{
    flex:none; width:30px; height:30px; border-radius:9px; background:var(--navy); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13.5px;
  }
  .premise .body b{display:block; font-size:14px; color:var(--navy); margin-bottom:3px;}
  .premise .body span{font-size:13px; color:var(--ink-soft); line-height:1.5;}

  .section-head{max-width:1120px; margin:52px auto 20px; padding:0 28px; display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .section-head h2{font-size:24px; margin:0 0 4px; color:var(--navy);}
  .section-head p{margin:0; color:var(--ink-soft); font-size:14px;}
  .search-box{position:relative;}
  .search-box input{
    padding:10px 14px 10px 36px; border-radius:11px; border:1.5px solid var(--line);
    font-family:inherit; font-size:13.5px; width:240px; outline:none;
  }
  .search-box input:focus{border-color:var(--magenta);}
  .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45;}

  .tracks-grid{
    max-width:1120px; margin:0 auto; padding:0 28px 60px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:18px;
  }
  .track-card{
    background:#fff; border-radius:16px; padding:22px 22px 20px; border:1px solid var(--line);
    box-shadow:0 6px 18px -12px rgba(43,35,97,0.12);
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:14px;
  }
  .track-card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--magenta-soft);}
  .track-top{display:flex; align-items:center; gap:12px;}
  .track-icon-chip{
    position:relative; flex:none; width:52px; height:52px; border-radius:14px;
    background:var(--lavender); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .track-icon-chip svg{width:34px; height:34px;}
  .track-icon-num{
    position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 4px;
    border-radius:999px; background:var(--navy); color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
  }
  .track-card h3{margin:0; font-size:16px; color:var(--navy); line-height:1.3;}
  .track-card p{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; flex:1;}
  .track-meta{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--ink-soft);}
  .bar{height:6px; border-radius:999px; background:var(--lavender); overflow:hidden; margin-top:2px;}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg, var(--magenta), var(--navy)); border-radius:999px;}


  /* Container das caixinhas de PIN */
.pin-input-group {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 20px 0;
}

/* Estilo individual de cada quadrado */
.pin-box {
  width: 52px;
  height: 58px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  font-size: 24px;
  font-weight: 800;
  color: #FFFFFF;
  text-align: center;
  text-transform: uppercase;
  outline: none;
  transition: all 0.2s ease-in-out;
}

/* Efeito quando o usuário clica ou foca na caixa */
.pin-box:focus {
  border-color: #F2C230;
  background: rgba(242, 194, 48, 0.15);
  box-shadow: 0 0 12px rgba(242, 194, 48, 0.35);
  transform: scale(1.05);
}
  /* ---------- TRACK / LESSON VIEW ---------- */
  #view-track{flex:1; display:flex; flex-direction:column;}
  .track-header{
    background:var(--navy); color:#fff; padding:26px 28px; 
  }
  .track-header-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:16px; justify-content:space-between; flex-wrap:wrap;}
  .smb-toggle-pill{
    display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25);
    border-radius:999px; padding:9px 18px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .smb-toggle-pill:hover{background:var(--gold); color:var(--navy); border-color:var(--gold);}
  .crumb{background:none; border:none; color:#C9C3E6; font-family:inherit; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px; padding:0; margin-bottom:8px;}
  .crumb:hover{color:#fff;}
  .track-header h1{margin:0; font-size:24px;}
  .track-header .sub{color:#C9C3E6; font-size:13.5px; margin-top:4px;}

  .track-body{max-width:1180px; margin:0 auto; width:100%; display:flex; gap:28px; padding:28px; flex:1; align-items:flex-start;}
  .lesson-nav{
    flex:none; width:290px; background:#fff; border-radius:16px; border:1px solid var(--line);
    padding:10px; position:sticky; top:84px; max-height:calc(100vh - 110px); overflow:auto;
  }
  .lesson-nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:11px; cursor:pointer;
    font-size:13.5px; color:var(--ink); line-height:1.4;
  }
  .lesson-nav-item:hover{background:var(--lavender);}
  .lesson-nav-item.active{background:var(--magenta-soft); color:var(--magenta); font-weight:700;}
  .lesson-nav-item .chk{
    flex:none; width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
  }
  .lesson-nav-item.done .chk{background:var(--navy); border-color:var(--navy);}
  .lesson-nav-item.video-nav-item{font-weight:700; color:var(--navy);}
  .lesson-nav-item.video-nav-item.active{background:var(--navy); color:#fff;}
  .video-chk{background:var(--gold); color:var(--navy); border-color:var(--gold);}
  .lesson-nav-item.video-nav-item.active .video-chk{background:var(--gold); color:var(--navy);}
  .mini-count{
    display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 5px;
    border-radius:999px; background:var(--gold); color:var(--navy); font-size:10px; font-weight:800; margin-left:4px;
  }
  .nav-divider{height:1px; background:var(--line); margin:8px 4px;}
  .nav-segment-label{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--magenta);
    padding:14px 12px 6px; margin-top:4px; border-top:1px solid var(--line);
  }
  .nav-segment-label:first-child{border-top:none; margin-top:0; padding-top:4px;}

  .folder-card.video-folder-card{border-color:var(--gold); background:#FFFBEF;}
  .folder-card.estudo-card{align-items:flex-start; padding:26px 24px; gap:18px;}
  .folder-card.estudo-card .folder-icon{width:50px; height:50px; margin-top:2px;}
  .estudo-desc{font-size:12.5px; color:var(--ink-soft); margin:6px 0 12px; line-height:1.55;}
  .estudo-section-hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 18px;}
  .estudo-grid{
    max-width:1180px; margin:0 auto 60px; padding:8px 28px 60px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:22px;
  }
  .video-folder-icon{background:var(--gold); color:var(--navy);}

  .lesson-pane{flex:1; min-width:0; background:#fff; border-radius:16px; border:1px solid var(--line); padding:44px 52px; box-shadow:0 6px 18px -14px rgba(43,35,97,0.1);}
  .lesson-content{max-width:720px; margin:0 auto; font-size:16px; line-height:1.75; color:var(--ink);}
  .lesson-content h1{font-size:26px; color:var(--navy); margin:0 0 22px; padding-bottom:14px; border-bottom:2px solid var(--lavender);}
  .lesson-content h1 strong{font-weight:800;}
  .lesson-content h2{font-size:19px; color:var(--navy); margin:34px 0 12px;}
  .lesson-content h3{font-size:16.5px; color:var(--magenta); margin:26px 0 10px;}
  .lesson-content p{margin:0 0 16px;}
  .lesson-content ul, .lesson-content ol{margin:0 0 16px; padding-left:22px;}
  .lesson-content li{margin-bottom:7px;}
  .lesson-content strong{color:var(--navy);}
  .lesson-content hr{border:none; border-top:1px solid var(--line); margin:26px 0;}
  .lesson-content blockquote{
    margin:18px 0; padding:14px 18px; background:var(--lavender); border-left:4px solid var(--magenta);
    border-radius:0 10px 10px 0; color:var(--ink-soft); font-size:15px;
  }
  /* highlight callout paragraphs that start with "Atenção para o CS" pattern handled via JS wrap */
  .callout{
    margin:20px 0; padding:16px 20px; border-radius:12px; background:#FFF7E0; border:1px solid #F1DFA0;
  }
  .callout .callout-label{font-weight:800; color:var(--gold-deep); font-size:12.5px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; display:block;}
  .callout.callout-danger{background:#FCEAEE; border-color:#F1C2CD;}
  .callout.callout-danger .callout-label{color:#C0264F;}
  .callout.callout-info{background:#EFEBFB; border-color:#D9CEF2;}
  .callout.callout-info .callout-label{color:var(--navy);}

  .diagram-box{
    margin:22px 0 26px; padding:22px 18px 16px; background:#fff; border:1px solid var(--line);
    border-radius:14px;
  }
  .diagram-caption{
    text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:12px; font-style:italic;
  }
  .closing-diagram{
    margin-top:36px; border-color:var(--line); background:linear-gradient(180deg, #fff, var(--lavender) 220%);
  }
  .closing-diagram-eyebrow{
    text-align:center; font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
    color:var(--magenta); margin-bottom:10px;
  }

  .email-card{
    margin:18px 0; border-radius:14px; border:1px solid var(--line); overflow:hidden;
    box-shadow:0 6px 16px -12px rgba(43,35,97,0.15);
  }
  .email-subject{
    background:var(--lavender); padding:12px 18px; font-size:14px; font-weight:700; color:var(--navy);
    border-bottom:1px solid var(--line);
  }
  .email-subject-label{
    display:inline-block; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:var(--magenta); margin-right:10px; background:var(--magenta-soft); padding:2px 8px; border-radius:999px;
  }
  .email-body{padding:20px 22px; background:#fff; font-size:15px; line-height:1.7;}
  .email-body p{margin:0 0 14px;}
  .email-body p:last-child{margin-bottom:0;}
  .email-hint{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-top:-6px;}
  .email-plan-body{padding:20px 22px; background:#fff;}
  .email-plan-body ul{margin:10px 0 0; padding-left:20px;}

  .book-grid{display:flex; flex-direction:column; gap:20px; margin:26px 0;}
  .book-card{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px 28px;
    box-shadow:0 6px 18px -14px rgba(43,35,97,0.12);
  }
  .book-card-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:14px;}
  .book-icon{
    flex:none; width:44px; height:44px; border-radius:12px; background:var(--magenta-soft); color:var(--magenta);
    display:flex; align-items:center; justify-content:center;
  }
  .book-cover-box{flex:none; width:76px; height:104px; border-radius:8px; overflow:hidden; background:var(--magenta-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;}
  .book-cover-box:hover .book-cover-img{filter:blur(0px); transform:scale(1.04);}
  .book-cover-box .book-icon{width:100%; height:100%; border-radius:0;}
  .book-cover-img{width:100%; height:100%; object-fit:cover; display:block; filter:blur(0.35px); transition:filter 0.2s ease, transform 0.2s ease;}

  /* Card de Thumbnail do Vídeo */
  .video-card-thumb {
    position: relative;
    width: 160px;
    height: 90px;
    flex: none;
    border-radius: 8px;
    overflow: hidden;
    background: #0d0a1f;
    cursor: pointer;
  }

  .video-card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(0.35px);
    transition: filter 0.2s ease, transform 0.2s ease;
  }

  .video-card-thumb:hover img {
    filter: blur(0px);
    transform: scale(1.06);
  }

  .video-card-play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(43, 35, 97, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    transition: background 0.2s ease;
  }

  .video-card-thumb:hover .video-card-play-overlay {
    background: rgba(196, 30, 104, 0.7);
  }

  .img-modal-overlay{
    position:fixed; inset:0; background:rgba(13, 10, 31, 0.88); z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:24px;
    cursor:zoom-out; animation:fadeIn 0.2s ease;
  }
  .img-modal-box{
    max-width:90vw; max-height:90vh; position:relative;
    display:flex; flex-direction:column; align-items:center;
  }
  .img-modal-img{
    max-width:100%; max-height:85vh; object-fit:contain;
    border-radius:8px; box-shadow:0 20px 50px rgba(0,0,0,0.6);
  }
  .img-modal-caption{
    color:#ffffff; font-size:14px; font-weight:700; margin-top:12px; text-align:center;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .book-head-text{flex:1; min-width:0;}
  .book-title{font-size:17px; font-weight:800; color:var(--navy); line-height:1.3;}
  .book-author{font-size:12.5px; color:var(--ink-soft); margin-top:2px; margin-bottom:10px;}
  .book-cover-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--lavender); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--navy); cursor:pointer;
  }
  .book-cover-btn:hover{border-color:var(--magenta); color:var(--magenta);}
  .book-cover-status{font-size:11px; color:var(--ink-soft); margin-left:8px;}

<script id="tracks-data" type="application/json">[{"id": "estrutura", "num": 1, "title": "Estrutura do Varejo", "subtitle": "O dia a dia de cada área do varejo, e como ela se conecta com o Trade", "lessons": [{"id": "est1", "title": "1. Por que o CS precisa conhecer o varejo", "html": "<h1>1. Por que o CS precisa conhecer o varejo</h1>\n<p>Para atender um cliente varejista com qualidade, o CS precisa compreender como as principais áreas do varejo funcionam no dia a dia, antes de qualquer conversa sobre a plataforma.</p>\n<p>Trade Marketing é uma área transversal. Ela raramente decide algo sozinha: depende de informações, aprovações ou entregas de outros setores, como Comercial, Pricing, Marketing, Tecnologia, Supply, Financeiro e Operações. Quanto mais o CS entende a rotina real dessas áreas, mais fácil fica interpretar por que uma campanha atrasou, por que um processo trava, ou por que uma pessoa específica precisa ser envolvida numa conversa.</p>\n<p>Este bloco não fala sobre a plataforma Meu Cliente. Fala sobre o varejo: como cada área trabalha, sob que pressão, com quais ferramentas e com qual relação com Trade Marketing. A conversa sobre a plataforma vem depois, no bloco seguinte.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 760 760\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:600px;display:block;margin:0 auto;\">\n<circle cx=\"380\" cy=\"380\" r=\"285\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/>\n<line x1=\"380\" y1=\"380\" x2=\"380\" y2=\"95\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"504\" y2=\"123\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"603\" y2=\"202\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"658\" y2=\"317\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"658\" y2=\"443\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"603\" y2=\"558\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"504\" y2=\"637\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"380\" y2=\"665\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"256\" y2=\"637\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"157\" y2=\"558\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"102\" y2=\"443\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"102\" y2=\"317\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"157\" y2=\"202\" stroke=\"#D9D4EC\" stroke-width=\"2\"/><line x1=\"380\" y1=\"380\" x2=\"256\" y2=\"123\" stroke=\"#D9D4EC\" stroke-width=\"2\"/>\n<circle cx=\"380\" cy=\"380\" r=\"70\" fill=\"#2B2361\"/>\n<text x=\"380\" y=\"375\" text-anchor=\"middle\" fill=\"#F2C230\" font-size=\"17\" font-weight=\"800\">TRADE</text>\n<text x=\"380\" y=\"396\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"10.5\">área transversal</text>\n<rect x=\"321\" y=\"75\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"380\" y=\"95\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">Comercial</text><rect x=\"445\" y=\"103\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"504\" y=\"123\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">Pricing</text><rect x=\"544\" y=\"182\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"603\" y=\"202\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">Marketing</text><rect x=\"599\" y=\"297\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"658\" y=\"317\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"658\" dy=\"-6\">Tecnologia</tspan><tspan x=\"658\" dy=\"14\">da Informação</tspan></text><rect x=\"599\" y=\"423\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"658\" y=\"443\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"658\" dy=\"-6\">Supply</tspan><tspan x=\"658\" dy=\"14\">Chain</tspan></text><rect x=\"544\" y=\"538\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"603\" y=\"558\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"603\" dy=\"-6\">Operações</tspan><tspan x=\"603\" dy=\"14\">de Loja</tspan></text><rect x=\"445\" y=\"617\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"504\" y=\"637\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"504\" dy=\"-6\">Visual</tspan><tspan x=\"504\" dy=\"14\">Merchandising</tspan></text><rect x=\"321\" y=\"645\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"380\" y=\"665\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">Financeiro</text><rect x=\"197\" y=\"617\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"256\" y=\"637\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"256\" dy=\"-6\">Gestão de</tspan><tspan x=\"256\" dy=\"14\">Categorias</tspan></text><rect x=\"98\" y=\"538\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"157\" y=\"558\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">E-commerce</text><rect x=\"43\" y=\"423\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"102\" y=\"443\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"102\" dy=\"-6\">CRM e</tspan><tspan x=\"102\" dy=\"14\">Fidelidade</tspan></text><rect x=\"43\" y=\"297\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"102\" y=\"317\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">SAC</text><rect x=\"98\" y=\"182\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"157\" y=\"202\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">Jurídico</text><rect x=\"197\" y=\"103\" width=\"118\" height=\"40\" rx=\"10\" fill=\"#ffffff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"256\" y=\"123\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2B2361\">Diretoria</text>\n</svg><div class=\"diagram-caption\">Trade Marketing no centro da operação, conectado a todas as áreas do varejo</div></div>\n<p>O diagrama acima resume a ideia central: Trade está no meio de uma rede de áreas, e cada uma delas entra na conversa por um motivo diferente. Nas próximas lições, cada uma dessas áreas é explicada separadamente, sempre terminando com a mesma pergunta: como ela se conecta com o Trade.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Este bloco cobre</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Comercial, Pricing, Marketing</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Tecnologia, Supply, Operações</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Financeiro, Jurídico, Diretoria</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Sempre terminando na conexão com Trade</text></svg><div class=\"diagram-caption\">Cada área será explicada separadamente, sempre com a mesma pergunta no final</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est2", "title": "2. Comercial e Compras", "html": "<h1>2. Comercial e Compras</h1>\n<h2>O dia a dia de Comercial e Compras</h2>\n<p>Comercial, ou Compras, é a área que senta à mesa com fornecedores e indústrias para negociar o que vai chegar às lojas e em que condições. O dia a dia da área gira em torno de reuniões de negociação, planilhas de metas por categoria e conversas constantes sobre preço de compra, prazo de pagamento e volume.</p>\n<p>Um comprador ou gerente de categoria costuma acompanhar dezenas de fornecedores ao mesmo tempo, cada um com uma pauta diferente: um quer entrar com um produto novo, outro quer renegociar condições, outro está atrasado numa entrega. A pressão principal da área é sobre margem e sortimento: garantir que a loja tenha os produtos certos, no preço certo, sem parar de negociar melhores condições o tempo todo.</p>\n<p>É também uma área que trabalha com metas comerciais bem definidas, revisadas mês a mês, e que precisa justificar decisões de sortimento tanto para a Diretoria quanto, às vezes, para a própria indústria.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Em redes maiores, a área costuma ter compradores ou category managers por categoria de produto, gerentes comerciais acima deles, e analistas que cuidam da parte operacional das negociações. Em redes menores, uma única pessoa pode acumular várias dessas funções.</p>\n<h2>Conexão com o Trade</h2>\n<p>É dentro dessas negociações comerciais que nascem muitas das campanhas que depois viram trabalho de Trade: uma condição especial de preço, uma verba de mídia, uma cota extra de produto para uma ação promocional. Quando o CS entende que uma demanda de campanha muitas vezes começou numa negociação comercial que ele nunca viu, fica mais fácil interpretar de onde vêm certas urgências e certos pedidos de ajuste de última hora.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Fornecedor</tspan><tspan x=\"60\" dy=\"13\">negocia</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Preço e</tspan><tspan x=\"193\" dy=\"13\">volume</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Condição</tspan><tspan x=\"327\" dy=\"13\">especial</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Chega até</tspan><tspan x=\"460\" dy=\"13\">o Trade</tspan></text></svg><div class=\"diagram-caption\">Da negociação com o fornecedor até a condição que vira campanha de Trade</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est3", "title": "3. Trade Marketing", "html": "<h1>3. Trade Marketing</h1>\n<h2>O dia a dia de Trade Marketing</h2>\n<p>Trade Marketing é a área que transforma o que foi negociado com a indústria em campanhas que realmente acontecem dentro do varejo. O dia a dia costuma ser dividido entre reuniões com a indústria, organização de um calendário cheio de datas comerciais e cobrança constante de outras áreas para que uma campanha saia do papel.</p>\n<p>Quem trabalha em Trade lida com prazos apertados, contrapartidas que precisam ser cumpridas e a sensação constante de estar entre dois lados: o que a indústria espera e o que o varejo consegue entregar na prática. Boa parte do tempo é gasta organizando informação que está espalhada, cobrando confirmação de outras áreas e apresentando resultado de campanhas já encerradas.</p>\n<p>É uma área que convive bem com pressão, porque lida ao mesmo tempo com prazos comerciais e com a operação real das lojas, que nem sempre anda no mesmo ritmo que o combinado com a indústria.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Pode ter um analista ou coordenador por indústria ou grupo de indústrias, um gerente de Trade acompanhando o calendário geral, e em operações maiores, uma diretoria própria de Trade Marketing separada do Comercial.</p>\n<h2>Conexão com o Trade</h2>\n<p>Trade Marketing não é uma área que se conecta com o Trade: ela é o próprio Trade. Por isso, entender essa área bem é o que permite ao CS falar a língua do cliente e perceber, numa conversa, se o que está sendo pedido é realmente uma novidade ou apenas uma forma diferente de descrever um problema recorrente de organização.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Indústria</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Varejo</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Consumidor</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Contrapartida</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"214\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">TRADE</tspan></text></svg><div class=\"diagram-caption\">Trade organiza a relação entre indústria, varejo e consumidor final</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est4", "title": "4. Pricing", "html": "<h1>4. Pricing</h1>\n<h2>O dia a dia de Pricing</h2>\n<p>Pricing é a área que decide, ou pelo menos valida, o preço final de cada produto na prateleira. O trabalho gira em torno de planilhas de margem, comparação de preços com concorrentes e simulações do impacto de qualquer desconto antes de ele ser aprovado.</p>\n<p>É uma rotina bastante analítica: alguém em Pricing passa boa parte do dia olhando números, cruzando margem por categoria com o comportamento de vendas, e questionando pedidos de desconto que outras áreas trazem sem considerar o impacto na rentabilidade. Quando chega uma solicitação de preço promocional para uma campanha, Pricing normalmente já está lidando com dezenas de outras solicitações parecidas ao mesmo tempo.</p>\n<p>A área tende a ser mais discreta no dia a dia do CS do que Comercial ou Trade, mas seu trabalho aparece toda vez que uma campanha envolve algum tipo de condição especial de preço.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter analistas de pricing organizados por categoria, um gestor de pricing acompanhando as regras gerais, e em alguns varejos, uma conexão direta com Business Intelligence para acompanhar o efeito de cada mudança de preço nas vendas.</p>\n<h2>Conexão com o Trade</h2>\n<p>Toda vez que uma campanha de Trade envolve desconto, combo, lançamento com preço especial ou qualquer oferta regional, ela depende de uma validação de Pricing. A área não participa da negociação com a indústria, mas garante que a condição negociada realmente possa ser praticada sem distorcer a estratégia de preço do varejo.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Solicitação</tspan><tspan x=\"60\" dy=\"13\">de preço</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Análise de</tspan><tspan x=\"193\" dy=\"13\">margem</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Aprovação</tspan><tspan x=\"327\" dy=\"13\">ou ajuste</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Preço</tspan><tspan x=\"460\" dy=\"13\">validado</tspan></text></svg><div class=\"diagram-caption\">Toda condição de preço passa por uma análise antes de ser aprovada</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est5", "title": "5. Marketing", "html": "<h1>5. Marketing</h1>\n<h2>O dia a dia de Marketing</h2>\n<p>Marketing cuida de como o varejo se comunica com o consumidor final e de como a marca aparece em cada ponto de contato, da loja física ao aplicativo. O dia a dia envolve produção de peças, aprovação de campanhas institucionais, gestão de agências externas e acompanhamento de redes sociais.</p>\n<p>É uma área que trabalha com prazos de produção que nem sempre encaixam perfeitamente com o calendário comercial: uma peça de encarte ou um banner de aplicativo leva tempo para ficar pronto, e Marketing frequentemente precisa administrar pedidos que chegam em cima da hora, vindos de Trade ou do Comercial, para campanhas que já foram negociadas com a indústria.</p>\n<p>Marketing também zela pela identidade visual da marca, então parte do trabalho é dizer não, ou pedir ajustes, quando uma peça sugerida por outra área foge do padrão visual esperado.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Normalmente tem um time de conteúdo e design, um responsável por mídia paga e redes sociais, e em operações maiores, um gestor de relacionamento com agências terceirizadas que produzem parte do material.</p>\n<h2>Conexão com o Trade</h2>\n<p>Boa parte das entregas que Trade promete à indústria, como um banner, um encarte ou uma postagem, depende diretamente de Marketing para sair do papel. Um briefing malfeito ou um prazo apertado costuma ser a principal fonte de atrito entre as duas áreas, então vale ao CS entender que um atraso aqui quase nunca é falta de vontade, é fila de produção.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Briefing</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Produção</tspan><tspan x=\"193\" dy=\"13\">da peça</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Aprovação</tspan><tspan x=\"327\" dy=\"13\">visual</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Publicação</tspan></text></svg><div class=\"diagram-caption\">Uma peça de campanha percorre um fluxo de produção antes de ir ao ar</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est6", "title": "6. Tecnologia da Informação", "html": "<h1>6. Tecnologia da Informação</h1>\n<h2>O dia a dia de Tecnologia da Informação</h2>\n<p>Tecnologia da Informação cuida dos sistemas, acessos, integrações e da segurança da informação de toda a operação do varejo. No dia a dia, isso significa lidar com chamados de suporte, projetos de integração entre sistemas diferentes e uma agenda de prioridades que quase sempre é maior do que a capacidade do time.</p>\n<p>É uma área acostumada a lidar com pedidos de todas as outras, cada uma achando que sua demanda é a mais urgente. Times de TI em redes varejistas normalmente equilibram manutenção de sistemas legados, projetos novos e questões de segurança, o que explica por que uma integração simples, do ponto de vista de quem pede, pode levar semanas para ser priorizada internamente.</p>\n<p>Em clientes Enterprise, é comum que TI tenha um processo formal de homologação para qualquer sistema novo, incluindo plataformas fornecidas por terceiros.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter uma equipe de infraestrutura, uma de desenvolvimento ou integrações, e um responsável por segurança da informação e governança de acessos, às vezes separado em uma função própria de compliance técnico.</p>\n<h2>Conexão com o Trade</h2>\n<p>Trade depende de TI sempre que uma ação exige integração de dados, criação de acessos ou homologação de segurança. É normal que o relacionamento com essa área seja mais intenso logo no início da parceria, enquanto integrações ainda estão em ajuste, e depois se torne pontual, quando surge alguma demanda técnica específica.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Chamado</tspan><tspan x=\"60\" dy=\"13\">aberto</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Fila de</tspan><tspan x=\"193\" dy=\"13\">prioridade</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Homologação</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Entrega</tspan><tspan x=\"460\" dy=\"13\">técnica</tspan></text></svg><div class=\"diagram-caption\">Todo pedido técnico disputa espaço numa fila de prioridades maior que a de Trade</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est7", "title": "7. Supply Chain, Abastecimento e Logística", "html": "<h1>7. Supply Chain, Abastecimento e Logística</h1>\n<h2>O dia a dia de Supply Chain, Abastecimento e Logística</h2>\n<p>Supply Chain garante que o produto certo esteja disponível na loja certa, na hora certa. O trabalho envolve planejamento de demanda, gestão de centros de distribuição e uma negociação constante entre o que o Comercial vendeu, o que a indústria consegue entregar e o que as lojas conseguem receber e armazenar.</p>\n<p>É uma área extremamente orientada a número e prazo: ruptura de estoque, giro de produto e nível de serviço são indicadores acompanhados de perto, quase sempre em reuniões diárias ou semanais. Uma decisão comercial ou uma campanha grande pode gerar um efeito em cadeia sobre o abastecimento que só Supply consegue enxergar com clareza.</p>\n<p>Por lidar com centros de distribuição, transportadoras e fornecedores ao mesmo tempo, a área tende a ser cautelosa com qualquer compromisso assumido antes de confirmar disponibilidade real.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Normalmente inclui planejamento de demanda, gestão de centros de distribuição, e uma equipe de relacionamento logístico com fornecedores e transportadoras.</p>\n<h2>Conexão com o Trade</h2>\n<p>Uma campanha de Trade pode depender de Supply sempre que envolve garantir presença de produto nas lojas participantes. A área não assume compromisso de disponibilidade sem antes analisar internamente, então o CS deve esperar essa validação como uma etapa normal, não como uma resistência da área.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Previsão</tspan><tspan x=\"60\" dy=\"13\">de demanda</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Estoque no</tspan><tspan x=\"193\" dy=\"13\">centro</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Distribuição</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Produto</tspan><tspan x=\"460\" dy=\"13\">na loja</tspan></text></svg><div class=\"diagram-caption\">O caminho do produto até a prateleira, antes de qualquer campanha acontecer</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est8", "title": "8. Operações de Loja", "html": "<h1>8. Operações de Loja</h1>\n<h2>O dia a dia de Operações de Loja</h2>\n<p>Operações garante que a loja funcione: que a equipe esteja treinada, que os processos definidos pela matriz sejam seguidos e que qualquer orientação enviada de fora realmente chegue até quem trabalha no chão da loja. O dia a dia é feito de visitas, relatórios de execução e correção constante de pequenos problemas que aparecem na ponta.</p>\n<p>É uma área que sente na pele qualquer decisão tomada em outro lugar: uma campanha mal explicada vira confusão na loja, um material que chega atrasado vira ponto de venda vazio, uma meta de execução que ninguém explicou direito vira reclamação de cliente. Supervisores e gerentes regionais passam boa parte do tempo entre lojas, cobrando padrão e resolvendo imprevistos que não estavam no plano.</p>\n<p>Por estar mais perto do consumidor final do que qualquer outra área, Operações costuma ser a primeira a perceber quando algo, na teoria bem desenhado, não funciona na prática.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter uma hierarquia regional: diretores de operações, gerentes regionais, supervisores de loja, gerentes de loja e encarregados, cada nível responsável por um recorte geográfico ou por um grupo de lojas.</p>\n<h2>Conexão com o Trade</h2>\n<p>Trade planeja a campanha, mas é Operações quem coloca em prática dentro da loja: define quais lojas participam, orienta a execução e reporta se aconteceu como combinado. Uma campanha só é bem-sucedida se Operações recebeu a orientação com clareza e teve tempo hábil para executar.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Orientação</tspan><tspan x=\"60\" dy=\"13\">da matriz</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Execução</tspan><tspan x=\"193\" dy=\"13\">na loja</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Registro</tspan><tspan x=\"327\" dy=\"13\">e fotos</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Retorno</tspan><tspan x=\"460\" dy=\"13\">para Trade</tspan></text></svg><div class=\"diagram-caption\">O que é decidido lá em cima só vira resultado quando a loja executa bem</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est9", "title": "9. Visual Merchandising", "html": "<h1>9. Visual Merchandising</h1>\n<h2>O dia a dia de Visual Merchandising</h2>\n<p>Visual Merchandising cuida de como o produto é exposto dentro da loja: planograma, pontas de gôndola, vitrines e qualquer material de ponto de venda que ajude a chamar atenção do consumidor. O trabalho combina critério comercial, com o que vende mais em cada posição, e critério estético, com o que fica visualmente atraente e organizado.</p>\n<p>É uma área que trabalha lado a lado com Operações para garantir que o planograma definido na matriz realmente se pareça, na prática, com o que foi desenhado. Isso inclui viajar até lojas, tirar fotos de antes e depois, revisar padrões de exposição e lidar com o desafio permanente de manter um padrão em centenas de lojas diferentes, com espaços físicos que nem sempre são idênticos.</p>\n<p>Também é comum que a área participe da decisão sobre onde fica cada material de indústria dentro da loja, o que a coloca no meio de qualquer negociação sobre exposição extra ou ponta de gôndola.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Normalmente tem analistas responsáveis por planogramas, uma equipe de campo que visita lojas para conferir a execução, e em redes maiores, um time de design específico para materiais de ponto de venda.</p>\n<h2>Conexão com o Trade</h2>\n<p>Sempre que uma campanha de Trade envolve exposição diferenciada, ponta de gôndola ou material de ponto de venda, ela depende de Visual Merchandising para definir onde e como isso vai acontecer fisicamente na loja. É uma das conexões mais concretas entre o que foi negociado com a indústria e o que o consumidor efetivamente vê na prateleira.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O que é definido</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O que é conferido</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">planograma</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">posição na gôndola</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">material de PDV</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">execução real</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">padrão fotográfico</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">ajustes de campo</text></svg><div class=\"diagram-caption\">Entre o planograma ideal e o que realmente aparece na loja</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est10", "title": "10. Financeiro e Controladoria", "html": "<h1>10. Financeiro e Controladoria</h1>\n<h2>O dia a dia de Financeiro e Controladoria</h2>\n<p>Financeiro e Controladoria cuidam do controle econômico do varejo: contas a pagar, contas a receber, fluxo de caixa, conciliação e acompanhamento orçamentário. O dia a dia é feito de fechamento de números, conferência de valores e um cuidado constante em garantir que tudo o que foi negociado esteja documentado corretamente.</p>\n<p>É uma área que trabalha com prazos rígidos de fechamento contábil e que, por natureza, questiona qualquer valor que não esteja claramente registrado ou comprovado. Uma verba comercial negociada informalmente numa conversa, sem contrato ou nota correspondente, costuma travar exatamente aqui, quando alguém tenta emitir a cobrança ou reconhecer a receita.</p>\n<p>Financeiro raramente participa das negociações em si, mas é quem garante que o dinheiro combinado realmente entre ou saia da forma certa.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter contas a pagar, contas a receber, tesouraria e controladoria como frentes separadas, com um controller ou diretor financeiro acompanhando o resultado consolidado.</p>\n<h2>Conexão com o Trade</h2>\n<p>Ações de Trade quase sempre geram um desdobramento financeiro, seja uma verba comercial, um investimento em mídia ou uma cobrança de contrapartida. Mesmo em clientes onde o CS nunca fala diretamente com essa área, ela normalmente aparece em algum ponto do processo, quando é hora de emitir, cobrar ou conciliar um valor.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Verba</tspan><tspan x=\"60\" dy=\"13\">negociada</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Registro</tspan><tspan x=\"193\" dy=\"13\">contábil</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Cobrança</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Conciliação</tspan></text></svg><div class=\"diagram-caption\">Toda verba de Trade termina como um número que precisa fechar</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est11", "title": "11. Gestão de Categorias", "html": "<h1>11. Gestão de Categorias</h1>\n<h2>O dia a dia de Gestão de Categorias</h2>\n<p>Gestão de Categorias analisa a estratégia, o sortimento e o desempenho de cada categoria de produto dentro do varejo. O trabalho é fortemente analítico: acompanhar margem e giro por categoria, decidir quais produtos entram ou saem do sortimento, e apoiar decisões sobre quanto espaço cada categoria merece na loja.</p>\n<p>É uma área que enxerga o negócio por um recorte diferente do Comercial: em vez de focar na negociação com um fornecedor específico, ela olha para a categoria como um todo e pergunta se aquele conjunto de produtos está performando bem, comparado ao potencial da categoria e ao que o consumidor está buscando.</p>\n<p>Em muitos varejos essa função está dentro da própria área Comercial, sem uma estrutura separada, mas o raciocínio de categoria continua presente nas decisões.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Pode existir como uma função dedicada, com analistas de categoria, ou estar embutida dentro do próprio time Comercial, dependendo do tamanho e da maturidade do varejista.</p>\n<h2>Conexão com o Trade</h2>\n<p>Em clientes mais maduros, Trade costuma consultar Gestão de Categorias antes de validar uma ação: para saber se aquele produto ou indústria realmente merece prioridade, se o espaço pedido faz sentido dentro da estratégia da categoria, e se a ação apoia ou atrapalha um plano de crescimento já definido.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Dado de</tspan><tspan x=\"60\" dy=\"13\">desempenho</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Análise da</tspan><tspan x=\"193\" dy=\"13\">categoria</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Decisão de</tspan><tspan x=\"327\" dy=\"13\">sortimento</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Prioridade</tspan><tspan x=\"460\" dy=\"13\">para Trade</tspan></text></svg><div class=\"diagram-caption\">A categoria decide o que merece espaço e prioridade dentro do varejo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est12", "title": "12. E-commerce e Canais Digitais", "html": "<h1>12. E-commerce e Canais Digitais</h1>\n<h2>O dia a dia de E-commerce e Canais Digitais</h2>\n<p>E-commerce cuida das vendas e da experiência do consumidor nos canais digitais: site, aplicativo, marketplace e catálogo online. O dia a dia envolve gestão de catálogo digital, campanhas online, acompanhamento de conversão e uma preocupação constante com performance do site ou do aplicativo.</p>\n<p>É uma área que trabalha com métricas muito mais imediatas do que o varejo físico: taxa de conversão, abandono de carrinho, tempo de carregamento de página, tudo medido quase em tempo real. Times de e-commerce costumam ter uma cultura mais próxima de produto digital do que o restante do varejo, com testes constantes de layout, banner e posicionamento.</p>\n<p>Com o crescimento das vendas online, essa área tem ganhado peso dentro da estrutura geral do varejo, deixando de ser apenas um canal a mais e passando a competir por atenção e investimento junto com a loja física.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter um time de conteúdo e catálogo, um time de performance e mídia digital, e em operações maiores, um time de produto cuidando da experiência dentro do site ou aplicativo.</p>\n<h2>Conexão com o Trade</h2>\n<p>Trade pode negociar entregas digitais com a indústria, como banners, vitrines digitais, cupons ou posições de destaque no aplicativo. Nesses casos, E-commerce entra para validar o espaço, confirmar o período e, depois, informar como a ação performou nos canais digitais.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Catálogo</tspan><tspan x=\"60\" dy=\"13\">digital</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Campanha</tspan><tspan x=\"193\" dy=\"13\">online</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Conversão</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Resultado</tspan><tspan x=\"460\" dy=\"13\">medido</tspan></text></svg><div class=\"diagram-caption\">No digital, cada etapa da campanha é medida quase em tempo real</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est13", "title": "13. CRM e Fidelidade", "html": "<h1>13. CRM e Fidelidade</h1>\n<h2>O dia a dia de CRM e Fidelidade</h2>\n<p>CRM e Fidelidade trabalham com dados e relacionamento direto com o consumidor: programas de pontos, cupons personalizados, segmentações de público e campanhas direcionadas por comportamento de compra. O dia a dia é bastante orientado a dado: quem compra o quê, com que frequência, e como incentivar esse consumidor a voltar ou comprar mais.</p>\n<p>É uma área que enxerga o consumidor com um nível de detalhe que nenhuma outra tem, porque lida diretamente com o histórico de compras de cada cliente cadastrado no programa de fidelidade. Isso permite construir campanhas muito mais direcionadas do que uma comunicação genérica de massa.</p>\n<p>Também costuma ser a área que mede, com mais precisão, se uma ação promocional realmente trouxe o cliente de volta à loja, ou apenas antecipou uma compra que já ia acontecer.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter uma equipe de análise de dados e segmentação, e um time de ativação responsável por transformar essas segmentações em campanhas reais, seja por aplicativo, e-mail ou SMS.</p>\n<h2>Conexão com o Trade</h2>\n<p>Trade pode desenvolver com a indústria ações voltadas a públicos específicos, como cupons patrocinados ou campanhas de incentivo à recompra. CRM entra para definir o público certo, validar a comunicação e, depois, informar o resultado real da ativação.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Histórico de</tspan><tspan x=\"60\" dy=\"13\">compra</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Segmentação</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Ativação</tspan><tspan x=\"327\" dy=\"13\">direcionada</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Recompra</tspan></text></svg><div class=\"diagram-caption\">CRM transforma dado de compra em uma campanha para a pessoa certa</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est14", "title": "14. Atendimento ao Consumidor (SAC)", "html": "<h1>14. Atendimento ao Consumidor (SAC)</h1>\n<h2>O dia a dia de Atendimento ao Consumidor (SAC)</h2>\n<p>O SAC, ou atendimento ao consumidor, é quem recebe a reclamação, a dúvida ou o elogio do cliente final depois que a compra já aconteceu. O dia a dia é feito de atendimento por telefone, chat, redes sociais e, cada vez mais, por canais de reclamação pública, t
