udo sob metas de tempo de resposta e taxa de resolução.</p>\n<p>É uma área acostumada a lidar com o lado mais imediato da insatisfação: um produto que não chegou, uma promoção que não foi respeitada no caixa, uma dúvida sobre como resgatar um cupom. Quando uma campanha tem alguma falha de comunicação ou de execução, é o SAC quem sente o volume de reclamações primeiro, geralmente antes de qualquer outra área perceber o problema.</p>\n<p>Por lidar diretamente com a percepção do consumidor, a área costuma ser uma fonte valiosa de sinal precoce sobre problemas que ainda não apareceram nos números oficiais de uma campanha.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Costuma ter atendentes organizados por canal (telefone, chat, redes sociais), supervisores de atendimento e, em redes maiores, uma equipe dedicada a reclamações públicas em sites como o Reclame Aqui.</p>\n<h2>Conexão com o Trade</h2>\n<p>Quando uma campanha de Trade gera confusão no consumidor, como uma promoção mal explicada ou um cupom que não funciona, é o SAC que recebe o impacto direto. Vale ao CS saber que essa área existe e que, em clientes mais maduros, pode ser consultada para entender se uma campanha realmente gerou problemas na ponta.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Reclamação</tspan><tspan x=\"60\" dy=\"13\">do cliente</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Atendimento</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Resolução</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Sinal para</tspan><tspan x=\"460\" dy=\"13\">outras áreas</tspan></text></svg><div class=\"diagram-caption\">O SAC costuma ser o primeiro a sentir quando uma campanha deu errado</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est15", "title": "15. Jurídico e Compliance", "html": "<h1>15. Jurídico e Compliance</h1>\n<h2>O dia a dia de Jurídico e Compliance</h2>\n<p>Jurídico e Compliance cuidam dos contratos, das obrigações legais e da conformidade das negociações do varejo, incluindo os acordos comerciais firmados com a indústria. O dia a dia envolve revisão de contratos, validação de cláusulas e, cada vez mais, atenção a temas como proteção de dados e regras de concorrência.</p>\n<p>É uma área que trabalha em um ritmo diferente do resto do varejo: enquanto Comercial e Trade querem fechar uma negociação rapidamente, Jurídico precisa garantir que aquilo esteja documentado de um jeito que proteja a empresa caso algo dê errado mais adiante. Esse descompasso de ritmo é uma fonte comum de atrito, especialmente quando uma campanha precisa ser aprovada com urgência.</p>\n<p>Também é a área acionada quando surge qualquer dúvida sobre uso de imagem, direito de marca ou cláusula contratual de uma parceria com a indústria.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Pode ser uma equipe jurídica interna, apoiada por escritórios externos para temas específicos, com uma função de compliance cuidando separadamente de conformidade regulatória e proteção de dados.</p>\n<h2>Conexão com o Trade</h2>\n<p>Grandes negociações de Trade, especialmente as que envolvem verbas relevantes ou parcerias de longo prazo com uma indústria, costumam passar por uma validação jurídica antes de serem fechadas. É uma conexão menos frequente no dia a dia, mas importante em qualquer contrato mais robusto.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C41E68\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Ritmo do negócio</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Ritmo do Jurídico</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">fechar rápido</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">aproveitar a janela</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">avançar com a indústria</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">revisar cláusulas</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">proteger a empresa</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">documentar riscos</text></svg><div class=\"diagram-caption\">Dois ritmos diferentes que precisam encontrar um meio-termo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est16", "title": "16. Diretoria e Liderança Executiva", "html": "<h1>16. Diretoria e Liderança Executiva</h1>\n<h2>O dia a dia de Diretoria e Liderança Executiva</h2>\n<p>A liderança executiva define prioridades, aprova investimentos e estabelece os objetivos estratégicos do varejo. O dia a dia é feito de reuniões de resultado, decisões sobre onde investir e uma visão de mais longo prazo do que a maioria das áreas operacionais consegue ter no meio da rotina.</p>\n<p>É um nível de decisão que pensa em termos de receita total, participação de mercado e relacionamento estratégico com as principais indústrias, não em detalhes operacionais de uma campanha específica. Uma decisão da Diretoria pode mudar de uma vez a prioridade de um projeto inteiro, inclusive a forma como o varejo usa qualquer sistema ou plataforma.</p>\n<p>Por estar mais distante do dia a dia operacional, a Diretoria costuma enxergar problemas apenas quando eles já ganharam escala, ou quando alguém leva o tema explicitamente até ela.</p>\n<h2>Como a área costuma se organizar</h2>\n<p>Normalmente inclui diretores por área (comercial, operações, financeiro, marketing) reportando a um presidente ou CEO, com reuniões periódicas de resultado reunindo toda a liderança.</p>\n<h2>Conexão com o Trade</h2>\n<p>O CS normalmente não conversa com a Diretoria toda semana, mas precisa saber que decisões importantes para a conta, como prioridade de projetos, estrutura do time ou nível de investimento em tecnologia, passam por esse nível. Quando um risco relevante aparece, é a liderança que precisa ser envolvida para desbloqueá-lo.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Prioridade</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Investimento</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Estrutura</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Indicadores</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"214\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">DIRETORIA</tspan></text></svg><div class=\"diagram-caption\">Decisões que raramente aparecem no dia a dia, mas mudam tudo quando acontecem</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est17", "title": "17. Como um trade acontece na prática", "html": "<h1>17. Como um trade acontece na prática</h1>\n<p>Para fechar o quadro, vale acompanhar como uma campanha real costuma atravessar essas áreas, do primeiro contato com a indústria até a loja.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 720 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"50\" x2=\"665\" y2=\"50\" stroke=\"#D9D4EC\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"50\" r=\"9\" fill=\"#2B2361\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"55\" y=\"79\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"55\" dy=\"0\">Comercial</tspan><tspan x=\"55\" dy=\"13\">negocia</tspan></text><polygon points=\"111,46 121,50 111,54\" fill=\"#C41E68\"/><circle cx=\"177\" cy=\"50\" r=\"9\" fill=\"#2B2361\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"177\" y=\"79\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"177\" dy=\"0\">Trade</tspan><tspan x=\"177\" dy=\"13\">estrutura</tspan></text><polygon points=\"233,46 243,50 233,54\" fill=\"#C41E68\"/><circle cx=\"299\" cy=\"50\" r=\"9\" fill=\"#2B2361\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"299\" y=\"73\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"299\" dy=\"0\">Pricing/</tspan><tspan x=\"299\" dy=\"13\">Marketing</tspan><tspan x=\"299\" dy=\"13\">validam</tspan></text><polygon points=\"355,46 365,50 355,54\" fill=\"#C41E68\"/><circle cx=\"421\" cy=\"50\" r=\"9\" fill=\"#2B2361\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"421\" y=\"79\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"421\" dy=\"0\">Supply</tspan><tspan x=\"421\" dy=\"13\">confirma</tspan></text><polygon points=\"477,46 487,50 477,54\" fill=\"#C41E68\"/><circle cx=\"543\" cy=\"50\" r=\"9\" fill=\"#2B2361\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"543\" y=\"79\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"543\" dy=\"0\">Operações</tspan><tspan x=\"543\" dy=\"13\">executa</tspan></text><polygon points=\"599,46 609,50 599,54\" fill=\"#C41E68\"/><circle cx=\"665\" cy=\"50\" r=\"9\" fill=\"#2B2361\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"665\" y=\"79\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"665\" dy=\"0\">Financeiro</tspan><tspan x=\"665\" dy=\"13\">concilia</tspan></text></svg><div class=\"diagram-caption\">O caminho de uma campanha real, do primeiro contato com a indústria até a conciliação financeira</div></div>\n<p>Tudo começa, normalmente, numa negociação comercial: Comercial fecha com a indústria uma condição especial, um volume maior de compra, ou a participação em uma campanha sazonal. A partir daí, Trade Marketing organiza o que foi negociado em um plano concreto: define o período, as lojas participantes, as contrapartidas esperadas e quem precisa estar envolvido.</p>\n<p>Se a campanha envolve algum tipo de desconto ou condição especial de preço, Pricing entra para validar se aquilo é viável dentro das regras de precificação do varejo. Se envolve alguma peça de comunicação, banner ou material de ponto de venda, Marketing e Visual Merchandising entram para produzir e definir onde aquilo vai aparecer fisicamente na loja. Se a campanha depende de disponibilidade de produto, Supply é consultado para confirmar que não existe risco de ruptura nas lojas participantes.</p>\n<p>Depois que tudo está definido, Operações recebe a orientação final e coloca a campanha em prática dentro da loja, acompanhando se a execução aconteceu como combinado. Se a campanha gera algum tipo de cobrança ou repasse financeiro, Financeiro entra para conciliar os valores. Ao final, Trade consolida os resultados, reúne as evidências de execução e apresenta o desempenho da campanha de volta para a indústria.</p>\n<p>Em paralelo, se algo sai errado, como uma promoção mal comunicada ou um produto em falta, é comum que o SAC seja o primeiro a perceber, através do volume de reclamações do consumidor final.</p>\n<p>Nenhuma dessas etapas depende de um sistema específico para acontecer: elas acontecem porque existe um processo de negócio real por trás, com pessoas, prazos e decisões. Entender essa sequência é o que permite ao CS enxergar, mais adiante, onde exatamente uma plataforma pode ajudar a organizar esse fluxo sem se colocar no lugar de nenhuma dessas áreas.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 660 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><text x=\"330\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#2B2361\">O que pode travar o fluxo</text><rect x=\"30\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#C0264F\"/><text x=\"125\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Falta de\ninformação</text><text x=\"125\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">cada área isolada</text><rect x=\"235\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#F2C230\"/><text x=\"330\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Prazo\napertado</text><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">sem tempo de reação</text><rect x=\"440\" y=\"40\" width=\"190\" height=\"86\" rx=\"12\" fill=\"#1E8E5A\"/><text x=\"535\" y=\"80\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Processo\nclaro</text><text x=\"535\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#fff\" opacity=\"0.9\">todos sabem seu papel</text></svg><div class=\"diagram-caption\">O que separa um trade que flui de um trade que trava</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est18", "title": "18. Papel do CS na conexão entre as áreas", "html": "<h1>18. Papel do CS na conexão entre as áreas</h1>\n<p>O papel do CS é compreender a operação do cliente e conduzir a conversa com segurança, sabendo quem é responsável por cada etapa e o que pertence, ou não, à própria plataforma.</p>\n<div class=\"diagram-box\"><svg viewBox=\"0 0 700 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\">\n  <rect x=\"30\" y=\"15\" width=\"300\" height=\"140\" rx=\"14\" fill=\"#1E8E5A\"/>\n  <rect x=\"370\" y=\"15\" width=\"300\" height=\"140\" rx=\"14\" fill=\"#C0264F\"/>\n  <text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O CS é responsável</text>\n  <text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O CS não é responsável</text>\n  <text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#DFF3E8\">organizar, acompanhar,</text>\n  <text x=\"180\" y=\"86\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#DFF3E8\">registrar, direcionar</text>\n  <text x=\"180\" y=\"112\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#DFF3E8\">garantir dono, prazo</text>\n  <text x=\"180\" y=\"128\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#DFF3E8\">e retorno ao cliente</text>\n  <text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FBD9E1\">operar pelo cliente,</text>\n  <text x=\"520\" y=\"86\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FBD9E1\">aprovar preço, estoque</text>\n  <text x=\"520\" y=\"112\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FBD9E1\">decidir por áreas que</text>\n  <text x=\"520\" y=\"128\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FBD9E1\">não são dele</text>\n</svg><div class=\"diagram-caption\">Onde termina o papel do CS e onde começa o papel de cada área do cliente</div></div>\n<p>O CS deve:</p>\n<ul>\n<li>mapear as áreas envolvidas na operação do cliente;</li>\n<li>identificar os responsáveis por cada tipo de decisão;</li>\n<li>compreender as dependências entre uma área e outra;</li>\n<li>acompanhar a adoção real dos processos;</li>\n<li>identificar gargalos antes que virem risco;</li>\n<li>registrar riscos com evidência;</li>\n<li>garantir clareza sobre quem responde por cada assunto;</li>\n<li>acompanhar pendências até a conclusão;</li>\n<li>documentar decisões importantes;</li>\n<li>orientar o cliente sobre como organizar melhor seus próprios processos;</li>\n<li>envolver o time interno da Meu Cliente quando necessário.</li>\n</ul>\n<p>Conhecer bem essas áreas é o que evita que o CS confunda um problema de processo interno do cliente com um problema da plataforma, ou vice-versa.</p>\n<p>O CS não deve:</p>\n<ul>\n<li>assumir atividades que pertencem ao cliente;</li>\n<li>aprovar preços;</li>\n<li>garantir estoque;</li>\n<li>executar processos financeiros do cliente;</li>\n<li>produzir materiais de Marketing;</li>\n<li>administrar sistemas internos do varejo;</li>\n<li>tomar decisões comerciais em nome do cliente;</li>\n<li>prometer integrações sem validação técnica;</li>\n<li>responder por áreas que não estão sob sua responsabilidade.</li>\n</ul>\n<p>Esses limites existem porque o valor do CS está em organizar e dar visibilidade à operação do cliente, não em substituir as pessoas que efetivamente tomam essas decisões todos os dias.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><circle cx=\"300\" cy=\"290\" r=\"210\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"300\" y1=\"290\" x2=\"300\" y2=\"80\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"241\" y=\"61\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"300\" y=\"84\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"300\" dy=\"0\">Comercial</tspan></text><line x1=\"300\" y1=\"290\" x2=\"500\" y2=\"225\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"441\" y=\"206\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"500\" y=\"229\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"500\" dy=\"0\">Trade</tspan></text><line x1=\"300\" y1=\"290\" x2=\"423\" y2=\"460\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"364\" y=\"441\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"423\" y=\"464\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"423\" dy=\"0\">Operações</tspan></text><line x1=\"300\" y1=\"290\" x2=\"177\" y2=\"460\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"118\" y=\"441\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"177\" y=\"464\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"177\" dy=\"0\">Financeiro</tspan></text><line x1=\"300\" y1=\"290\" x2=\"100\" y2=\"225\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"41\" y=\"206\" width=\"118\" height=\"38\" rx=\"10\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"100\" y=\"229\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"100\" dy=\"0\">Tecnologia</tspan></text><circle cx=\"300\" cy=\"290\" r=\"62\" fill=\"#2B2361\"/><text x=\"300\" y=\"286\" text-anchor=\"middle\" fill=\"#F2C230\" font-size=\"15\" font-weight=\"800\">CS</text><text x=\"300\" y=\"306\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\">conecta e organiza</text></svg><div class=\"diagram-caption\">O CS não substitui nenhuma área, mas transita por todas elas</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est19", "title": "19. Perguntas para mapear a estrutura do cliente", "html": "<h1>19. Perguntas para mapear a estrutura do cliente</h1>\n<p>Durante a implantação ou o acompanhamento, o CS deve buscar respostas para perguntas como as abaixo. Elas ajudam a entender rapidamente como aquele cliente específico organiza sua operação de Trade, em vez de assumir que todos os varejistas funcionam da mesma forma.</p>\n<ul>\n<li>Como Trade está organizado dentro dessa empresa?</li>\n<li>Quais áreas participam normalmente dos processos de campanha?</li>\n<li>Quem inicia cada tipo de negociação ou solicitação?</li>\n<li>Quem deve aprovar cada etapa de uma campanha?</li>\n<li>Quem é responsável pelas negociações com a indústria?</li>\n<li>Quem valida preços e condições promocionais?</li>\n<li>Quem participa das entregas de Marketing e Visual Merchandising?</li>\n<li>Quem responde pelas integrações e questões técnicas?</li>\n<li>Quem precisa fornecer dados para o acompanhamento das campanhas?</li>\n<li>Quem deve ser acionado em caso de restrição operacional ou de estoque?</li>\n<li>Quem acompanha a execução dentro das lojas?</li>\n<li>Quem controla os processos financeiros relacionados a Trade?</li>\n<li>Quais informações precisam retornar para Trade ao final de cada ação?</li>\n<li>Qual é a fonte oficial de acompanhamento dessas informações hoje?</li>\n</ul>\n<p>Nenhum cliente vai responder todas essas perguntas de uma vez, numa única reunião. A ideia é ir completando esse mapa ao longo da implantação e dos primeiros meses de acompanhamento, revisando sempre que uma pessoa nova entra na conta ou um processo muda.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Antes de avançar, confirme</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Como Trade está organizado</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Quem aprova cada etapa</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Quem participa dos processos</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Qual é a fonte oficial de acompanhamento</text></svg><div class=\"diagram-caption\">Um mapa mínimo antes de prometer qualquer prazo ao cliente</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "est20", "title": "20. Princípio final", "html": "<h1>20. Princípio final</h1>\n<p>Cada uma das áreas descritas neste bloco tem sua própria rotina, suas próprias pressões e sua própria forma de medir sucesso, quase sempre bem distante de qualquer conversa sobre tecnologia ou plataforma.</p>\n<p>Entender essa realidade é o que separa um CS que apenas conhece a ferramenta de um CS que realmente entende o negócio do cliente. Quando o CS sabe, por exemplo, que Pricing está sob pressão de margem, ou que Supply nunca vai confirmar disponibilidade sem checar internamente, ou que Operações só vai executar bem uma campanha que foi explicada com clareza, ele consegue conduzir conversas muito mais realistas sobre prazos, expectativas e limitações.</p>\n<p>A partir daqui, o próximo bloco entra na plataforma Meu Cliente em si: como ela organiza a comunicação entre essas áreas, sem nunca assumir o lugar de nenhuma delas.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Pessoas</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Prazos</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Pressões</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Rotina</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">VAREJO</tspan><tspan x=\"240\" dy=\"15\">REAL</tspan></text></svg><div class=\"diagram-caption\">Por trás de toda área, existem pessoas, prazos e pressões reais</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 20}, {"id": "trade", "num": 2, "title": "Trade Marketing no Varejo", "subtitle": "Campanhas, contrapartidas, calendário e JBP", "lessons": [{"id": "l19", "title": "3.1 O que é Trade Marketing", "html": "<h2 id=\"o-que-é-trade-marketing\"><strong>3.1. O que é Trade\nMarketing</strong></h2>\n<p>Trade Marketing é a área responsável por transformar a relação\ncomercial entre varejo e indústria em planos, campanhas e entregas\nexecutáveis.</p>\n<p>Na prática, Trade fica no centro de diferentes interesses:</p>\n<ul>\n<li><p>o varejo busca receita, rentabilidade e melhores condições\ncomerciais;</p></li>\n<li><p>a indústria busca espaço, visibilidade, execução e crescimento de\nvendas;</p></li>\n<li><p>o consumidor precisa encontrar uma ação clara, atrativa e bem\nexecutada no ponto de venda ou nos canais digitais.</p></li>\n</ul>\n<p>A função de Trade é organizar essa relação para que o que foi\nnegociado saia do campo da intenção e se transforme em uma entrega\nacompanhável.</p>\n<p>Trade não trabalha sozinho. A área depende frequentemente da\nparticipação de Comercial, Marketing, Pricing, Operações, Financeiro,\nTecnologia, BI, Supply e outras estruturas do cliente.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Indústria</tspan></text><line x1=\"240\" y1=\"210\" x2=\"370\" y2=\"285\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"316\" y=\"268\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"370\" y=\"289\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"370\" dy=\"0\">Varejo</tspan></text><line x1=\"240\" y1=\"210\" x2=\"110\" y2=\"285\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"56\" y=\"268\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"110\" y=\"289\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"110\" dy=\"0\">Consumidor</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"214\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">TRADE</tspan></text></svg><div class=\"diagram-caption\">Trade organiza a relação entre quem vende, quem distribui e quem compra</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l20", "title": "3.2 O papel de Trade dentro do varejo", "html": "<h2 id=\"o-papel-de-trade-dentro-do-varejo\"><strong>3.2. O papel de Trade\ndentro do varejo</strong></h2>\n<p>A área de Trade pode ter diferentes níveis de maturidade.</p>\n<p>Em alguns varejistas, Trade ainda atua de forma muito operacional,\nconcentrando informações em planilhas, mensagens e controles\nparalelos.</p>\n<p>Em estruturas mais maduras, Trade possui:</p>\n<ul>\n<li><p>calendário organizado;</p></li>\n<li><p>processos definidos;</p></li>\n<li><p>responsáveis claros;</p></li>\n<li><p>governança das ações;</p></li>\n<li><p>histórico das negociações;</p></li>\n<li><p>acompanhamento das contrapartidas;</p></li>\n<li><p>gestão de verbas;</p></li>\n<li><p>indicadores;</p></li>\n<li><p>relacionamento estruturado com as indústrias;</p></li>\n<li><p>participação de outras áreas em fluxos definidos.</p></li>\n</ul>\n<p>O tamanho da rede não determina sozinho a maturidade da área. Existem\ngrandes varejistas com processos pouco estruturados e redes menores com\numa gestão de Trade organizada.</p>\n<p>Por isso, o CS deve evitar partir de pressupostos. Antes de orientar\no uso da plataforma, é necessário entender como o processo funciona\nnaquele cliente.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Trade operacional</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Trade maduro</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">planilha solta</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">controle paralelo</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">decisão informal</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">calendário definido</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">histórico registrado</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">indicadores claros</text></svg><div class=\"diagram-caption\">O tamanho da rede não define a maturidade da operação de Trade</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l21", "title": "3.3 Relação entre varejo e indústria", "html": "<h2 id=\"relação-entre-varejo-e-indústria\"><strong>3.3. Relação entre\nvarejo e indústria</strong></h2>\n<p>O varejo possui acesso ao consumidor, às lojas, aos canais de\ncomunicação e aos dados da operação.</p>\n<p>A indústria possui produtos, marcas, recursos de marketing e\ninteresse em aumentar sua presença e participação dentro do varejo.</p>\n<p>A relação entre os dois pode gerar diferentes tipos de\niniciativas:</p>\n<ul>\n<li><p>campanhas promocionais;</p></li>\n<li><p>lançamentos;</p></li>\n<li><p>exposição diferenciada;</p></li>\n<li><p>presença em pontos extras;</p></li>\n<li><p>participação em encartes;</p></li>\n<li><p>campanhas digitais;</p></li>\n<li><p>ações em aplicativos;</p></li>\n<li><p>comunicação em lojas;</p></li>\n<li><p>ativações;</p></li>\n<li><p>treinamentos;</p></li>\n<li><p>eventos;</p></li>\n<li><p>projetos de categoria;</p></li>\n<li><p>planos conjuntos de crescimento;</p></li>\n<li><p>investimentos em mídia;</p></li>\n<li><p>iniciativas de relacionamento com consumidores.</p></li>\n</ul>\n<p>Trade ajuda a organizar o que será entregue, por quem, em qual prazo\ne de que forma o resultado será apresentado.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C41E68\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O varejo busca</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">A indústria busca</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">receita</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">rentabilidade</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">condição comercial</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">espaço</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">visibilidade</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">crescimento de vendas</text></svg><div class=\"diagram-caption\">Dois interesses diferentes que Trade precisa equilibrar</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l22", "title": "3.4 O que é uma contrapartida", "html": "<h2 id=\"o-que-é-uma-contrapartida\"><strong>3.4. O que é uma\ncontrapartida</strong></h2>\n<p>Contrapartida é uma entrega acordada entre o varejo e a\nindústria.</p>\n<p>Exemplos:</p>\n<ul>\n<li><p>espaço promocional;</p></li>\n<li><p>presença em encarte;</p></li>\n<li><p>banner no site;</p></li>\n<li><p>ação no aplicativo;</p></li>\n<li><p>exposição em loja;</p></li>\n<li><p>participação em campanha;</p></li>\n<li><p>envio de comunicação para consumidores;</p></li>\n<li><p>ativação em determinado grupo de lojas;</p></li>\n<li><p>divulgação de lançamento;</p></li>\n<li><p>reunião de apresentação;</p></li>\n<li><p>entrega de relatório;</p></li>\n<li><p>comprovação da execução.</p></li>\n</ul>\n<p>Uma campanha pode possuir uma única contrapartida ou várias entregas\ndiferentes.</p>\n<p>Registrar o que foi negociado não resolve sozinho. O desafio de Trade\né garantir que cada entrega tenha:</p>\n<ul>\n<li><p>responsável;</p></li>\n<li><p>prazo;</p></li>\n<li><p>regra;</p></li>\n<li><p>loja ou canal participante;</p></li>\n<li><p>forma de comprovação;</p></li>\n<li><p>status;</p></li>\n<li><p>histórico.</p></li>\n</ul>\n<p>Quando essas informações não estão organizadas, aumentam os riscos de\natraso, divergência e cobrança por entregas que não foram realizadas ou\ncomprovadas.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Negociação</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Contrapartida</tspan><tspan x=\"193\" dy=\"13\">definida</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Execução</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Comprovação</tspan></text></svg><div class=\"diagram-caption\">Uma contrapartida só se conclui quando existe prova da execução</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l23", "title": "3.5 Calendário de Trade", "html": "<h2 id=\"calendário-de-trade\"><strong>3.5. Calendário de\nTrade</strong></h2>\n<p>O calendário de Trade organiza as principais campanhas, datas\ncomerciais e oportunidades de negociação ao longo do ano.</p>\n<p>Podem fazer parte do calendário:</p>\n<ul>\n<li><p>aniversário da rede;</p></li>\n<li><p>Páscoa;</p></li>\n<li><p>Dia das Mães;</p></li>\n<li><p>festas juninas;</p></li>\n<li><p>Dia dos Pais;</p></li>\n<li><p>Black Friday;</p></li>\n<li><p>Natal;</p></li>\n<li><p>campanhas de verão;</p></li>\n<li><p>campanhas regionais;</p></li>\n<li><p>ações próprias do varejista;</p></li>\n<li><p>lançamentos de categorias;</p></li>\n<li><p>projetos especiais;</p></li>\n<li><p>eventos com fornecedores;</p></li>\n<li><p>rodadas de negócios.</p></li>\n</ul>\n<p>Um calendário bem estruturado ajuda Trade a:</p>\n<ul>\n<li><p>antecipar negociações;</p></li>\n<li><p>organizar prazos;</p></li>\n<li><p>reduzir campanhas de última hora;</p></li>\n<li><p>evitar conflitos de datas;</p></li>\n<li><p>apresentar oportunidades para as indústrias;</p></li>\n<li><p>envolver as áreas internas com antecedência;</p></li>\n<li><p>acompanhar o que foi vendido e o que foi entregue.</p></li>\n</ul>\n<p>A existência de um calendário não significa que a operação está\norganizada. É necessário que cada campanha tenha informações suficientes\npara ser executada.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 720 100\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\"><line x1=\"55\" y1=\"45\" x2=\"665\" y2=\"45\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"55\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"55\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Páscoa</text><circle cx=\"177\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"177\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"177\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Junina</text><circle cx=\"299\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"299\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"299\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Dia dos Pais</text><circle cx=\"421\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"421\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"421\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Black\nFriday</text><circle cx=\"543\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"543\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"543\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Natal</text><circle cx=\"665\" cy=\"45\" r=\"15\" fill=\"#2B2361\"/><text x=\"665\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">6</text><text x=\"665\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\">Verão</text></svg><div class=\"diagram-caption\">Datas comerciais que se repetem todo ano e merecem planejamento antecipado</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l24", "title": "3.6 Campanhas e ações", "html": "<h2 id=\"campanhas-e-ações\"><strong>3.6. Campanhas e ações</strong></h2>\n<p>Uma campanha é um conjunto de atividades organizadas em torno de um\nobjetivo, período ou tema.</p>\n<p>Uma ação pode ser uma entrega específica dentro dessa campanha.</p>\n<p>Exemplo:</p>\n<h3 id=\"campanha\"><strong>Campanha</strong></h3>\n<p>Aniversário da rede.</p>\n<h3 id=\"possíveis-ações\"><strong>Possíveis ações</strong></h3>\n<p>Dentro dessa campanha, as ações podem incluir:</p><ul>\n<li><p>presença no encarte;</p></li>\n<li><p>exposição em ponta de gôndola;</p></li>\n<li><p>banner no aplicativo;</p></li>\n<li><p>comunicação em redes sociais;</p></li>\n<li><p>ativação nas lojas;</p></li>\n<li><p>participação em evento;</p></li>\n<li><p>entrega de relatório após a campanha.</p></li>\n</ul>\n<p>Para uma campanha ser bem estruturada, Trade precisa definir:</p>\n<ul>\n<li><p>objetivo;</p></li>\n<li><p>indústria participante;</p></li>\n<li><p>produtos ou categorias envolvidos;</p></li>\n<li><p>período;</p></li>\n<li><p>lojas ou canais;</p></li>\n<li><p>entregas acordadas;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>áreas participantes;</p></li>\n<li><p>forma de comprovação;</p></li>\n<li><p>indicadores;</p></li>\n<li><p>pendências;</p></li>\n<li><p>próximos passos.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Encarte</tspan></text><line x1=\"240\" y1=\"210\" x2=\"390\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"336\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"390\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"390\" dy=\"0\">Gôndola</tspan></text><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"360\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"343\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">App</tspan></text><line x1=\"240\" y1=\"210\" x2=\"90\" y2=\"210\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"36\" y=\"193\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"90\" y=\"208\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"90\" dy=\"0\">Rede</tspan><tspan x=\"90\" dy=\"12\">social</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"214\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">CAMPANHA</tspan></text></svg><div class=\"diagram-caption\">Uma campanha se desdobra em várias ações diferentes ao mesmo tempo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l25", "title": "3.7 Verbas de Trade", "html": "<h2 id=\"verbas-de-trade\"><strong>3.7. Verbas de Trade</strong></h2>\n<p>Verba de Trade é o investimento realizado pela indústria em ações,\ncampanhas, mídia, espaços, projetos ou entregas dentro do varejo.</p>\n<p>A forma de negociação e o tratamento financeiro variam entre os\nclientes.</p>\n<p>Trade pode ser responsável por:</p>\n<ul>\n<li><p>organizar as oportunidades;</p></li>\n<li><p>registrar valores negociados;</p></li>\n<li><p>acompanhar as entregas relacionadas;</p></li>\n<li><p>informar o Financeiro;</p></li>\n<li><p>acompanhar o status do processo;</p></li>\n<li><p>consolidar informações para a indústria;</p></li>\n<li><p>apoiar a prestação de contas.</p></li>\n</ul>\n<p>Isso não significa que Trade seja sempre responsável pela cobrança,\nemissão de documentos ou conciliação financeira.</p>\n<p>Essas etapas podem depender do Financeiro, Comercial ou de outra área\ndo varejista.</p>\n<p>O mais importante é que o processo tenha responsáveis definidos e que\nTrade consiga visualizar o andamento.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Verba</tspan><tspan x=\"60\" dy=\"13\">negociada</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Registro</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Entrega</tspan><tspan x=\"327\" dy=\"13\">realizada</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Prestação</tspan><tspan x=\"460\" dy=\"13\">de contas</tspan></text></svg><div class=\"diagram-caption\">O dinheiro negociado precisa de um caminho até a prestação de contas final</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l26", "title": "3.8-3.13 JBP, Execução, Evidências e Desafios de Trade", "html": "<h2 id=\"jbp-joint-business-plan\"><strong>3.8. JBP: Joint Business\nPlan</strong></h2>\n<p><strong>JBP</strong> é o plano de negócio construído em conjunto entre o varejo e uma\nindústria.</p>\n<p>Seu objetivo é organizar a relação de forma mais estratégica,\nevitando que o relacionamento seja baseado apenas em negociações\npontuais.</p>\n<p>Um JBP pode envolver:</p>\n<ul>\n<li><p>objetivos conjuntos;</p></li>\n<li><p>metas;</p></li>\n<li><p>calendário de ações;</p></li>\n<li><p>categorias prioritárias;</p></li>\n<li><p>projetos;</p></li>\n<li><p>investimentos;</p></li>\n<li><p>compromissos de ambas as partes;</p></li>\n<li><p>indicadores;</p></li>\n<li><p>planos de ação;</p></li>\n<li><p>reuniões de acompanhamento;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>prazos.</p></li>\n</ul>\n<p>O JBP deve funcionar como um plano vivo.</p>\n<p>Não basta realizar uma reunião, preencher uma apresentação e deixar o\nmaterial sem acompanhamento. É necessário revisar o andamento, registrar\ndecisões e cobrar os compromissos definidos.</p>\n<h3 id=\"exemplo\"><strong>Exemplo</strong></h3>\n<p>Uma indústria e um varejista podem definir como objetivos:</p>\n<ul>\n<li><p>ampliar a participação de determinada categoria;</p></li>\n<li><p>aumentar a presença de lançamentos;</p></li>\n<li><p>desenvolver campanhas específicas;</p></li>\n<li><p>melhorar a execução;</p></li>\n<li><p>ampliar ações em canais digitais;</p></li>\n<li><p>criar uma agenda de reuniões;</p></li>\n<li><p>acompanhar indicadores de resultado.</p></li>\n</ul>\n<p>Cada objetivo deve ser transformado em ações concretas.</p>\n<h2 id=\"execução\"><strong>3.9. Execução</strong></h2>\n<p>Execução é o momento em que a entrega planejada acontece.</p>\n<p>Ela pode ocorrer:</p>\n<ul>\n<li><p>na loja;</p></li>\n<li><p>no aplicativo;</p></li>\n<li><p>no site;</p></li>\n<li><p>nas redes sociais;</p></li>\n<li><p>em encartes;</p></li>\n<li><p>em eventos;</p></li>\n<li><p>em comunicações internas;</p></li>\n<li><p>em campanhas de CRM;</p></li>\n<li><p>em outros canais do cliente.</p></li>\n</ul>\n<p>Dependendo da ação, a execução pode envolver gerentes de loja,\nsupervisores, Marketing, E-commerce, CRM, Operações ou parceiros\nexternos.</p>\n<p>Trade precisa acompanhar se a entrega:</p>\n<ul>\n<li><p>aconteceu no período correto;</p></li>\n<li><p>respeitou o que foi acordado;</p></li>\n<li><p>ocorreu nas lojas ou canais previstos;</p></li>\n<li><p>foi registrada;</p></li>\n<li><p>possui evidência;</p></li>\n<li><p>precisa de correção;</p></li>\n<li><p>pode ser apresentada para a indústria.</p></li>\n</ul>\n<p>A plataforma pode ajudar a organizar e acompanhar esse processo. Ela\nnão executa fisicamente a ação pelo varejista.</p>\n<h2 id=\"evidências\"><strong>3.10. Evidências</strong></h2>\n<p>Evidência é o registro que demonstra que determinada entrega foi\nrealizada.</p>\n<p>Exemplos:</p>\n<ul>\n<li><p>foto da execução;</p></li>\n<li><p>captura de tela;</p></li>\n<li><p>arquivo publicado;</p></li>\n<li><p>documento;</p></li>\n<li><p>confirmação de conclusão;</p></li>\n<li><p>relatório;</p></li>\n<li><p>imagem do encarte;</p></li>\n<li><p>registro da campanha;</p></li>\n<li><p>validação do responsável.</p></li>\n</ul>\n<p>A evidência precisa estar relacionada à entrega correta.</p>\n<p>Uma foto solta, sem data, loja, campanha ou identificação, pode não\nser suficiente para comprovar a execução.</p>\n<p>Por isso, o processo deve definir:</p>\n<ul>\n<li><p>qual evidência será aceita;</p></li>\n<li><p>quem deve enviá-la;</p></li>\n<li><p>até quando;</p></li>\n<li><p>quem valida;</p></li>\n<li><p>o que acontece quando existe erro;</p></li>\n<li><p>onde o histórico ficará armazenado.</p></li>\n</ul>\n<h2 id=\"indicadores-de-trade\"><strong>3.11. Indicadores de\nTrade</strong></h2>\n<p>Os indicadores variam conforme a operação e o objetivo do\ncliente.</p>\n<p>Alguns exemplos:</p>\n<ul>\n<li><p>número de campanhas;</p></li>\n<li><p>indústrias participantes;</p></li>\n<li><p>valor negociado;</p></li>\n<li><p>valor recebido;</p></li>\n<li><p>percentual de execução;</p></li>\n<li><p>entregas concluídas;</p></li>\n<li><p>entregas pendentes;</p></li>\n<li><p>adesão das lojas;</p></li>\n<li><p>participação das indústrias;</p></li>\n<li><p>evolução dos JBP;</p></li>\n<li><p>cumprimento de planos de ação;</p></li>\n<li><p>desempenho por categoria;</p></li>\n<li><p>resultado das campanhas;</p></li>\n<li><p>qualidade das evidências;</p></li>\n<li><p>tempo para conclusão das atividades.</p></li>\n</ul>\n<p>O CS precisa compreender quais indicadores importam para o cliente e\ncomo são calculados.</p>\n<p>Não é suficiente apresentar números sem contexto. O cliente precisa\nentender o que o indicador demonstra e qual decisão pode ser tomada a\npartir dele.</p>\n<h2 id=\"principais-desafios-de-uma-área-de-trade\"><strong>3.12.\nPrincipais desafios de uma área de Trade</strong></h2>\n<p>Entre os problemas mais comuns estão:</p>\n<ul>\n<li><p>informações espalhadas;</p></li>\n<li><p>excesso de planilhas;</p></li>\n<li><p>negociações sem registro;</p></li>\n<li><p>dificuldade de acompanhar contrapartidas;</p></li>\n<li><p>áreas trabalhando de forma isolada;</p></li>\n<li><p>falta de responsáveis;</p></li>\n<li><p>atrasos;</p></li>\n<li><p>ações sem evidência;</p></li>\n<li><p>baixa participação das lojas;</p></li>\n<li><p>dificuldade de apresentar resultado;</p></li>\n<li><p>pouca visibilidade para a liderança;</p></li>\n<li><p>dependência de uma única pessoa;</p></li>\n<li><p>falta de histórico;</p></li>\n<li><p>dificuldade de acompanhar verbas;</p></li>\n<li><p>processos diferentes para cada indústria;</p></li>\n<li><p>ausência de uma rotina de acompanhamento.</p></li>\n</ul>\n<p>Esses desafios ajudam o CS a compreender onde a plataforma pode gerar\nvalor.</p>\n<p>Porém, o CS não deve tentar corrigir todos os processos ao mesmo\ntempo. É necessário identificar prioridades e evoluir a operação por\netapas.</p>\n<h2 id=\"o-que-o-cs-deve-aprender-neste-bloco\"><strong>3.13. O que o CS\ndeve aprender neste bloco</strong></h2>\n<p>Ao final deste conteúdo, o CS deve ser capaz de explicar:</p>\n<ul>\n<li><p>qual é a função de Trade;</p></li>\n<li><p>como varejo e indústria se relacionam;</p></li>\n<li><p>o que são campanhas e contrapartidas;</p></li>\n<li><p>como funciona um calendário de Trade;</p></li>\n<li><p>o que é JBP;</p></li>\n<li><p>como acontecem execução e evidências;</p></li>\n<li><p>por que outras áreas participam dos processos;</p></li>\n<li><p>quais são os principais desafios da operação.</p></li>\n</ul>\n<p>O objetivo não é transformar o CS em um profissional de Trade. O\nobjetivo é dar contexto suficiente para que ele entenda a operação do\ncliente e conduza uma conversa com segurança.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">JBP</tspan><tspan x=\"60\" dy=\"13\">definido</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Execução</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Evidência</tspan><tspan x=\"327\" dy=\"13\">coletada</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Indicador</tspan><tspan x=\"460\" dy=\"13\">de resultado</tspan></text></svg><div class=\"diagram-caption\">Um JBP só tem valor quando gera execução, evidência e indicador reais</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8L3 14v6\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 8}, {"id": "plataforma", "num": 3, "title": "Onde a Meu Cliente Entra", "subtitle": "O papel da plataforma dentro da operação do cliente", "lessons": [{"id": "l27", "title": "4.1-4.13 Onde a Meu Cliente entra", "html": "<h1 id=\"bloco-4-onde-a-meu-cliente-entra-nessa-operação\"><strong>BLOCO\n4: ONDE A MEU CLIENTE ENTRA NESSA OPERAÇÃO</strong></h1>\n<h2 id=\"o-papel-da-meu-cliente\"><strong>4.1. O papel da Meu\nCliente</strong></h2>\n<p>A Meu Cliente apoia o varejo na organização e na gestão dos processos\nde Trade Marketing.</p>\n<p>A plataforma oferece um ambiente para centralizar informações,\nconectar participantes, acompanhar atividades e manter o histórico da\noperação.</p>\n<p>Na prática, a solução pode ajudar o cliente a:</p>\n<ul>\n<li><p>organizar campanhas;</p></li>\n<li><p>estruturar calendários;</p></li>\n<li><p>acompanhar planos conjuntos;</p></li>\n<li><p>criar <strong>workflow</strong>s;</p></li>\n<li><p>distribuir responsabilidades;</p></li>\n<li><p>controlar prazos;</p></li>\n<li><p>registrar negociações;</p></li>\n<li><p>acompanhar contrapartidas;</p></li>\n<li><p>organizar evidências;</p></li>\n<li><p>acompanhar a execução;</p></li>\n<li><p>conectar áreas;</p></li>\n<li><p>disponibilizar informações para indústrias;</p></li>\n<li><p>criar visibilidade sobre a operação.</p></li>\n</ul>\n<p>A Meu Cliente não deve ser apresentada apenas como uma ferramenta de\ncadastro.</p>\n<p>O valor está em ajudar o cliente a transformar processos dispersos em\numa operação mais organizada, visível e acompanhável.</p>\n<h2 id=\"organizar-não-significa-executar-pelo-cliente\"><strong>4.2.\nOrganizar não significa executar pelo cliente</strong></h2>\n<p>A plataforma organiza o processo, mas o cliente continua responsável\npor sua operação.</p>\n<p>Exemplos:</p>\n<ul>\n<li><p>a plataforma pode enviar uma solicitação para Marketing, mas não\ncria a peça;</p></li>\n<li><p>pode solicitar uma validação de Pricing, mas não calcula o\npreço;</p></li>\n<li><p>pode registrar uma demanda para TI, mas não administra os\nsistemas internos do cliente;</p></li>\n<li><p>pode incluir Supply em um workflow, mas não controla\nestoque;</p></li>\n<li><p>pode encaminhar informações ao Financeiro, mas não substitui o\nsistema financeiro;</p></li>\n<li><p>pode acompanhar uma entrega de loja, mas não realiza a execução\nfísica;</p></li>\n<li><p>pode centralizar uma evidência, mas não define sozinho se ela\natende às regras do cliente.</p></li>\n</ul>\n<p>Essa diferença deve estar clara para o CS e para o cliente.</p>\n<p>Quando o escopo não é bem compreendido, a plataforma pode ser cobrada\npor atividades que pertencem à operação interna do varejista.</p>\n<h2 id=\"a-plataforma-como-ponto-de-conexão\"><strong>4.3. A plataforma\ncomo ponto de conexão</strong></h2>\n<p>Muitas atividades de Trade dependem da participação de outras\náreas.</p>\n<p>A Meu Cliente pode funcionar como o ambiente em que essas\ndependências ficam organizadas.</p>\n<p>Exemplo:</p>\n<ol type=\"1\">\n<li><p>Comercial registra uma negociação;</p></li>\n<li><p>Trade estrutura a campanha;</p></li>\n<li><p>Pricing recebe uma solicitação de validação;</p></li>\n<li><p>Marketing recebe o briefing;</p></li>\n<li><p>Operações recebe as orientações;</p></li>\n<li><p>Financeiro recebe as informações necessárias;</p></li>\n<li><p>Trade acompanha as entregas;</p></li>\n<li><p>O histórico fica registrado.</p></li>\n</ol>\n<p>Nem todas as áreas precisam utilizar a plataforma da mesma forma.</p>\n<p>Algumas podem ser usuárias frequentes. Outras podem participar apenas\nem etapas específicas, aprovações ou tarefas.</p>\n<p>A configuração deve respeitar a realidade do cliente.</p>\n<h2 id=\"workflows\"><strong>4.4. Workflows</strong></h2>\n<p>Workflow é uma sequência organizada de etapas, responsáveis e\ndecisões.</p>\n<p>Um workflow pode ser utilizado para processos como:</p>\n<ul>\n<li><p>aprovação de campanhas;</p></li>\n<li><p>solicitação de materiais;</p></li>\n<li><p>validação de ações;</p></li>\n<li><p>comunicação com lojas;</p></li>\n<li><p>coleta de evidências;</p></li>\n<li><p>tratamento de pendências;</p></li>\n<li><p>solicitação de informações;</p></li>\n<li><p>aprovação de entregas;</p></li>\n<li><p>envio de dados ao Financeiro;</p></li>\n<li><p>demandas relacionadas a <strong>JBP</strong>;</p></li>\n<li><p>acompanhamento de planos de ação.</p></li>\n</ul>\n<p>Um workflow bem estruturado precisa definir:</p>\n<ul>\n<li><p>quem inicia;</p></li>\n<li><p>quais informações são obrigatórias;</p></li>\n<li><p>quais etapas existem;</p></li>\n<li><p>quem participa;</p></li>\n<li><p>quem aprova;</p></li>\n<li><p>quais prazos devem ser cumpridos;</p></li>\n<li><p>o que acontece em caso de reprovação;</p></li>\n<li><p>como o processo é encerrado.</p></li>\n</ul>\n<p>Não adianta digitalizar um processo confuso sem antes definir suas\nregras.</p>\n<p>O CS deve ajudar o cliente a transformar a necessidade em um fluxo\nclaro, sem assumir sozinho a responsabilidade pelo desenho do\nprocesso.</p>\n<h2 id=\"centralização-das-informações\"><strong>4.5. Centralização das\ninformações</strong></h2>\n<p>Em operações menos estruturadas, as informações podem estar\nespalhadas em:</p>\n<ul>\n<li><p>e-mails;</p></li>\n<li><p>mensagens;</p></li>\n<li><p>planilhas;</p></li>\n<li><p>apresentações;</p></li>\n<li><p>anotações;</p></li>\n<li><p>pastas;</p></li>\n<li><p>sistemas diferentes;</p></li>\n<li><p>arquivos pessoais.</p></li>\n</ul>\n<p>A centralização reduz a dependência da memória e facilita a\ncontinuidade da operação.</p>\n<p>Na plataforma, o cliente pode manter:</p>\n<ul>\n<li><p>campanhas;</p></li>\n<li><p>históricos;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>datas;</p></li>\n<li><p>tarefas;</p></li>\n<li><p>documentos;</p></li>\n<li><p>evidências;</p></li>\n<li><p>decisões;</p></li>\n<li><p>observações;</p></li>\n<li><p>planos;</p></li>\n<li><p>status;</p></li>\n<li><p>registros de acompanhamento.</p></li>\n</ul>\n<p>Centralização não significa que todos os sistemas do varejo serão\nsubstituídos.</p>\n<p>A plataforma deve centralizar aquilo que pertence ao processo de\nTrade e que faz parte do escopo contratado.</p>\n<h2 id=\"visibilidade-e-acompanhamento\"><strong>4.6. Visibilidade e\nacompanhamento</strong></h2>\n<p>Uma das funções da plataforma é permitir que o cliente compreenda o\nque está acontecendo na operação.</p>\n<p>Isso pode envolver a visualização de:</p>\n<ul>\n<li><p>campanhas em andamento;</p></li>\n<li><p>tarefas atrasadas;</p></li>\n<li><p>entregas pendentes;</p></li>\n<li><p>ações concluídas;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>planos de ação;</p></li>\n<li><p>evolução de JBP;</p></li>\n<li><p>participação das indústrias;</p></li>\n<li><p>evidências;</p></li>\n<li><p>informações financeiras relacionadas a Trade;</p></li>\n<li><p>indicadores disponíveis.</p></li>\n</ul>\n<p>A visibilidade permite que Trade deixe de atuar apenas de forma\nreativa.</p>\n<p>Com informações organizadas, a liderança pode identificar gargalos,\ncobrar responsáveis e tomar decisões com mais rapidez.</p>\n<h2 id=\"histórico-e-continuidade\"><strong>4.7. Histórico e\ncontinuidade</strong></h2>\n<p>Operações que dependem de uma única pessoa possuem alto risco.</p>\n<p>Quando o histórico não está registrado, uma troca de colaborador pode\ncausar:</p>\n<ul>\n<li><p>perda de informações;</p></li>\n<li><p>interrupção de processos;</p></li>\n<li><p>dificuldade de localizar acordos;</p></li>\n<li><p>necessidade de reconstruir decisões;</p></li>\n<li><p>perda de credibilidade com a indústria;</p></li>\n<li><p>retrabalho.</p></li>\n</ul>\n<p>A plataforma ajuda a manter o histórico da operação e reduzir essa\ndependência.</p>\n<p>Para isso, o uso precisa fazer parte da rotina. Não basta contratar,\nconfigurar e abandonar o sistema.</p>\n<h2 id=\"relação-com-as-indústrias\"><strong>4.8. Relação com as\nindústrias</strong></h2>\n<p>Dependendo do módulo e do escopo contratado, a Meu Cliente pode\napoiar a comunicação e a disponibilização de informações para as\nindústrias.</p>\n<p>Isso pode incluir:</p>\n<ul>\n<li><p>visualização de oportunidades;</p></li>\n<li><p>acompanhamento de ações;</p></li>\n<li><p>acesso a informações;</p></li>\n<li><p>envio de documentos;</p></li>\n<li><p>consulta a resultados;</p></li>\n<li><p>participação em processos;</p></li>\n<li><p>acompanhamento de planos;</p></li>\n<li><p>interação com o varejo.</p></li>\n</ul>\n<p>O nível de acesso deve ser definido pelo cliente.</p>\n<p>A indústria não deve visualizar informações internas que não façam\nparte de sua relação com o varejista.</p>\n<h2 id=\"o-que-a-meu-cliente-não-faz\"><strong>4.9. O que a Meu Cliente\nnão faz</strong></h2>\n<p>A Meu Cliente não deve ser apresentada como responsável por toda a\noperação do varejo.</p>\n<p>A plataforma não:</p>\n<ul>\n<li><p>gerencia estoque;</p></li>\n<li><p>realiza abastecimento;</p></li>\n<li><p>controla centros de distribuição;</p></li>\n<li><p>faz reposição;</p></li>\n<li><p>calcula preços;</p></li>\n<li><p>define margem;</p></li>\n<li><p>substitui o ERP;</p></li>\n<li><p>substitui sistemas de BI;</p></li>\n<li><p>substitui o sistema financeiro;</p></li>\n<li><p>executa campanhas pelo cliente;</p></li>\n<li><p>produz materiais de Marketing;</p></li>\n<li><p>negocia com a indústria sem participação do cliente;</p></li>\n<li><p>toma decisões em nome do varejo;</p></li>\n<li><p>administra a equipe das lojas;</p></li>\n<li><p>garante o cumprimento de atividades que dependem dos\nusuários;</p></li>\n<li><p>resolve problemas internos de governança do cliente de forma\nautomática.</p></li>\n</ul>\n<p>A plataforma oferece estrutura, organização, automação e\nvisibilidade.</p>\n<p>O resultado depende da combinação entre tecnologia, processo,\nresponsáveis e uso contínuo.</p>\n<h2 id=\"papel-do-cliente\"><strong>4.10. Papel do cliente</strong></h2>\n<p>Para que a plataforma funcione, o cliente precisa:</p>\n<ul>\n<li><p>definir responsáveis;</p></li>\n<li><p>participar da implantação;</p></li>\n<li><p>validar os processos;</p></li>\n<li><p>disponibilizar informações;</p></li>\n<li><p>envolver as áreas necessárias;</p></li>\n<li><p>treinar os usuários;</p></li>\n<li><p>utilizar a ferramenta;</p></li>\n<li><p>acompanhar as pendências;</p></li>\n<li><p>comunicar mudanças;</p></li>\n<li><p>validar as entregas;</p></li>\n<li><p>manter a governança;</p></li>\n<li><p>dar retorno sobre problemas e oportunidades.</p></li>\n</ul>\n<p>A falta de participação do cliente pode comprometer a adoção, mesmo\nquando a plataforma está tecnicamente disponível.</p>\n<h2 id=\"papel-do-cs\"><strong>4.11. Papel do CS</strong></h2>\n<p>O CS deve garantir que o cliente compreenda como utilizar a\nplataforma dentro de sua operação.</p>\n<p>Isso envolve:</p>\n<ul>\n<li><p>conhecer o objetivo do cliente;</p></li>\n<li><p>compreender os processos configurados;</p></li>\n<li><p>acompanhar a adoção;</p></li>\n<li><p>identificar gargalos;</p></li>\n<li><p>organizar planos de ação;</p></li>\n<li><p>conectar o cliente às áreas internas da Meu Cliente;</p></li>\n<li><p>acompanhar riscos;</p></li>\n<li><p>orientar boas práticas;</p></li>\n<li><p>demonstrar evolução;</p></li>\n<li><p>reforçar responsabilidades;</p></li>\n<li><p>evitar promessas fora do escopo.</p></li>\n</ul>\n<p>O CS não deve se transformar no operador da ferramenta para o\ncliente.</p>\n<p>Quando o CS executa constantemente atividades que pertencem ao\nusuário, pode criar uma falsa percepção de adoção.</p>\n<h2 id=\"como-explicar-o-valor-da-plataforma\"><strong>4.12. Como explicar\no valor da plataforma</strong></h2>\n<p>O valor não deve ser comunicado apenas por meio da quantidade de\nfuncionalidades.</p>\n<p>Uma boa explicação conecta a funcionalidade a um problema real.</p>\n<h3 id=\"exemplo-fraco\"><strong>Exemplo fraco</strong></h3>\n<p>“A plataforma possui workflows.”</p>\n<h3 id=\"exemplo-adequado\"><strong>Exemplo adequado</strong></h3>\n<p>“O workflow organiza as etapas da campanha, define responsáveis e\npermite acompanhar onde o processo está parado.”</p>\n<h3 id=\"exemplo-fraco-1\"><strong>Exemplo fraco</strong></h3>\n<p>“A plataforma possui <strong>Fotocheck</strong>.”</p>\n<h3 id=\"exemplo-adequado-1\"><strong>Exemplo adequado</strong></h3>\n<p>“O Fotocheck ajuda o cliente a organizar a coleta e a análise das\nevidências de execução, reduzindo controles dispersos.”</p>\n<h3 id=\"exemplo-fraco-2\"><strong>Exemplo fraco</strong></h3>\n<p>“A plataforma possui calendário.”</p>\n<h3 id=\"exemplo-adequado-2\"><strong>Exemplo adequado</strong></h3>\n<p>“O calendário concentra as campanhas de Trade e facilita o\nplanejamento das oportunidades ao longo do ano.”</p>\n<p>O CS deve sempre relacionar produto, processo e resultado\nesperado.</p>\n<h2 id=\"o-que-o-cs-deve-aprender-neste-bloco\"><strong>4.13. O que o CS\ndeve aprender neste bloco</strong></h2>\n<p>Ao final deste conteúdo, o CS deve ser capaz de:</p>\n<ul>\n<li><p>explicar o papel da Meu Cliente;</p></li>\n<li><p>diferenciar organização de execução;</p></li>\n<li><p>explicar como outras áreas participam dos workflows;</p></li>\n<li><p>apresentar os limites da plataforma;</p></li>\n<li><p>evitar promessas fora do escopo;</p></li>\n<li><p>relacionar funcionalidades a problemas de negócio;</p></li>\n<li><p>explicar a responsabilidade do cliente na adoção.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">A plataforma organiza</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">O cliente executa</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">workflow</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">tarefas</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">histórico</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">preço</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">estoque</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">produção de peça</text></svg><div class=\"diagram-caption\">Organizar o processo nunca significa assumir a operação do cliente</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l3 3-3 3-3-3 3-3z\"/><path d=\"M12 16l3 3-3 3-3-3 3-3z\"/><path d=\"M2 12l3-3 3 3-3 3-3-3z\"/><path d=\"M16 12l3-3 3 3-3 3-3-3z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l28", "title": "5.12-5.13 Como apresentar módulos e medir adoção", "html": "<h2 id=\"como-o-cs-deve-apresentar-um-módulo\"><strong>5.12. Como o CS\ndeve apresentar um módulo</strong></h2>\n<p>Ao apresentar um módulo, o CS deve seguir uma sequência simples.</p>\n<h3 id=\"começar-pelo-problema\"><strong>1. Começar pelo\nproblema</strong></h3>\n<p>Qual dificuldade da operação será tratada?</p>\n<h3 id=\"explicar-o-processo\"><strong>2. Explicar o\nprocesso</strong></h3>\n<p>Como o cliente realiza essa atividade hoje?</p>\n<h3 id=\"mostrar-
