x1=\"350\" x2=\"580\" y1=\"56\" y2=\"100\"></line>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"50\" y=\"100\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"120\" y=\"120\">Referência</text>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"120\" y=\"135\">executiva</text>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"210\" y=\"100\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"280\" y=\"120\">Ponto</text>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"280\" y=\"135\">focal</text>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"350\" y=\"100\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"420\" y=\"120\">Usuário</text>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"420\" y=\"135\">chave</text>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"510\" y=\"100\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"580\" y=\"120\">Responsável</text>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"580\" y=\"135\">técnico</text>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"130\" y=\"170\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"200\" y=\"190\">Administrador</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"200\" y=\"205\">usuários e acessos</text>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"290\" y=\"170\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"360\" y=\"190\">Tomador de</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"360\" y=\"205\">decisão</text>\n<rect fill=\"#F0EFF4\" height=\"46\" rx=\"10\" stroke=\"#E4E1EE\" width=\"140\" x=\"450\" y=\"170\"></rect>\n<text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"520\" y=\"190\">Pessoa</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"520\" y=\"205\">influente</text>\n<rect fill=\"#FFF7E0\" height=\"24\" rx=\"7\" stroke=\"#F1DFA0\" width=\"400\" x=\"150\" y=\"234\"></rect>\n<text fill=\"#B8901A\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"250\">A conta não pode depender de uma única pessoa</text>\n</svg><div class=\"diagram-caption\">Os diferentes perfis envolvidos numa conta Enterprise</div></div>\n<p>O CS precisa conhecer as pessoas que utilizam, influenciam, aprovam\nou tomam decisões sobre a plataforma.</p>\n<p>A conta não pode depender apenas de um ponto focal.</p>\n<h2 id=\"perfis-principais\"><strong>Perfis principais</strong></h2>\n<h3 id=\"referência-executiva\"><strong>Referência executiva</strong></h3>\n<p>Pessoa da liderança que acompanha a importância do projeto, ajuda a\nremover bloqueios e participa de decisões relevantes.</p>\n<h3 id=\"ponto-focal\"><strong>Ponto focal</strong></h3>\n<p>Principal contato operacional do CS.</p>\n<h3 id=\"usuário-chave\"><strong>Usuário-chave</strong></h3>\n<p>Pessoa que conhece o processo e utiliza a plataforma com\nfrequência.</p>\n<h3 id=\"administrador\"><strong>Administrador</strong></h3>\n<p>Responsável por usuários, configurações ou organização interna.</p>\n<h3 id=\"responsável-técnico\"><strong>Responsável técnico</strong></h3>\n<p>Pessoa ligada a integrações, acessos, segurança ou dados.</p>\n<h3 id=\"tomador-de-decisão\"><strong>Tomador de decisão</strong></h3>\n<p>Pessoa que aprova mudanças, investimentos ou prioridades.</p>\n<h3 id=\"pessoa-influente\"><strong>Pessoa influente</strong></h3>\n<p>Pessoa cuja opinião interfere na percepção interna sobre a\nsolução.</p>\n<h3 id=\"usuário-operacional\"><strong>Usuário operacional</strong></h3>\n<p>Pessoa que executa tarefas dentro da plataforma.</p>\n<h2 id=\"informações-que-devem-ser-registradas\"><strong>Informações que\ndevem ser registradas</strong></h2>\n<p>Para cada pessoa envolvida, vale registrar:</p><ul>\n<li><p>nome;</p></li>\n<li><p>cargo;</p></li>\n<li><p>área;</p></li>\n<li><p>papel na operação;</p></li>\n<li><p>nível de influência;</p></li>\n<li><p>nível de utilização;</p></li>\n<li><p>percepção sobre a plataforma;</p></li>\n<li><p>assuntos pelos quais responde;</p></li>\n<li><p>frequência de contato;</p></li>\n<li><p>riscos relacionados.</p></li>\n</ul><p>Esse registro é o que permite que outra pessoa da Meu Cliente assuma a conta, se necessário, sem depender da memória de quem atendia antes.</p>\n<h2 id=\"riscos-comuns\"><strong>Riscos comuns</strong></h2>\n<p>Entre os riscos mais frequentes desse mapeamento estão:</p><ul>\n<li><p>depender de uma única pessoa;</p></li>\n<li><p>não conhecer a liderança responsável;</p></li>\n<li><p>falar apenas com usuários operacionais;</p></li>\n<li><p>ter um ponto focal sem poder de decisão;</p></li>\n<li><p>deixar responsáveis técnicos fora das discussões;</p></li>\n<li><p>não dar visibilidade para a liderança.</p></li>\n</ul><p>A maioria desses riscos só aparece quando o CS já está no meio de um problema, por isso vale revisá-los de tempos em tempos, e não só quando algo dá errado.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">Para cada pessoa envolvida, registre</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Nome, cargo e área</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Papel na operação</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Nível de influência e de uso</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Riscos relacionados a ela</text></svg><div class=\"diagram-caption\">Um mapa só é útil quando cada nome vem com essas informações</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l41", "title": "2. Organização da conta e relacionamento executivo", "html": "<h1 id=\"organização-da-conta-e-relacionamento-executivo\"><strong>2.\nORGANIZAÇÃO DA CONTA E RELACIONAMENTO EXECUTIVO</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\" viewbox=\"0 0 700 240\" xmlns=\"http://www.w3.org/2000/svg\">\n<polygon fill=\"#F2C230\" points=\"350,20 460,90 240,90\"></polygon>\n<text fill=\"#2B2361\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"65\">Executivo</text>\n<polygon fill=\"#3a3080\" points=\"220,100 480,100 520,170 180,170\"></polygon>\n<text fill=\"#fff\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"140\">Tático</text>\n<polygon fill=\"#2B2361\" points=\"160,180 540,180 590,230 110,230\"></polygon>\n<text fill=\"#F2C230\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"210\">Operacional</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" x=\"490\" y=\"65\">objetivos, valor, risco, upsell</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" x=\"540\" y=\"140\">processos, prioridades, adoção</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" x=\"600\" y=\"210\">tarefas, dúvidas, pendências</text>\n</svg><div class=\"diagram-caption\">Os três níveis de relacionamento numa conta Enterprise</div></div>\n<p>Uma conta bem organizada possui uma rotina clara de contatos,\nreuniões, registros e decisões.</p>\n<p>Essa organização define:</p>\n<ul>\n<li><p>quem participa;</p></li>\n<li><p>quais reuniões existem;</p></li>\n<li><p>qual é a frequência;</p></li>\n<li><p>quais indicadores são acompanhados;</p></li>\n<li><p>onde as decisões são registradas;</p></li>\n<li><p>como os problemas são levados à liderança;</p></li>\n<li><p>quem pode tomar decisões.</p></li>\n</ul>\n<h2 id=\"níveis-de-relacionamento\"><strong>Níveis de\nrelacionamento</strong></h2>\n<h3 id=\"operacional\"><strong>Operacional</strong></h3>\n<p>Trata utilização, tarefas, dúvidas e pendências do dia a dia.</p>\n<h3 id=\"tático\"><strong>Tático</strong></h3>\n<p>Trata processos, prioridades, indicadores, adoção e planos de\nação.</p>\n<h3 id=\"executivo\"><strong>Executivo</strong></h3>\n<p>Trata objetivos, valor, riscos, evolução da parceria, decisões e\noportunidades de <strong>upsell</strong>.</p>\n<p>O CS não precisa conversar com a diretoria toda semana.</p>\n<p>Por outro lado, a conta não deve depender apenas de um relacionamento\noperacional.</p>\n<h2 id=\"quando-envolver-a-liderança\"><strong>Quando envolver a\nliderança</strong></h2>\n<p>Alguns momentos pedem esse envolvimento, como:</p><ul>\n<li><p>bloqueios internos;</p></li>\n<li><p>baixa participação das áreas;</p></li>\n<li><p>risco relevante;</p></li>\n<li><p>mudança de prioridade;</p></li>\n<li><p>baixa adoção persistente;</p></li>\n<li><p>necessidade de decisão;</p></li>\n<li><p>apresentação de evolução;</p></li>\n<li><p>alinhamento estratégico;</p></li>\n<li><p>oportunidade relevante de upsell.</p></li>\n</ul><p>Envolver a liderança nesses momentos não é sinal de que o CS perdeu o controle da conta. É, ao contrário, parte do que se espera de uma boa condução.</p>\n<h2 id=\"cuidado\"><strong>Cuidado</strong></h2>\n<p>A liderança não deve ser chamada apenas quando existe problema.</p>\n<p>Também precisa receber visibilidade sobre avanços, resultados,\ndecisões e próximos passos.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C41E68\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Nível operacional</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Nível executivo</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">tarefas</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">dúvidas</text><text x=\"180\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">pendências do dia</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">objetivos</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">risco</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">evolução da parceria</text></svg><div class=\"diagram-caption\">Uma conta saudável transita entre o operacional e o executivo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l42", "title": "3. Reuniões mensais de acompanhamento", "html": "<h1 id=\"reuniões-mensais-de-acompanhamento\"><strong>3. REUNIÕES MENSAIS\nDE ACOMPANHAMENTO</strong></h1>\n<p>No Enterprise, a principal rotina formal com o cliente é a reunião\nmensal de acompanhamento.</p>\n<p>A reunião não deve servir apenas para listar tarefas.</p>\n<p>Ela precisa mostrar:</p>\n<ul>\n<li><p>o que evoluiu;</p></li>\n<li><p>o que continua parado;</p></li>\n<li><p>quais riscos existem;</p></li>\n<li><p>quais decisões são necessárias;</p></li>\n<li><p>quais serão os próximos passos.</p></li>\n</ul>\n<h2 id=\"preparação\"><strong>Preparação</strong></h2>\n<p>Antes da reunião, o CS deve revisar:</p>\n<ul>\n<li><p>ata anterior;</p></li>\n<li><p>pendências;</p></li>\n<li><p>utilização;</p></li>\n<li><p>processos em andamento;</p></li>\n<li><p>integrações;</p></li>\n<li><p>chamados;</p></li>\n<li><p>feedbacks;</p></li>\n<li><p>riscos;</p></li>\n<li><p>plano de ação;</p></li>\n<li><p>assuntos enviados pelo cliente.</p></li>\n</ul>\n<h2 id=\"pauta-recomendada\"><strong>Pauta recomendada</strong></h2>\n<p>Uma pauta equilibrada costuma seguir esta ordem:</p><ol type=\"1\">\n<li><p>Retomada dos compromissos anteriores;</p></li>\n<li><p>Evolução do uso;</p></li>\n<li><p>Situação dos processos prioritários;</p></li>\n<li><p>Integrações e temas técnicos;</p></li>\n<li><p>Pendências;</p></li>\n<li><p>Riscos;</p></li>\n<li><p>Feedbacks;</p></li>\n<li><p>Novidades relevantes;</p></li>\n<li><p>Oportunidades de <strong>upsell</strong>, quando fizer sentido;</p></li>\n<li><p>Próximos passos.</p></li>\n</ol><p>Seguir essa ordem ajuda a garantir que a reunião não vire só uma atualização de status, mas termine com decisões e responsáveis definidos.</p>\n<h2 id=\"durante-a-reunião\"><strong>Durante a reunião</strong></h2>\n<p>O CS deve:</p>\n<ul>\n<li><p>conduzir a pauta;</p></li>\n<li><p>evitar dispersão;</p></li>\n<li><p>questionar prazos vagos;</p></li>\n<li><p>confirmar responsáveis;</p></li>\n<li><p>registrar decisões;</p></li>\n<li><p>diferenciar problema técnico de problema de processo;</p></li>\n<li><p>evitar promessas sem validação;</p></li>\n<li><p>garantir espaço para o cliente;</p></li>\n<li><p>transformar os dados apresentados em decisões.</p></li>\n</ul>\n<p>Apresentar números e encerrar a reunião não gera valor.</p>\n<p><strong>Dados sem ação não valem nada.</strong></p>\n<p>Se o uso diminuiu, é preciso definir o que será feito. Se existem\ntarefas atrasadas, é necessário identificar o motivo. Se uma área não\nparticipa, alguém precisa assumir a conversa.</p>\n<h2 id=\"após-a-reunião\"><strong>Após a reunião</strong></h2>\n<p>Logo depois da reunião, o CS deve:</p><ul>\n<li><p>enviar a ata;</p></li>\n<li><p>registrar no <strong>Monday</strong>;</p></li>\n<li><p>criar tarefas;</p></li>\n<li><p>confirmar responsáveis;</p></li>\n<li><p>acompanhar os prazos;</p></li>\n<li><p>compartilhar internamente os temas relevantes.</p></li>\n</ul><p>Pular essas etapas é uma das formas mais comuns de uma boa reunião não gerar nenhum resultado prático nas semanas seguintes.</p>\n<h2 id=\"reunião-sem-decisão\"><strong>Reunião sem decisão</strong></h2>\n<p>Quando a reunião termina apenas com atualizações, sem responsáveis ou\npróximos passos, ela gera pouco resultado.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 640 90\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"580\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Preparação</tspan></text><polygon points=\"120,38 130,42 120,46\" fill=\"#C41E68\"/><circle cx=\"190\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"190\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"190\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"190\" dy=\"0\">Reunião</tspan></text><polygon points=\"250,38 260,42 250,46\" fill=\"#C41E68\"/><circle cx=\"320\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"320\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"320\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"320\" dy=\"0\">Decisões</tspan></text><polygon points=\"380,38 390,42 380,46\" fill=\"#C41E68\"/><circle cx=\"450\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"450\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"450\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"450\" dy=\"0\">Responsáveis</tspan></text><polygon points=\"510,38 520,42 510,46\" fill=\"#C41E68\"/><circle cx=\"580\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"580\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"580\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"580\" dy=\"0\">Acompanhamento</tspan></text></svg><div class=\"diagram-caption\">Uma reunião só gera valor quando termina em decisão e responsável</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l43", "title": "4. Acompanhamento de integrações", "html": "<h1 id=\"acompanhamento-de-integrações\"><strong>4. ACOMPANHAMENTO DE\nINTEGRAÇÕES</strong></h1>\n<p>Integrações podem ser essenciais para a operação, mas sua execução\ntécnica pertence aos responsáveis de Tecnologia.</p>\n<p>O papel do CS é acompanhar o impacto da integração na jornada.</p>\n<h2 id=\"o-que-o-cs-precisa-conhecer\"><strong>O que o CS precisa\nconhecer</strong></h2>\n<p>Para acompanhar bem, é preciso saber:</p><ul>\n<li><p>objetivo da integração;</p></li>\n<li><p>dados envolvidos;</p></li>\n<li><p>sistema de origem;</p></li>\n<li><p>responsável do cliente;</p></li>\n<li><p>responsável da Meu Cliente;</p></li>\n<li><p>status;</p></li>\n<li><p>dependências;</p></li>\n<li><p>prazo validado;</p></li>\n<li><p>riscos;</p></li>\n<li><p>forma de teste;</p></li>\n<li><p>critério de conclusão;</p></li>\n<li><p>impacto em caso de atraso.</p></li>\n</ul><p>Sem essas informações, é fácil o CS repassar um prazo que não vai se confirmar, ou dar uma satisfação incompleta ao cliente.</p>\n<h2 id=\"comunicação-correta\"><strong>Comunicação correta</strong></h2>\n<p>Evitar:</p>\n<p>“A integração está quase pronta.”</p>\n<p>Preferir:</p>\n<p>“A integração está na etapa de validação técnica. A próxima atividade\né o envio do arquivo pelo cliente até o dia X. Depois disso, o time\ntécnico poderá concluir os testes.”</p>\n<h2 id=\"o-cs-não-deve\"><strong>O CS não deve</strong></h2>\n<p>Isso significa que o CS evita:</p><ul>\n<li><p>estimar prazo sozinho;</p></li>\n<li><p>definir arquitetura;</p></li>\n<li><p>prometer escopo;</p></li>\n<li><p>validar segurança;</p></li>\n<li><p>afirmar que uma integração está concluída sem\nconfirmação;</p></li>\n<li><p>esconder dependências do cliente.</p></li>\n</ul><p>Esses limites existem porque o CS não tem, e não precisa ter, o conhecimento técnico para validar essas decisões sozinho.</p>\n<h2 id=\"integração-concluída\"><strong>Integração concluída</strong></h2>\n<p>A conclusão não pode ser apenas técnica.</p>\n<p>É necessário confirmar:</p>\n<ul>\n<li><p>os dados estão chegando;</p></li>\n<li><p>a atualização acontece como esperado;</p></li>\n<li><p>o usuário validou;</p></li>\n<li><p>o processo utiliza a informação;</p></li>\n<li><p>os erros conhecidos foram tratados;</p></li>\n<li><p>existe uma pessoa responsável pelo acompanhamento.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Sistema do</tspan><tspan x=\"60\" dy=\"13\">cliente</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Integração</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Meu</tspan><tspan x=\"327\" dy=\"13\">Cliente</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Validação</tspan><tspan x=\"460\" dy=\"13\">do usuário</tspan></text></svg><div class=\"diagram-caption\">Uma integração só está concluída quando o usuário confirma que funciona</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l44", "title": "5. Gestão de usuários e acessos", "html": "<h1 id=\"gestão-de-usuários-e-acessos\"><strong>5. GESTÃO DE USUÁRIOS E\nACESSOS</strong></h1>\n<p>A adoção depende de os usuários corretos possuírem acesso,\ntreinamento e responsabilidade.</p>\n<h2 id=\"o-cs-deve-acompanhar\"><strong>O CS deve acompanhar</strong></h2>\n<p>Isso envolve ficar de olho em:</p><ul>\n<li><p>usuários previstos;</p></li>\n<li><p>perfis de acesso;</p></li>\n<li><p>administradores;</p></li>\n<li><p>acessos pendentes;</p></li>\n<li><p>usuários inativos;</p></li>\n<li><p>desligamentos;</p></li>\n<li><p>novos colaboradores;</p></li>\n<li><p>áreas participantes;</p></li>\n<li><p>treinamentos realizados.</p></li>\n</ul><p>Esse acompanhamento evita boa parte dos problemas de adoção que, na origem, são apenas uma questão de acesso mal configurado.</p>\n<h2 id=\"responsabilidades-do-cliente\"><strong>Responsabilidades do\ncliente</strong></h2>\n<p>O cliente precisa:</p>\n<ul>\n<li><p>indicar os usuários;</p></li>\n<li><p>informar mudanças;</p></li>\n<li><p>definir permissões;</p></li>\n<li><p>indicar administradores;</p></li>\n<li><p>solicitar remoções;</p></li>\n<li><p>garantir que as pessoas participem dos treinamentos.</p></li>\n</ul>\n<h2 id=\"riscos-comuns\"><strong>Riscos comuns</strong></h2>\n<p>Os riscos mais comuns nessa frente são:</p><ul>\n<li><p>usuários genéricos;</p></li>\n<li><p>acessos compartilhados;</p></li>\n<li><p>pessoas desligadas mantendo acesso;</p></li>\n<li><p>usuários sem treinamento;</p></li>\n<li><p>administrador não definido;</p></li>\n<li><p>acesso liberado para quem não participa do processo;</p></li>\n<li><p>usuário criado sem responsabilidade clara.</p></li>\n</ul><p>Grande parte desses riscos só é percebida quando já causou um problema, como um usuário desligado que continuava com acesso ativo.</p>\n<h2 id=\"acesso-não-é-adoção\"><strong>Acesso não é adoção</strong></h2>\n<p>Ter muitos usuários cadastrados não representa sucesso.</p>\n<p>O CS deve acompanhar quem realmente utiliza a plataforma e para quais\nprocessos.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 152\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#1E8E5A\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Acesso criado</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Acesso usado</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">usuário cadastrado</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">permissão liberada</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">login recorrente</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">processo real rodando</text></svg><div class=\"diagram-caption\">Ter acesso e usar o acesso são coisas bem diferentes</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l45", "title": "6. Gestão de demandas para Produto, TI e Suporte", "html": "<h1 id=\"gestão-de-demandas-para-produto-ti-e-suporte\"><strong>6. GESTÃO\nDE DEMANDAS PARA PRODUTO, TI E SUPORTE</strong></h1>\n<p>O CS precisa organizar a demanda antes de enviá-la para outra\nárea.</p>\n<p>Encaminhar apenas uma mensagem ou um print sem contexto gera\nretrabalho e atraso.</p>\n<h2 id=\"toda-demanda-deve-conter\"><strong>Toda demanda deve\nconter</strong></h2>\n<p>Antes de encaminhar, confirme que a demanda traz:</p><ul>\n<li><p>cliente;</p></li>\n<li><p>usuário afetado;</p></li>\n<li><p>descrição do problema;</p></li>\n<li><p>processo envolvido;</p></li>\n<li><p>comportamento esperado;</p></li>\n<li><p>comportamento encontrado;</p></li>\n<li><p>impacto;</p></li>\n<li><p>urgência;</p></li>\n<li><p>prints ou vídeos;</p></li>\n<li><p>data do ocorrido;</p></li>\n<li><p>passos para reproduzir;</p></li>\n<li><p>responsável pelo retorno.</p></li>\n</ul><p>Uma demanda incompleta quase sempre volta para o CS com perguntas, o que atrasa a solução e frustra o cliente duas vezes.</p>\n<h2 id=\"suporte\"><strong>Suporte</strong></h2>\n<p>Deve receber:</p>\n<ul>\n<li><p>dúvidas;</p></li>\n<li><p>erros pontuais;</p></li>\n<li><p>problemas de acesso;</p></li>\n<li><p>orientações de uso;</p></li>\n<li><p>falhas reproduzíveis.</p></li>\n</ul>\n<h2 id=\"tecnologia\"><strong>Tecnologia</strong></h2>\n<p>Deve receber:</p>\n<ul>\n<li><p>incidentes técnicos;</p></li>\n<li><p>integrações;</p></li>\n<li><p>problemas de dados;</p></li>\n<li><p>falhas de infraestrutura;</p></li>\n<li><p>questões que exigem análise técnica.</p></li>\n</ul>\n<h2 id=\"produto\"><strong>Produto</strong></h2>\n<p>Deve receber:</p>\n<ul>\n<li><p>feedbacks recorrentes;</p></li>\n<li><p>oportunidades de melhoria;</p></li>\n<li><p>problemas de usabilidade;</p></li>\n<li><p>necessidades de evolução;</p></li>\n<li><p>demandas que afetam o processo.</p></li>\n</ul>\n<h2 id=\"o-que-o-cs-não-deve-fazer\"><strong>O que o CS não deve\nfazer</strong></h2>\n<p>Para não gerar retrabalho, o CS evita:</p><ul>\n<li><p>enviar demandas incompletas;</p></li>\n<li><p>tratar todo pedido como urgente;</p></li>\n<li><p>prometer que Produto desenvolverá;</p></li>\n<li><p>criar expectativa de prazo;</p></li>\n<li><p>confundir dúvida de uso com erro;</p></li>\n<li><p>apenas repassar a mensagem do cliente.</p></li>\n</ul><p>Esses cuidados evitam que o CS crie uma expectativa que depois precisa desmentir, o que costuma custar mais caro do que um primeiro retorno sincero.</p>\n<h2 id=\"retorno-ao-cliente\"><strong>Retorno ao cliente</strong></h2>\n<p>O cliente deve receber atualizações mesmo quando ainda não existe uma\nsolução final.</p>\n<p>A comunicação precisa explicar:</p>\n<ul>\n<li><p>o que foi analisado;</p></li>\n<li><p>qual área está responsável;</p></li>\n<li><p>qual é o status;</p></li>\n<li><p>qual é o próximo passo;</p></li>\n<li><p>quando haverá uma nova atualização.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 480 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:480px;display:block;margin:0 auto;\"><circle cx=\"240\" cy=\"210\" r=\"150\" fill=\"none\" stroke=\"#F0EFF4\" stroke-width=\"1\"/><line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"60\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"186\" y=\"43\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"240\" y=\"64\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"240\" dy=\"0\">Suporte</tspan></text><line x1=\"240\" y1=\"210\" x2=\"370\" y2=\"285\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"316\" y=\"268\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"370\" y=\"289\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"370\" dy=\"0\">Tecnologia</tspan></text><line x1=\"240\" y1=\"210\" x2=\"110\" y2=\"285\" stroke=\"#E4E1EE\" stroke-width=\"2\"/><rect x=\"56\" y=\"268\" width=\"108\" height=\"34\" rx=\"9\" fill=\"#fff\" stroke=\"#E4E1EE\" stroke-width=\"1.5\"/><text x=\"110\" y=\"289\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"110\" dy=\"0\">Produto</tspan></text><circle cx=\"240\" cy=\"210\" r=\"50\" fill=\"#2B2361\"/><text x=\"240\" y=\"214\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#F2C230\"><tspan x=\"240\" dy=\"0\">DEMANDA</tspan></text></svg><div class=\"diagram-caption\">Cada tipo de demanda tem um destino certo, e enviar errado custa tempo</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l46", "title": "7. Comunicação, atas e follow-ups", "html": "<h1 id=\"comunicação-atas-e-follow-ups\"><strong>7. COMUNICAÇÃO, ATAS E\nFOLLOW-UPS</strong></h1>\n<p>A comunicação do CS deve gerar clareza e fazer os temas\navançarem.</p>\n<p>Mensagens vagas aumentam o número de contatos e dificultam a\ndefinição de responsabilidades.</p>\n<h2 id=\"boas-práticas\"><strong>Boas práticas</strong></h2>\n<p>Uma comunicação clara costuma seguir estes princípios:</p><ul>\n<li><p>contextualizar o assunto;</p></li>\n<li><p>informar o que precisa acontecer;</p></li>\n<li><p>indicar responsável;</p></li>\n<li><p>indicar prazo;</p></li>\n<li><p>explicar o impacto;</p></li>\n<li><p>manter um tom profissional e próximo;</p></li>\n<li><p>evitar mensagens longas sem necessidade;</p></li>\n<li><p>registrar assuntos importantes por e-mail ou no ambiente\noficial.</p></li>\n</ul><p>Uma mensagem que ignora esses pontos costuma gerar mais um e-mail de esclarecimento do que uma resposta objetiva do cliente.</p>\n<h2 id=\"uso-dos-canais\"><strong>Uso dos canais</strong></h2>\n<h3 id=\"whatsapp\"><strong>WhatsApp</strong></h3>\n<p>Pode ser utilizado para:</p>\n<ul>\n<li><p>alinhamentos rápidos;</p></li>\n<li><p>avisos;</p></li>\n<li><p>lembretes;</p></li>\n<li><p>contatos simples.</p></li>\n</ul>\n<p>Decisões importantes precisam ser formalizadas.</p>\n<h3 id=\"e-mail\"><strong>E-mail</strong></h3>\n<p>Deve ser utilizado para:</p>\n<ul>\n<li><p>atas;</p></li>\n<li><p>acordos;</p></li>\n<li><p>cobranças formais;</p></li>\n<li><p>envolvimento de lideranças;</p></li>\n<li><p>decisões;</p></li>\n<li><p>confirmações;</p></li>\n<li><p>assuntos que exigem histórico.</p></li>\n</ul>\n<h3 id=\"reunião\"><strong>Reunião</strong></h3>\n<p>Deve ser utilizada quando:</p>\n<ul>\n<li><p>existem diferentes envolvidos;</p></li>\n<li><p>há necessidade de decisão;</p></li>\n<li><p>o assunto é complexo;</p></li>\n<li><p>mensagens estão gerando ruído;</p></li>\n<li><p>existe conflito de entendimento.</p></li>\n</ul>\n<h2 id=\"cadência-de-follow-up\"><strong>Cadência de\nfollow-up</strong></h2>\n<p>A cadência depende da urgência e do impacto.</p>\n<p>Uma sequência possível:</p>\n<ol type=\"1\">\n<li><p>primeiro contato;</p></li>\n<li><p>lembrete;</p></li>\n<li><p>reforço com impacto;</p></li>\n<li><p>inclusão da liderança;</p></li>\n<li><p>registro do risco.</p></li>\n</ol>\n<h2 id=\"cobrança-adequada\"><strong>Cobrança adequada</strong></h2>\n<p>Evitar:</p>\n<p>“Conseguiu ver?”</p>\n<p>Preferir:</p>\n<p>“Precisamos da validação dos usuários até quarta-feira para manter o\ninício do processo na data combinada. Você consegue confirmar o envio\naté o fim do dia?”</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#3a3080\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"148\" rx=\"14\" fill=\"#C41E68\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">WhatsApp</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">E-mail e reunião</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">alinhamento rápido</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">lembrete</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">decisão formal</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">histórico</text><text x=\"520\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">envolvimento de liderança</text></svg><div class=\"diagram-caption\">O canal certo depende do peso da decisão, não da urgência do momento</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l47", "title": "8. Organização da carteira no Monday", "html": "<h1 id=\"organização-da-carteira-no-monday\"><strong>8. ORGANIZAÇÃO DA\nCARTEIRA NO MONDAY</strong></h1>\n<p>O <strong>Monday</strong> é o ambiente oficial para acompanhamento da carteira.</p>\n<p>O registro precisa permitir que outra pessoa compreenda a situação da\nconta sem depender da memória do CS.</p>\n<h2 id=\"informações-obrigatórias\"><strong>Informações\nobrigatórias</strong></h2>\n<p>O registro da conta precisa conter:</p><ul>\n<li><p>dados do cliente;</p></li>\n<li><p>ponto focal;</p></li>\n<li><p>referência executiva;</p></li>\n<li><p>responsáveis técnicos;</p></li>\n<li><p>objetivo;</p></li>\n<li><p>escopo;</p></li>\n<li><p>status;</p></li>\n<li><p>última reunião;</p></li>\n<li><p>próxima reunião;</p></li>\n<li><p>pendências;</p></li>\n<li><p>riscos;</p></li>\n<li><p>integrações;</p></li>\n<li><p><strong>Health Score</strong>;</p></li>\n<li><p><strong>NPS</strong>;</p></li>\n<li><p>planos de ação;</p></li>\n<li><p>oportunidades de <strong>upsell</strong>;</p></li>\n<li><p>histórico relevante.</p></li>\n</ul><p>Esse é o mínimo para que qualquer pessoa da Meu Cliente, ao abrir a conta, entenda a situação sem precisar perguntar nada ao CS responsável.</p>\n<h2 id=\"padrão-de-atualização\"><strong>Padrão de\natualização</strong></h2>\n<p>A conta deve ser atualizada:</p>\n<ul>\n<li><p>após reuniões;</p></li>\n<li><p>após decisões importantes;</p></li>\n<li><p>quando surgir um risco;</p></li>\n<li><p>quando uma pendência mudar;</p></li>\n<li><p>após feedback relevante;</p></li>\n<li><p>quando houver mudança entre os envolvidos;</p></li>\n<li><p>quando uma integração avançar;</p></li>\n<li><p>quando houver alteração na adoção;</p></li>\n<li><p>quando surgir uma oportunidade de upsell.</p></li>\n</ul>\n<h2 id=\"o-que-não-deve-acontecer\"><strong>O que não deve\nacontecer</strong></h2>\n<p>Alguns comportamentos comprometem esse registro, como:</p><ul>\n<li><p>informações apenas em planilhas pessoais;</p></li>\n<li><p>tarefas sem prazo;</p></li>\n<li><p>atas fora da conta;</p></li>\n<li><p>riscos conhecidos sem registro;</p></li>\n<li><p>status desatualizado;</p></li>\n<li><p>reunião realizada sem atualização;</p></li>\n<li><p>dependência da memória do CS.</p></li>\n</ul><p>Cada um desses comportamentos costuma parecer inofensivo isoladamente, mas juntos são o que torna uma conta difícil de entender de fora.</p>\n<h2 id=\"qualidade-do-registro\"><strong>Qualidade do\nregistro</strong></h2>\n<p>Registrar muito não significa registrar bem.</p>\n<p>O conteúdo precisa ser objetivo e ajudar quem acessa a tomar uma\ndecisão.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:560px;display:block;margin:0 auto;\"><rect x=\"14\" y=\"14\" width=\"532\" height=\"164\" rx=\"14\" fill=\"#fff\" stroke=\"#E4E1EE\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#2B2361\">O registro da conta precisa ter</text><circle cx=\"34\" cy=\"57\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 57l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"62\" font-size=\"12\" fill=\"#2B2361\">Ponto focal e referência executiva</text><circle cx=\"34\" cy=\"87\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 87l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"92\" font-size=\"12\" fill=\"#2B2361\">Status atualizado</text><circle cx=\"34\" cy=\"117\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 117l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"122\" font-size=\"12\" fill=\"#2B2361\">Riscos e pendências</text><circle cx=\"34\" cy=\"147\" r=\"9\" fill=\"#F2C230\"/><path d=\"M30 147l3 3 6-6\" stroke=\"#2B2361\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"152\" font-size=\"12\" fill=\"#2B2361\">Health Score e NPS</text></svg><div class=\"diagram-caption\">Se outra pessoa abrir a conta, ela precisa entender tudo sem perguntar nada</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 8}, {"id": "risco", "num": 8, "title": "Health Score, Riscos e Churn", "subtitle": "Como identificar e agir antes do problema crescer", "lessons": [{"id": "l48", "title": "1. Health Score", "html": "<h1 id=\"health-score\"><strong>1. HEALTH SCORE</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<text fill=\"#2B2361\" font-size=\"13.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"24\">Várias dimensões somam para uma classificação</text>\n<g fill=\"#2B2361\" font-size=\"11.5\">\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"150\" x=\"20\" y=\"45\"></rect>\n<text text-anchor=\"middle\" x=\"95\" y=\"65\">Adoção</text>\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"150\" x=\"180\" y=\"45\"></rect>\n<text text-anchor=\"middle\" x=\"255\" y=\"65\">Relacionamento</text>\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"150\" x=\"340\" y=\"45\"></rect>\n<text text-anchor=\"middle\" x=\"415\" y=\"65\">Valor percebido</text>\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"180\" x=\"500\" y=\"45\"></rect>\n<text text-anchor=\"middle\" x=\"590\" y=\"65\">Estabilidade técnica</text>\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"150\" x=\"100\" y=\"90\"></rect>\n<text text-anchor=\"middle\" x=\"175\" y=\"110\">Planos cumpridos</text>\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"150\" x=\"260\" y=\"90\"></rect>\n<text text-anchor=\"middle\" x=\"335\" y=\"110\">Feedbacks e NPS</text>\n<rect fill=\"#F0EFF4\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"180\" x=\"420\" y=\"90\"></rect>\n<text text-anchor=\"middle\" x=\"510\" y=\"110\">Risco de churn</text>\n</g>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\" x1=\"150\" x2=\"180\" y1=\"120\" y2=\"160\"></line>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\" x1=\"350\" x2=\"350\" y1=\"120\" y2=\"160\"></line>\n<line stroke=\"#D9D4EC\" stroke-width=\"2\" x1=\"550\" x2=\"520\" y1=\"120\" y2=\"160\"></line>\n<rect fill=\"#1E8E5A\" height=\"56\" rx=\"12\" width=\"180\" x=\"60\" y=\"168\"></rect>\n<text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"150\" y=\"192\">Seguro</text>\n<text fill=\"#DFF3E8\" font-size=\"10.5\" text-anchor=\"middle\" x=\"150\" y=\"210\">com evidências</text>\n<rect fill=\"#F2C230\" height=\"56\" rx=\"12\" width=\"180\" x=\"260\" y=\"168\"></rect>\n<text fill=\"#2B2361\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"192\">Neutro</text>\n<text fill=\"#6b5716\" font-size=\"10.5\" text-anchor=\"middle\" x=\"350\" y=\"210\">exige atenção</text>\n<rect fill=\"#C0264F\" height=\"56\" rx=\"12\" width=\"180\" x=\"460\" y=\"168\"></rect>\n<text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"550\" y=\"192\">Sob risco</text>\n<text fill=\"#FBD9E1\" font-size=\"10.5\" text-anchor=\"middle\" x=\"550\" y=\"210\">precisa de plano</text>\n</svg><div class=\"diagram-caption\">Como várias dimensões se combinam numa classificação de Health Score</div></div>\n<p><strong>Health Score</strong> é a avaliação estruturada da saúde do cliente.</p>\n<p>Seu objetivo é ajudar o CS a identificar riscos e agir antes que o\nproblema fique maior.</p>\n<h2 id=\"frequência-de-avaliação\"><strong>Frequência de\navaliação</strong></h2>\n<p>A situação do cliente deve ser avaliada em todas as reuniões.</p>\n<p>O CS precisa sair de cada encontro entendendo se a conta melhorou,\npiorou ou permaneceu igual.</p>\n<p>A atualização oficial do Health Score no <strong>Monday</strong> acontece\nmensalmente.</p>\n<p>Isso significa:</p>\n<ul>\n<li><p>avaliar em todas as reuniões;</p></li>\n<li><p>registrar sinais importantes assim que aparecerem;</p></li>\n<li><p>consolidar e atualizar a classificação mensalmente.</p></li>\n</ul>\n<p>O CS não deve esperar o fim do mês para registrar um risco\nurgente.</p>\n<h2 id=\"dimensões-recomendadas\"><strong>Dimensões\nrecomendadas</strong></h2>\n<p>Um Health Score completo costuma olhar para:</p><ul>\n<li><p>adoção;</p></li>\n<li><p>relacionamento;</p></li>\n<li><p>valor percebido;</p></li>\n<li><p>estabilidade técnica;</p></li>\n<li><p>integrações;</p></li>\n<li><p>participação dos envolvidos;</p></li>\n<li><p>cumprimento dos planos;</p></li>\n<li><p>qualidade da operação;</p></li>\n<li><p>feedbacks;</p></li>\n<li><p>risco de <strong>churn</strong>.</p></li>\n</ul><p>Olhar para uma única dessas dimensões costuma distorcer a leitura da conta. Uma boa relação com o ponto focal, por exemplo, não compensa uma adoção baixa.</p>\n<h2 id=\"fontes-de-informação\"><strong>Fontes de informação</strong></h2>\n<p>O Health Score deve considerar:</p>\n<ul>\n<li><p>dados de uso;</p></li>\n<li><p>reuniões;</p></li>\n<li><p>respostas do cliente;</p></li>\n<li><p>cumprimento de tarefas;</p></li>\n<li><p>problemas técnicos;</p></li>\n<li><p>participação das áreas;</p></li>\n<li><p><strong>NPS</strong>;</p></li>\n<li><p>percepção da liderança;</p></li>\n<li><p>evolução dos processos.</p></li>\n</ul>\n<h2 id=\"classificação\"><strong>Classificação</strong></h2>\n<p>A classificação pode ser organizada como:</p>\n<ul>\n<li><p>seguro;</p></li>\n<li><p>neutro;</p></li>\n<li><p>sob risco.</p></li>\n</ul>\n<p>Cada classificação precisa ter evidências.</p>\n<h2 id=\"health-score-não-é-opinião\"><strong>Health Score não é\nopinião</strong></h2>\n<p>O CS não deve classificar uma conta como saudável apenas porque\npossui uma relação agradável com o ponto focal.</p>\n<p>Uma conta pode ter um bom relacionamento e, ao mesmo tempo, baixa\nadoção, processos parados e pouco valor percebido.</p>\n<h2 id=\"dados-precisam-gerar-ação\"><strong>Dados precisam gerar\nação</strong></h2>\n<p>O Health Score não existe para preencher um campo.</p>\n<p><strong>Dado sem ação não vale nada.</strong></p>\n<p>Se a conta está neutra ou sob risco, é necessário definir:</p>\n<ul>\n<li><p>qual é a causa;</p></li>\n<li><p>qual é a evidência;</p></li>\n<li><p>o que será feito;</p></li>\n<li><p>quem é o responsável;</p></li>\n<li><p>qual é o prazo;</p></li>\n<li><p>como a evolução será acompanhada.</p></li>\n</ul>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 460 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"400\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Sinais</tspan><tspan x=\"60\" dy=\"13\">coletados</tspan></text><polygon points=\"140,38 150,42 140,46\" fill=\"#C41E68\"/><circle cx=\"230\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"230\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"230\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"230\" dy=\"0\">Classificação</tspan></text><polygon points=\"310,38 320,42 310,46\" fill=\"#C41E68\"/><circle cx=\"400\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"400\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"400\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"400\" dy=\"0\">Ação</tspan><tspan x=\"400\" dy=\"13\">definida</tspan></text></svg><div class=\"diagram-caption\">Classificar sem agir é o mesmo que não ter classificado</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2.2 0 3.6 1.4 4 2 .4-.6 1.8-2 4-2 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l49", "title": "2. Identificação e gestão de riscos", "html": "<h1 id=\"identificação-e-gestão-de-riscos\"><strong>2. IDENTIFICAÇÃO E\nGESTÃO DE RISCOS</strong></h1>\n<p>Risco é qualquer situação que possa comprometer a adoção, a percepção\nde valor, o relacionamento ou a continuidade do cliente.</p>\n<h2 id=\"sinais-de-risco\"><strong>Sinais de risco</strong></h2>\n<p>Vale ficar atento a sinais como:</p><ul>\n<li><p>redução de uso;</p></li>\n<li><p>processos abandonados;</p></li>\n<li><p>reuniões canceladas;</p></li>\n<li><p>falta de resposta;</p></li>\n<li><p>saída de uma pessoa importante;</p></li>\n<li><p>troca de liderança;</p></li>\n<li><p>integração parada;</p></li>\n<li><p>reclamações recorrentes;</p></li>\n<li><p>ausência de resultados;</p></li>\n<li><p>expectativa fora do escopo;</p></li>\n<li><p>controles paralelos;</p></li>\n<li><p>baixa participação;</p></li>\n<li><p>problema técnico sem solução;</p></li>\n<li><p>ponto focal sem influência.</p></li>\n</ul><p>Nenhum desses sinais, isolado, significa necessariamente um problema grave. Mas ignorar vários deles ao mesmo tempo costuma custar caro mais adiante.</p>\n<h2 id=\"como-registrar-um-risco\"><strong>Como registrar um\nrisco</strong></h2>\n<p>O registro deve conter:</p>\n<ul>\n<li><p>descrição;</p></li>\n<li><p>evidência;</p></li>\n<li><p>impacto;</p></li>\n<li><p>probabilidade;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>plano de ação;</p></li>\n<li><p>prazo;</p></li>\n<li><p>necessidade de envolver a liderança;</p></li>\n<li><p>status.</p></li>\n</ul>\n<h2 id=\"risco-não-deve-ser-escondido\"><strong>Risco não deve ser\nescondido</strong></h2>\n<p>Classificar uma conta como sob risco não significa que o CS perdeu o\ncontrole.</p>\n<p>Significa que a empresa identificou o problema e poderá agir.</p>\n<h2 id=\"gestão-preventiva\"><strong>Gestão preventiva</strong></h2>\n<p>O melhor momento para tratar um risco é antes de o cliente comunicar\na intenção de cancelamento.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 640 90\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"580\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Sinal</tspan></text><polygon points=\"120,38 130,42 120,46\" fill=\"#C41E68\"/><circle cx=\"190\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"190\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"190\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"190\" dy=\"0\">Análise</tspan></text><polygon points=\"250,38 260,42 250,46\" fill=\"#C41E68\"/><circle cx=\"320\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"320\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"320\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"320\" dy=\"0\">Plano</tspan></text><polygon points=\"380,38 390,42 380,46\" fill=\"#C41E68\"/><circle cx=\"450\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"450\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"450\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"450\" dy=\"0\">Responsável</tspan></text><polygon points=\"510,38 520,42 510,46\" fill=\"#C41E68\"/><circle cx=\"580\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"580\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"580\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"580\" dy=\"0\">Acompanhamento</tspan></text></svg><div class=\"diagram-caption\">Um risco só está sob controle quando tem plano, dono e acompanhamento</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2.2 0 3.6 1.4 4 2 .4-.6 1.8-2 4-2 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l50", "title": "3. Churn e plano de recuperação", "html": "<h1 id=\"churn-e-plano-de-recuperação\"><strong>3. CHURN E PLANO DE\nRECUPERAÇÃO</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:600px;display:block;margin:0 auto;\" viewbox=\"0 0 640 105\" xmlns=\"http://www.w3.org/2000/svg\"><line stroke=\"#D9D4EC\" stroke-width=\"3\" x1=\"60\" x2=\"580\" y1=\"45\" y2=\"45\"></line><circle cx=\"60\" cy=\"45\" fill=\"#2B2361\" r=\"20\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"60\" y=\"50\">1</text><text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"60\" y=\"82\"><tspan dy=\"0\" x=\"60\">Diagnóstico</tspan></text><circle cx=\"233\" cy=\"45\" fill=\"#3a3080\" r=\"20\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"233\" y=\"50\">2</text><text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"233\" y=\"82\"><tspan dy=\"0\" x=\"233\">Causa</tspan><tspan dy=\"13\" x=\"233\">principal</tspan></text><circle cx=\"407\" cy=\"45\" fill=\"#C41E68\" r=\"20\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"407\" y=\"50\">3</text><text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"407\" y=\"82\"><tspan dy=\"0\" x=\"407\">Ação</tspan><tspan dy=\"13\" x=\"407\">imediata</tspan></text><circle cx=\"580\" cy=\"45\" fill=\"#1E8E5A\" r=\"20\"></circle><text fill=\"#fff\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"580\" y=\"50\">4</text><text fill=\"#2B2361\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"580\" y=\"82\"><tspan dy=\"0\" x=\"580\">Acompanhamento</tspan></text></svg><div class=\"diagram-caption\">As quatro etapas de um plano de recuperação</div></div>\n<p>Churn é a perda de um cliente ou de receita contratada.</p>\n<p>No Enterprise, o <strong>churn</strong> raramente começa no dia em que o cliente\ncomunica sua decisão.</p>\n<p>Normalmente, ele é resultado de uma sequência de sinais que não foram\ntratados.</p>\n<h2 id=\"possíveis-causas\"><strong>Possíveis causas</strong></h2>\n<p>Entre as causas mais comuns estão:</p><ul>\n<li><p>baixa adoção;</p></li>\n<li><p>falta de valor percebido;</p></li>\n<li><p>problema técnico;</p></li>\n<li><p>integração não concluída;</p></li>\n<li><p>mudança de estratégia;</p></li>\n<li><p>troca de liderança;</p></li>\n<li><p>perda de uma pessoa importante para o projeto;</p></li>\n<li><p>expectativa incorreta;</p></li>\n<li><p>escopo inadequado;</p></li>\n<li><p>concorrência;</p></li>\n<li><p>relacionamento distante;</p></li>\n<li><p>problemas de usabilidade;</p></li>\n<li><p>processo interno desorganizado.</p></li>\n</ul><p>Identificar a causa real, e não só o sintoma mais visível, é o que diferencia um plano de recuperação eficaz de uma tentativa genérica de agradar o cliente.</p>\n<h2 id=\"plano-de-recuperação\"><strong>Plano de recuperação</strong></h2>\n<p>O plano deve conter:</p>\n<ol type=\"1\">\n<li><p>diagnóstico;</p></li>\n<li><p>motivo principal;</p></li>\n<li><p>envolvidos;</p></li>\n<li><p>ação imediata;</p></li>\n<li><p>responsáveis;</p></li>\n<li><p>prazo;</p></li>\n<li><p>resultado esperado;</p></li>\n<li><p>frequência de acompanhamento;</p></li>\n<li><p>necessidade de envolvimento da liderança.</p></li>\n</ol>\n<h2 id=\"perguntas-necessárias\"><strong>Perguntas\nnecessárias</strong></h2>\n<p>Antes de agir, vale responder:</p><ul>\n<li><p>O cliente ainda percebe valor?</p></li>\n<li><p>Qual processo foi interrompido?</p></li>\n<li><p>Quem participou da decisão?</p></li>\n<li><p>Existe possibilidade real de recuperação?</p></li>\n<li><p>O problema é produto, processo, relacionamento ou\nestratégia?</p></li>\n<li><p>Existe algum compromisso não cumprido?</p></li>\n<li><p>O que pode gerar uma melhoria perceptível no curto\nprazo?</p></li>\n</ul><p>Essas respostas ajudam a decidir se vale investir energia numa recuperação ou se o caminho é apenas garantir uma saída organizada.</p>\n<h2 id=\"postura-do-cs\"><strong>Postura do CS</strong></h2>\n<p>O CS não deve tentar salvar uma conta apenas oferecendo mais\ntreinamentos.</p>\n<p>Treinamento resolve falta de conhecimento.</p>\n<p>Não resolve sozinho ausência de prioridade, problema técnico, falta\nde apoio da liderança ou desalinhamento de escopo.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 700 152\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\"><rect x=\"30\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#1E8E5A\"/><rect x=\"370\" y=\"15\" width=\"300\" height=\"122\" rx=\"14\" fill=\"#C0264F\"/><text x=\"180\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Cliente recuperável</text><text x=\"520\" y=\"45\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">Saída inevitável</text><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">ainda vê valor</text><text x=\"180\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">problema pontual</text><text x=\"520\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">decisão estratégica</text><text x=\"520\" y=\"94\" text-anchor=\"middle\" font-size=\"12\" fill=\"#fff\">sem espaço para ajuste</text></svg><div class=\"diagram-caption\">Nem todo sinal de cancelamento é uma conta perdida, mas exige diagnóstico rápido</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2.2 0 3.6 1.4 4 2 .4-.6 1.8-2 4-2 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 3}, {"id": "indicadores", "num": 9, "title": "NPS e Indicadores", "subtitle": "Medindo percepção de valor e resultado", "lessons": [{"id": "l51", "title": "1. NPS e tratamento de feedbacks", "html": "<h1 id=\"nps-e-tratamento-de-feedbacks\"><strong>1. NPS E TRATAMENTO DE\nFEEDBACKS</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text fill=\"#2B2361\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"26\">De 0 a 10, o quanto você indicaria a Meu Cliente a um colega?</text>\n<rect fill=\"#C41E68\" height=\"46\" rx=\"10\" width=\"252\" x=\"40\" y=\"55\"></rect>\n<rect fill=\"#F2C230\" height=\"46\" rx=\"10\" width=\"108\" x=\"296\" y=\"55\"></rect>\n<rect fill=\"#2B2361\" height=\"46\" rx=\"10\" width=\"252\" x=\"408\" y=\"55\"></rect>\n<text fill=\"#fff\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"166\" y=\"83\">0 a 6</text>\n<text fill=\"#2B2361\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"83\">7 a 8</text>\n<text fill=\"#fff\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" x=\"534\" y=\"83\">9 a 10</text>\n<text fill=\"#C41E68\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"166\" y=\"122\">Detratores</text>\n<text fill=\"#B8901A\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"122\">Neutros</text>\n<text fill=\"#2B2361\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"534\" y=\"122\">Promotores</text>\n<text fill=\"#5B5578\" font-size=\"11\" text-anchor=\"middle\" x=\"166\" y=\"140\">insatisfeitos, risco de churn</text>\n<text fill=\"#5B5578\" font-size=\"11\" text-anchor=\"middle\" x=\"350\" y=\"140\">satisfeitos, sem entusiasmo</text>\n<text fill=\"#5B5578\" font-size=\"11\" text-anchor=\"middle\" x=\"534\" y=\"140\">defendem a Meu Cliente</text>\n<rect fill=\"#F0EFF4\" height=\"38\" rx=\"10\" stroke=\"#E4E1EE\" width=\"460\" x=\"120\" y=\"172\"></rect>\n<text fill=\"#2B2361\" font-size=\"13.5\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"196\">NPS  =  % Promotores  −  % Detratores</text>\n</svg><div class=\"diagram-caption\">A escala de NPS e como ela separa detratores, neutros e promotores</div></div>\n<p>O <strong>NPS</strong> mede a disposição do cliente em recomendar a empresa.</p>\n<p>É um indicador importante, mas não pode ser analisado sozinho.</p>\n<h2 id=\"classificação\"><strong>Classificação</strong></h2>\n<p>O NPS costuma separar os clientes em três grupos:</p><ul>\n<li><p>promotores;</p></li>\n<li><p>neutros;</p></li>\n<li><p>detratores.</p></li>\n</ul><p>O tratamento muda conforme o grupo, mas o princípio é o mesmo nos três casos: toda resposta merece um retorno, não só as notas baixas.</p>\n<h2 id=\"o-que-fazer-após-a-resposta\"><strong>O que fazer após a\nresposta</strong></h2>\n<h3 id=\"promotor\"><strong>Promotor</strong></h3>\n<p>Com um promotor, o caminho é:</p><ul>\n<li><p>agradecer;</p></li>\n<li><p>entender o motivo;</p></li>\n<li><p>registrar os pontos positivos;</p></li>\n<li><p>identificar práticas que podem ser repetidas.</p></li>\n</ul><p>Um promotor bem trabalhado costuma se tornar uma referência útil em conversas com outros clientes ou até em cases da Meu Cliente.</p>\n<h3 id=\"neutro\"><strong>Neutro</strong></h3>\n<p>Com um neutro, o caminho é:</p><ul>\n<li><p>compreender o que impede uma avaliação melhor;</p></li>\n<li><p>identificar expectativas;</p></li>\n<li><p>criar um plano quando necessário.</p></li>\n</ul><p>O cliente neutro é, muitas vezes, o mais fácil de converter em promotor, já que normalmente falta pouco para fechar essa percepção.</p>\n<h3 id=\"detrator\"><strong>Detrator</strong></h3>\n<p>Com um detrator, o caminho é:</p><ul>\n<li><p>entrar em contato;</p></li>\n<li><p>ouvir sem interromper;</p></li>\n<li><p>compreender a causa;</p></li>\n<li><p>registrar;</p></li>\n<li><p>envolver os responsáveis;</p></li>\n<li><p>criar um plano;</p></li>\n<li><p>retornar ao cliente;</p></li>\n<li><p>acompanhar até a conclusão.</p></li>\n</ul><p>Ignorar um detrator tende a ser mais caro do que enfrentar a conversa, porque a insatisfação não tratada raramente desaparece sozinha.</p>\n<h2 id=\"feedback-não-é-desenvolvimento-automático\"><strong>Feedback não\né desenvolvimento automático</strong></h2>\n<p>Nem todo feedback precisa virar uma nova funcionalidade.</p>\n<p>O CS deve identificar se o comentário representa:</p>\n<ul>\n<li><p>dúvida;</p></li>\n<li><p>erro;</p></li>\n<li><p>falta de treinamento;</p></li>\n<li><p>problema de processo;</p></li>\n<li><p>necessidade específica;</p></li>\n<li><p>oportunidade de Produto;</p></li>\n<li><p>expectativa fora do escopo.</p></li>\n</ul>\n<h2 id=\"fechamento-do-ciclo\"><strong>Fechamento do ciclo</strong></h2>\n<p>O cliente precisa saber o que aconteceu com seu feedback.</p>\n<p>Mesmo quando a sugestão não será desenvolvida, é necessário retornar\ncom clareza.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 520 103\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"460\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Resposta</tspan><tspan x=\"60\" dy=\"13\">do cliente</tspan></text><polygon points=\"122,38 132,42 122,46\" fill=\"#C41E68\"/><circle cx=\"193\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"193\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"193\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"193\" dy=\"0\">Classificação</tspan></text><polygon points=\"255,38 265,42 255,46\" fill=\"#C41E68\"/><circle cx=\"327\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"327\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"327\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"327\" dy=\"0\">Contato</tspan><tspan x=\"327\" dy=\"13\">de retorno</tspan></text><polygon points=\"388,38 398,42 388,46\" fill=\"#C41E68\"/><circle cx=\"460\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"460\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"460\" y=\"72\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"460\" dy=\"0\">Ação</tspan><tspan x=\"460\" dy=\"13\">gerada</tspan></text></svg><div class=\"diagram-caption\">Toda resposta de NPS merece um retorno, não só as notas baixas</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10M12 20V4M20 20v-7\"/><path d=\"M2 20h20\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}, {"id": "l52", "title": "2. Indicadores do CS Enterprise", "html": "<h1 id=\"indicadores-do-cs-enterprise\"><strong>2. INDICADORES DO CS\nENTERPRISE</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto;\" viewbox=\"0 0 700 300\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#F0EFF4\" height=\"220\" rx=\"14\" stroke=\"#E4E1EE\" width=\"300\" x=\"30\" y=\"20\"></rect>\n<rect fill=\"#2B2361\" height=\"220\" rx=\"14\" width=\"300\" x=\"370\" y=\"20\"></rect>\n<text fill=\"#2B2361\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" x=\"180\" y=\"52\">Atividade</text>\n<text fill=\"#F2C230\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" x=\"520\" y=\"52\">Resultado</text>\n<text fill=\"#5B5578\" font-size=\"11\" text-anchor=\"middle\" x=\"180\" y=\"70\">mostra que algo aconteceu</text>\n<text fill=\"#C9C3E6\" font-size=\"11\" text-anchor=\"middle\" x=\"520\" y=\"70\">mostra que algo mudou</text>\n<rect fill=\"#fff\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"250\" x=\"55\" y=\"90\"></rect>\n<text fill=\"#2B2361\" font-size=\"12\" text-anchor=\"middle\" x=\"180\" y=\"109\">Reunião mensal realizada</text>\n<rect fill=\"#fff\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"250\" x=\"55\" y=\"128\"></rect>\n<text fill=\"#2B2361\" font-size=\"12\" text-anchor=\"middle\" x=\"180\" y=\"147\">Treinamento realizado</text>\n<rect fill=\"#fff\" height=\"30\" rx=\"8\" stroke=\"#E4E1EE\" width=\"250\" x=\"55\" y=\"166\"></rect>\n<text fill=\"#2B2361\" font-size=\"12\" text-anchor=\"middle\" x=\"180\" y=\"185\">Usuário cadastrado</text>\n<rect fill=\"#3a3080\" height=\"30\" rx=\"8\" width=\"250\" x=\"395\" y=\"90\"></rect>\n<text fill=\"#fff\" font-size=\"12\" text-anchor=\"middle\" x=\"520\" y=\"109\">Processo adotado na rotina</text>\n<rect fill=\"#3a3080\" height=\"30\" rx=\"8\" width=\"250\" x=\"395\" y=\"128\"></rect>\n<text fill=\"#fff\" font-size=\"12\" text-anchor=\"middle\" x=\"520\" y=\"147\">Plano de ação concluído</text>\n<rect fill=\"#3a3080\" height=\"30\" rx=\"8\" width=\"250\" x=\"395\" y=\"166\"></rect>\n<text fill=\"#fff\" font-size=\"12\" text-anchor=\"middle\" x=\"520\" y=\"185\">Upsell fechado</text>\n<rect fill=\"#FFF7E0\" height=\"34\" rx=\"9\" stroke=\"#F1DFA0\" width=\"460\" x=\"120\" y=\"255\"></rect>\n<text fill=\"#B8901A\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"277\">Atividade sozinha não garante resultado</text>\n</svg><div class=\"diagram-caption\">Indicador de atividade mostra que algo aconteceu. Indicador de resultado mostra que algo mudou.</div></div>\n<p>Os indicadores devem mostrar se o cliente está utilizando a\nplataforma, evoluindo e percebendo valor.</p>\n<h2 id=\"indicadores-possíveis\"><strong>Indicadores\npossíveis</strong></h2>\n<p>Alguns indicadores costumam fazer parte do acompanhamento, como:</p><ul>\n<li><p>usuários ativos;</p></li>\n<li><p>frequência de acesso;</p></li>\n<li><p>utilização dos processos;</p></li>\n<li><p>reuniões mensais realizadas;</p></li>\n<li><p>planos de ação concluídos;</p></li>\n<li><p><strong>Health Score</strong>;</p></li>\n<li><p><strong>NPS</strong>;</p></li>\n<li><p>riscos;</p></li>\n<li><p>integrações;</p></li>\n<li><p>chamados;</p></li>\n<li><p>tempo de resposta;</p></li>\n<li><p>processos consolidados;</p></li>\n<li><p>áreas envolvidas;</p></li>\n<li><p><strong>upsell</strong>;</p></li>\n<li><p><strong>churn</strong>.</p></li>\n</ul><p>Nenhum cliente precisa acompanhar todos esses indicadores ao mesmo tempo. O importante é escolher os que fazem sentido para o momento da conta.</p>\n<h2 id=\"todo-indicador-precisa-ter\"><strong>Todo indicador precisa\nter</strong></h2>\n<p>Para ser útil, cada indicador precisa deixar claro:</p><ul>\n<li><p>definição;</p></li>\n<li><p>fonte;</p></li>\n<li><p>frequência;</p></li>\n<li><p>responsável;</p></li>\n<li><p>meta ou referência;</p></li>\n<li><p>interpretação;</p></li>\n<li><p>ação esperada.</p></li>\n</ul><p>Um indicador sem essas definições vira só um número bonito no relatório, sem nenhuma utilidade prática para a gestão da conta.</p>\n<h2 id=\"exemplo\"><strong>Exemplo</strong></h2>\n<p>Indicador: reuniões mensais realizadas.</p>\n<p>Realizar a reunião não representa sucesso por si só.</p>\n<p>Também é necessário observar:</p>\n<ul>\n<li><p>quem participou;</p></li>\n<li><p>quais decisões foram tomadas;</p></li>\n<li><p>quais planos foram concluídos;</p></li>\n<li><p>o que evoluiu desde o último encontro.</p></li>\n</ul>\n<h2 id=\"indicadores-de-atividade-e-resultado\"><strong>Indicadores de\natividade e resultado</strong></h2>\n<h3 id=\"atividade\"><strong>Atividade</strong></h3>\n<p>Exemplos de indicadores de atividade:</p><ul>\n<li><p>reunião realizada;</p></li>\n<li><p>treinamento realizado;</p></li>\n<li><p>usuário cadastrado.</p></li>\n</ul><p>Indicadores de atividade mostram que algo aconteceu, mas não garantem, sozinhos, que o cliente está tendo resultado com a plataforma.</p>\n<h3 id=\"resultado\"><strong>Resultado</strong></h3>\n<p>Exemplos de indicadores de resultado:</p><ul>\n<li><p>processo adotado;</p></li>\n<li><p>usuário ativo;</p></li>\n<li><p>plano concluído;</p></li>\n<li><p>risco reduzido;</p></li>\n<li><p>upsell fechado.</p></li>\n</ul>\n<p>O CS deve acompanhar os dois tipos, mas precisa buscar resultado.</p>\n<p><strong>Dado sem ação não vale nada.</strong></p>\n<p>Um dashboard cheio não melhora uma conta. O que melhora a conta são\nas decisões tomadas a partir das informações.</p>\n<div class=\"diagram-box closing-diagram\"><div class=\"closing-diagram-eyebrow\">Resumo visual</div><svg viewBox=\"0 0 640 90\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto;\"><line x1=\"60\" y1=\"42\" x2=\"580\" y2=\"42\" stroke=\"#E4E1EE\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"60\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">1</text><text x=\"60\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"60\" dy=\"0\">Dado</tspan></text><polygon points=\"120,38 130,42 120,46\" fill=\"#C41E68\"/><circle cx=\"190\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"190\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">2</text><text x=\"190\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"190\" dy=\"0\">Análise</tspan></text><polygon points=\"250,38 260,42 250,46\" fill=\"#C41E68\"/><circle cx=\"320\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"320\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">3</text><text x=\"320\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"320\" dy=\"0\">Decisão</tspan></text><polygon points=\"380,38 390,42 380,46\" fill=\"#C41E68\"/><circle cx=\"450\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"450\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">4</text><text x=\"450\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"450\" dy=\"0\">Ação</tspan></text><polygon points=\"510,38 520,42 510,46\" fill=\"#C41E68\"/><circle cx=\"580\" cy=\"42\" r=\"18\" fill=\"#2B2361\"/><text x=\"580\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#fff\">5</text><text x=\"580\" y=\"78\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#2B2361\"><tspan x=\"580\" dy=\"0\">Resultado</tspan></text></svg><div class=\"diagram-caption\">Dado sem ação não vale nada: o indicador só importa quando vira decisão</div></div><div class=\"lesson-end\"><div class=\"lesson-end-line\"></div><div class=\"lesson-end-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10M12 20V4M20 20v-7\"/><path d=\"M2 20h20\"/></svg></div><div class=\"lesson-end-line\"></div></div>"}], "count": 2}, {"id": "rotina", "num": 10, "title": "Rotina do CS", "subtitle": "O dia a dia, a semana e o mês do CS Enterprise", "lessons": [{"id": "l53", "title": "Rotina diária, semanal e mensal do CS", "html": "<h1 id=\"rotina-diária-semanal-e-mensal-do-cs\"><strong>ROTINA DIÁRIA,\nSEMANAL E MENSAL DO CS</strong></h1><div class=\"diagram-box\"><svg style=\"width:100%;height:auto;max-width:620px;display:block;margin:0 auto;\" viewbox=\"0 0 700 240\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"130\" cy=\"110\" fill=\"none\" r=\"80\" stroke=\"#E4E1EE\" stroke-width=\"2\"></circle>\n<circle cx=\"350\" cy=\"110\" fill=\"none\" r=\"80\" stroke=\"#E4E1EE\" stroke-width=\"2\"></circle>\n<circle cx=\"570\" cy=\"110\" fill=\"none\" r=\"80\" stroke=\"#E4E1EE\" stroke-width=\"2\"></circle>\n<circle cx=\"130\" cy=\"60\" fill=\"#2B2361\" r=\"26\"></circle>\n<text fill=\"#F2C230\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"130\" y=\"66\">Diária</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"130\" y=\"120\">mensagens</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"130\" y=\"136\">pendências críticas</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"130\" y=\"152\">riscos do dia</text>\n<circle cx=\"350\" cy=\"60\" fill=\"#3a3080\" r=\"26\"></circle>\n<text fill=\"#F2C230\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"350\" y=\"66\">Semanal</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"350\" y=\"120\">revisão da carteira</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"350\" y=\"136\">integrações</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"350\" y=\"152\">planos de ação</text>\n<circle cx=\"570\" cy=\"60\" fill=\"#C41E68\" r=\"26\"></circle>\n<text fill=\"#fff\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" x=\"570\" y=\"66\">Mensal</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"570\" y=\"120\">reunião de acompanhamento</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"570\" y=\"136\">Health Score oficial</text>\n<text fill=\"#5B5578\" font-size=\"10.5\" text-anchor=\"middle\" x=\"570\" y=\"152\">NPS e indicadores</text>\n</svg><div class=\"diagram-caption\">A cadência diária, semanal e mensal do CS Enterprise</div></div>\n<h2 id=\"rotina-diária\"><strong>Rotina diária</strong></h2>\n<p>No dia a dia, isso envolve:</p><ul>\n<li><p>acompanhar mensagens;</p></li>\n<li><p>tratar demandas;</p></li>\n<li><p>atualizar tarefas;</p></li>\n<li><p>registrar informações;</p></li>\n<li><p>verificar pendências críticas;</p></li>\n<li><p>acompanhar riscos;</p></li>\n<li><p>manter clientes informados.</p></li>\n</ul><p>É essa rotina que evita que pequenas pendências se acumulem até virar um problema visível para o cliente.</p>\n<h2 id=\"rotina-semanal\"><strong>Rotina semanal</strong></h2>\n<p>Ao longo da semana, isso envolve:</p><ul>\n<li><p>revisar a carteira;</p></li>\n<li><p>acompanhar os sinais do <strong>Health Score</strong>;</p></li>\n<li><p>acompanhar integrações;</p></li>\n<li><p>cobrar planos de ação;</p></li>\n<li><p>revisar próximos encontros;</p></li>\n<li><p>identificar contas sem contato;</p></li>\n<li><p>discutir riscos com a liderança;</p></li>\n<li><p>acompanhar demandas internas;</p></li>\n<li><p>revisar oportunidades de <strong>upsell</strong>.</p></li>\n</ul><p>Reservar um momento fixo na semana para essas atividades evita que elas fiquem sempre para depois, atrás das reuniões do dia a dia.</p>\n<h2 id=\"rotina-mensal\"><strong>Rotina mensal</strong></h2>\n<p>No fechamento do mês, isso envolve:</p><ul>\n<li><p>realizar reuniões de acompanhamento;</p></li>\n<li><p>analisar utilização;</p></li>\n<li><p>revisar os envolvidos;</p></li>\n<li><p>atualizar oficialmente o Health Score;</p></li>\n<li><p>atualizar riscos;</p></li>\n<li><p>avaliar <strong>NPS</strong>;</p></li>\n<li><p>revisar indicadores;</p></li>\n<li><p>revisar oportunidades de upsell;</p></li>\n<li><p>planejar o mês seguinte.</p></li>\n</ul><p>É e
