<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Progresso - Academia CS</title>
  <style>
    :root {
      --bg-dark: #1C1542;
      --bg-panel: #2A225C;
      --gold: #F2C230;
      --gold-hover: #D9A020;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand .mark { background: var(--bg-panel); color: #fff; font-weight: 800; font-size: 14px; padding: 8px 10px; border-radius: 8px; }
    .brand .word { font-weight: 700; font-size: 16px; }
    .brand .word span { color: var(--gold); font-weight: 500; }
    .btn-voltar { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-voltar:hover { background: rgba(255, 255, 255, 0.1); }
    
    .container { max-width: 900px; margin: 40px auto; padding: 0 24px; width: 100%; }
    .header-section { margin-bottom: 32px; }
    .header-section h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .header-section p { color: var(--text-muted); font-size: 15px; }
    
    .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    .card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; }
    
    .profile-info { text-align: center; }
    .avatar-circle { width: 80px; height: 80px; background: var(--gold); color: var(--bg-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; margin: 0 auto 16px; }
    .profile-info h2 { font-size: 20px; margin-bottom: 4px; }
    .profile-info p { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
    .role-badge { display: inline-block; background: rgba(255, 255, 255, 0.1); padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--gold); text-transform: uppercase; }
    
    .progress-overall h3 { font-size: 16px; margin-bottom: 24px; color: var(--text-muted); }
    .progress-big { display: flex; align-items: center; gap: 24px; }
    .pct-number { font-size: 48px; font-weight: 800; color: var(--gold); }
    .progress-bar-container { flex: 1; height: 12px; background: rgba(0, 0, 0, 0.3); border-radius: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--gold); border-radius: 6px; transition: width 1s ease-in-out; }
    
    .modules-list { margin-top: 24px; grid-column: 1 / -1; }
    .module-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); }
    .module-item:last-child { border-bottom: none; }
    .module-info h4 { font-size: 16px; margin-bottom: 4px; }
    .module-info p { font-size: 13px; color: var(--text-muted); }
    .module-status { font-weight: 600; font-size: 14px; }
    
    .status-done { color: #4CAF50; }
    .status-doing { color: var(--gold); }
    .status-pending { color: var(--text-muted); }
  </style>

  <!-- 1. Importando o Supabase pelo CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="topbar">
    <div class="brand" onclick="window.location.href='index.html'">
      <div class="mark">CS</div>
      <div class="word">Academia de CS <span>· Meu Cliente</span></div>
    </div>
    <button class="btn-voltar" onclick="window.location.href='index.html'">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar para Academia
    </button>
  </div>

  <div class="container">
    <div class="header-section">
      <h1>Seu Progresso</h1>
      <p>Acompanhe o seu desenvolvimento na Trilha Enterprise.</p>
    </div>

    <div class="dashboard-grid">
      <div class="card profile-info">
        <div class="avatar-circle" id="userInitials">CS</div>
        <h2 id="userName">Carregando...</h2>
        <p id="userEmail">carregando@email.com</p>
        <span class="role-badge" id="userRole">Membro</span>
      </div>

      <div class="card progress-overall">
        <h3>CONCLUSÃO DA TRILHA</h3>
        <div class="progress-big">
          <div class="pct-number" id="overallPct">0%</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="overallBar" style="width: 0%;"></div>
          </div>
        </div>
        <p style="margin-top: 16px; font-size: 14px; color: var(--text-muted);" id="lessonsCount">
          Buscando dados no Supabase...
        </p>
      </div>

      <div class="card modules-list">
        <h3 style="font-size: 16px; margin-bottom: 16px; color: var(--text-muted);">STATUS POR MÓDULO</h3>
        <div id="modulesContainer">
          <p style="color: var(--text-muted); text-align: center; padding: 20px;">Carregando módulos...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pmflejqdxfkbnfmmlzhd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_IMd55fyxFnwLu_WHnNwI9Q_C_F8DfcN';

    let user = null;
    try {
      const savedUser = localStorage.getItem('resolve_user');
      if (savedUser) {
        user = JSON.parse(savedUser);
        if (user && user.name) {
          document.getElementById('userInitials').textContent = user.initials || 'CS';
          document.getElementById('userName').textContent = user.name;
          document.getElementById('userEmail').textContent = user.email || user.retailer || '';
          document.getElementById('userRole').textContent = (user.role || 'Membro CS').replace('_', ' ');
        }
      } else {
        window.location.href = 'index.html';
      }
    } catch (e) {
      console.error("Erro ao ler usuário:", e);
    }

    async function buscarProgressoSupabase(usuarioId) {
      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 🎯 Buscando na tabela exata do seu print: progresso_academia
        const { data: liçõesFeitas, error } = await supabase
          .from('progresso_academia')
          .select('*')
          .eq('usuario_id', String(usuarioId));

        if (error) throw error;

        const totalAulasCurso = 98;
        const totalFeitas = liçõesFeitas ? liçõesFeitas.length : 0;
        const pct = Math.round((totalFeitas / totalAulasCurso) * 100);

        document.getElementById('overallPct').textContent = pct + '%';
        document.getElementById('overallBar').style.width = pct + '%';
        document.getElementById('lessonsCount').textContent = `${totalFeitas} de ${totalAulasCurso} lições concluídas.`;

        if (totalFeitas > 0) {
          document.getElementById('modulesContainer').innerHTML = `
            <div class="module-item">
              <div class="module-info">
                <h4>Lições Concluídas</h4>
                <p>Progresso salvo no banco</p>
              </div>
              <div class="module-status status-done">${totalFeitas} lição(ões) concluída(s)</div>
            </div>`;
        } else {
          document.getElementById('modulesContainer').innerHTML = `
            <p style="color: var(--text-muted); text-align: center; padding: 20px;">
              Nenhuma lição concluída ainda.
            </p>`;
        }

      } catch (err) {
        console.error("Erro no Supabase:", err);
        document.getElementById('lessonsCount').textContent = "Erro ao carregar dados do Supabase.";
      }
    }

    if (user && user.id) {
      buscarProgressoSupabase(user.id);
    }
  </script>
</body>
</html>
